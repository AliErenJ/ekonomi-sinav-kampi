<script>
Q.t11 = [
{ l: 1, q: "Compared with the long run, short-run demand and supply are generally:",
  o: ["Less price elastic", "More price elastic", "Equally price elastic", "Perfectly elastic"],
  s: "Üreticiler ve tüketiciler fiyat değişimine tam uyum sağlamak için <b>zaman</b> ister. Kısa dönemde alışkanlıklar ve mevcut üretim kapasitesi sabittir, bu yüzden talep ve arz <b>daha az esnektir</b>. Zaman geçtikçe tüketiciler ikame bulur, üreticiler kapasite kurar ve yeni firmalar girer: esneklik artar." },
{ l: 1, q: "Speculation tends to STABILISE prices when people believe that:",
  o: ["Current price changes are only temporary", "Prices will keep moving in the same direction", "Prices will never change", "The government will fix prices"],
  s: "Fiyat düşüşünün <b>geçici</b> olduğuna inanan insanlar 'nasılsa geri yükselecek' diye <b>şimdi alır</b> ve fiyat düşüşü yavaşlar. Fiyat geçici olarak yükselirse 'nasılsa düşecek' diye satarlar, yükseliş frenlenir. Sonuç: dalgalanmalar azalır, buna <b>stabilising speculation</b> denir. Fiyatın aynı yönde devam edeceği beklentisi ise istikrarı bozar." },
{ l: 1, q: "In economics, the difference between risk and uncertainty is that with risk:",
  o: ["The probabilities of the possible outcomes are known", "The outcome is known for certain", "The probabilities are unknown", "There is no chance of a loss"],
  s: "<b>Risk</b>: olası sonuçların <b>olasılıkları bilinir</b> (ör. geçmiş verilerden, bir çiftçi her 10 yılda bir kuraklık olduğunu bilir). <b>Uncertainty</b> (belirsizlik): olasılıklar <b>bilinmez</b> (ör. yeni bir teknolojinin başarısı). Her iki durumda da sonuç kesin değildir ve kayıp mümkündür." },
{ l: 2, q: "Demand for a good increases. Compared with the long run, the short-run effect is likely to be:",
  o: ["A bigger rise in price and a smaller rise in quantity", "A smaller rise in price and a bigger rise in quantity", "No change in price", "A fall in price"],
  s: "Kısa dönemde arz <b>daha az esnektir</b> (dik). Talep sağa kayınca üreticiler hızla daha çok üretemez, bu yüzden etki çoğunlukla <b>fiyata</b> yansır. Uzun dönemde arz esnekleşir (yeni kapasite, yeni firmalar), bu yüzden etki daha çok <b>miktara</b> yansır ve fiyat kısmen geri düşer. Kitabın kuralı: kaymaların kısa dönemde fiyata, uzun dönemde miktara görece daha büyük etkisi vardır." },
{ l: 2, q: "House prices have been rising. Buyers rush to buy before prices rise further, and sellers delay selling hoping for higher prices. This is an example of:",
  o: ["Destabilising speculation", "Stabilising speculation", "The identification problem", "A buffer stock policy"],
  s: "İnsanlar fiyatın <b>aynı yönde devam edeceğini</b> bekliyor. Alıcılar şimdi alıyor → talep sağa kayar. Satıcılar bekliyor → arz sola kayar. İkisi birlikte fiyatı <b>daha da</b> yükseltir: beklenti kendi kendini gerçekleştirir ve dalgalanma büyür. Buna <b>destabilising speculation</b> denir (konut balonları, borsa balonları ve sonrasındaki çöküşler)." },
{ l: 2, q: "How can holding stocks help to reduce the problems of uncertain future prices?",
  o: ["Stocks are built up when prices are low and sold when prices are high, reducing price fluctuations", "Stocks are sold when prices are low to push them lower", "Holding stocks always increases price fluctuations", "Stocks are only used to raise prices permanently"],
  s: "Kitaba göre gelecek fiyat belirsizliğine karşı bir yol <b>stok tutmaktır</b>: fiyatlar düşükken (bol arz) stok biriktirilir, bu da talebi artırıp fiyat düşüşünü sınırlar; fiyatlar yüksekken stok satılır, bu da arzı artırıp fiyat artışını sınırlar. Sonuç: <b>daha az dalgalanma</b>. Bu fikir tarımda devletin <b>tampon stok</b> (buffer stock) politikasına temel oluşturur (Bölüm 3.5)." },
{ l: 3, q: "Oil supplies are suddenly cut. Taking account of the time dimension, which pattern of oil prices is most likely?",
  o: ["Prices rise sharply at first, then fall back partly as demand and supply become more elastic over time", "Prices rise slowly at first and then much faster in the long run", "Prices fall in the short run and rise in the long run", "Prices rise by the same amount in the short and long run"],
  s: "Kısa dönemde petrol talebi ve arzı <b>çok az esnektir</b>: insanlar yine işe arabayla gider, yeni petrol sahası hemen açılamaz. Arz düşünce fiyat <b>çok sert</b> yükselir. Zamanla tüketiciler yakıt tasarruflu araba alır, toplu taşımaya geçer (talep esnekleşir); yeni sahalar ve alternatif enerji devreye girer (arz esnekleşir). Bu yüzden fiyat ilk zirvesinden <b>kısmen geri düşer</b>. 1973 ve 1979 petrol krizlerinde bu görüldü; IR açısından da önemli bir örnek." },
{ l: 3, q: "What is the main purpose of a futures contract for a wheat farmer who agrees today to sell her harvest in six months' time at a fixed price?",
  o: ["To reduce the risk caused by uncertainty about future prices", "To make sure she gets the highest possible price", "To avoid paying taxes", "To increase the price of wheat"],
  s: "<b>Futures market</b> (vadeli işlem piyasası, Box 3.5): bugünden, gelecekteki bir tarihte <b>sabit bir fiyattan</b> alım ya da satım anlaşması yapılır. Çiftçi altı ay sonraki fiyatı bugünden bildiği için plan ve yatırım yapabilir: <b>fiyat belirsizliğinin riski</b> azalır. Karşılığında, fiyat yükselirse o kazancı kaçırır, yani en yüksek fiyatı garantilemez. Riski üstlenen taraf genelde bir spekülatördür." },
{ l: 3, q: "A speculator borrows 1,000 shares and sells them at £10 each. The share price then falls to £7, and she buys 1,000 shares back to return them. Ignoring fees, what is her profit, and what is this called?",
  o: ["£3,000, short selling", "£7,000, short selling", "£3,000, a futures contract", "A loss of £3,000, short selling"],
  s: "<b>Short selling</b> (açığa satış, Box 3.4): sahip olmadığın hisseleri <b>ödünç alıp</b> satarsın, fiyat düşünce ucuza geri alıp iade edersin.<br>Satış geliri: 1,000 × £10 = £10,000<br>Geri alım maliyeti: 1,000 × £7 = £7,000<br>Kâr: £10,000 − £7,000 = <b>£3,000</b> (hisse başına £3).<br>Fiyat yükselseydi zarar ederdi. Çok sayıda açığa satış fiyatı daha da aşağı itebilir: bu, istikrarı bozan spekülasyonun bir biçimidir (2008 krizinde bazı ülkeler geçici olarak yasakladı)." },
];

Q.t12 = [
{ l: 1, q: "A specific tax is:",
  o: ["A fixed amount of tax per unit sold", "A percentage of the price of the good", "A tax on income", "A tax paid only by consumers"],
  s: "<b>Specific tax</b>: satılan her birim için <b>sabit bir miktar</b> (ör. litre benzin başına X ₺, bir paket sigara başına Y ₺). <b>Ad valorem tax</b> ise fiyatın ya da katma değerin <b>yüzdesidir</b> (KDV gibi). Gelir vergisi dolaylı değil doğrudan bir vergidir. Vergiyi kimin 'ödediği' (yük, incidence) esnekliklere bağlıdır." },
{ l: 1, q: "Value added tax (VAT) is an example of:",
  o: ["An ad valorem tax", "A specific tax", "A direct tax on income", "A subsidy"],
  s: "KDV (VAT), fiyatın ya da üretimin her aşamasındaki katma değerin <b>yüzdesi</b> olarak alınır, bu yüzden <b>ad valorem</b> (değer üzerinden) bir vergidir. Mal ne kadar pahalıysa vergi tutarı o kadar büyüktür. Sigara ve alkol üzerindeki özel tüketim vergilerinin (excise duties) bir kısmı ise birim başınadır (specific)." },
{ l: 1, q: "When a specific tax of £2 per unit is imposed on producers of a good, the supply curve:",
  o: ["Shifts upwards (left) by £2 at every quantity", "Shifts downwards by £2", "Does not move; the demand curve shifts", "Becomes vertical"],
  s: "Üreticiler her birim için devlete £2 ödemek zorundadır. Aynı miktarı arz etmeye razı olmaları için fiyatın her miktarda <b>£2 daha yüksek</b> olması gerekir. Bu yüzden arz eğrisi vergi kadar <b>paralel olarak yukarı</b> kayar (aynı şey: sola kayar). Talep eğrisi değişmez; tüketicilerin isteği aynıdır." },
{ l: 2, q: "A tax is imposed on a good with very price-INELASTIC demand. Who bears most of the tax?",
  o: ["Consumers", "Producers", "The government", "It is always shared equally"],
  s: "Talep esnek değilse tüketiciler fiyat artınca da almaya devam eder (ikame yok). Üreticiler vergiyi fiyata yansıtabilir, satışlar fazla düşmez. Bu yüzden yükün çoğu <b>tüketicilerde</b> kalır. Kitabın kuralı: talep <b>ne kadar az esnek</b> ve arz <b>ne kadar esnekse</b>, tüketici yükü o kadar büyüktür. Kısaca: <b>daha az esnek olan taraf yükü taşır</b>." },
{ l: 2, q: "Government tax revenue from an indirect tax will be highest (for a given tax rate) when:",
  o: ["Both demand and supply are price inelastic", "Both demand and supply are price elastic", "Demand is elastic and supply is inelastic", "Demand is perfectly elastic"],
  s: "Vergi geliri = vergi × satılan miktar. Vergi fiyatı yükseltir ve miktarı düşürür. Talep ve arz <b>esnek değilse</b> miktar <b>çok az düşer</b>, vergi geniş bir miktar tabanından alınır → gelir yüksek. Esnek olduklarında miktar çok düşer ve vergi tabanı erir. Bu yüzden devletler sigara, alkol, akaryakıt gibi esnek olmayan talepli malları yüksek vergilendirir." },
{ l: 2, q: "If demand for a good is perfectly inelastic, a specific tax of £1 per unit will cause the price paid by consumers to rise by:",
  o: ["£1, the full amount of the tax", "Nothing", "50p", "More than £1"],
  s: "Talep tamamen esnek değil (dikey talep eğrisi): fiyat ne olursa olsun tüketiciler aynı miktarı alır. Arz eğrisi £1 yukarı kayınca, yeni denge aynı miktarda ama <b>tam £1 yüksek</b> fiyattadır. Tüketiciler verginin <b>tamamını</b> öder, üreticinin eline geçen fiyat değişmez. Tersine, talep tamamen esnek (yatay) olsaydı tüm yük üreticide kalırdı." },
{ l: 3, q: "Demand: Qd = 100 − 5P. Supply: Qs = −20 + 10P. A specific tax of £3 per unit is imposed on producers. What price do consumers now pay, and what price do producers receive after tax?",
  o: ["Consumers pay £10; producers receive £7", "Consumers pay £11; producers receive £8", "Consumers pay £9; producers receive £6", "Consumers pay £8; producers receive £5"],
  s: "Vergiden önce denge: P = 8, Q = 60 (bkz. konu 2.3).<br>Vergiden sonra üretici, tüketicinin ödediği P'den eline P − 3 alır:<br>Qs = −20 + 10(P − 3) = −50 + 10P<br>Denge: 100 − 5P = −50 + 10P → 150 = 15P → <b>Pc = £10</b><br>Üretici fiyatı: Pp = 10 − 3 = <b>£7</b>. Yeni miktar Q = 100 − 50 = 50.<br>Tüketici £2 daha fazla öder (8 → 10), üretici £1 daha az alır (8 → 7). £3'lük verginin 2/3'ü tüketicide, çünkü bu piyasada talep arzdan daha az esnek. £11/£8 seçeneği, vergi tamamen tüketiciye yansımış gibi düşünür." },
{ l: 3, q: "In the same market (Qd = 100 − 5P, Qs = −20 + 10P, tax £3 per unit), how much tax revenue does the government collect, and how much of it is effectively paid by consumers?",
  o: ["Revenue £150, of which consumers pay £100", "Revenue £180, of which consumers pay £120", "Revenue £150, of which consumers pay £50", "Revenue £180, of which consumers pay £60"],
  s: "Vergiden sonra miktar Q = 50 (önceki soru).<br>Vergi geliri = t × Q = £3 × 50 = <b>£150</b>.<br>Tüketicinin payı: birim başına (Pc − P₀) = 10 − 8 = £2 → 2 × 50 = <b>£100</b>.<br>Üreticinin payı: birim başına (P₀ − Pp) = 8 − 7 = £1 → 1 × 50 = £50.<br>£180, vergiden önceki miktarı (60) kullanmaktır: vergi miktarı düşürdüğü için yanlıştır." },
{ l: 3, q: "A government wants to use a tax on cigarettes both to raise a lot of revenue AND to cut smoking substantially. Given that demand for cigarettes is price inelastic, what problem does it face?",
  o: ["The goals conflict: inelastic demand means high revenue but only a small fall in smoking", "There is no problem: inelastic demand means smoking falls sharply and revenue rises", "Inelastic demand means the tax raises very little revenue", "The tax will be borne entirely by producers"],
  s: "Talep esnek değil → vergi fiyatı yükseltse de içiciler büyük ölçüde içmeye devam eder. Sonuç: <b>yüksek vergi geliri</b> ama tüketimde <b>küçük düşüş</b>. Tüketim çok düşseydi gelir de düşerdi; yani iki hedef birbirine <b>terstir</b>. Box 3.6 bir de ahlaki ikilemi tartışır: sigara vergisi yoksulları daha çok etkiler (gelirlerinin daha büyük kısmı), yani <b>regresif</b> olabilir. Esnek olmayan talep yükü üreticiye değil tüketiciye bindirir." },
];

Q.t13 = [
{ l: 1, q: "Providing a service such as hospital treatment free at the point of delivery is similar in its effects to:",
  o: ["A maximum price of zero", "A minimum price above equilibrium", "A tax on the service", "A rise in supply"],
  s: "Kitaba göre analiz bir <b>tavan fiyata</b> benzer, ama tavan fiyat <b>sıfırdır</b>. Fiyat sıfırken talep edilen miktar çok yüksektir ve genellikle sunulabilecek miktarı aşar. Bu yüzden tavan fiyattaki gibi bir <b>kıtlık</b> oluşur." },
{ l: 1, q: "What is the likely result of providing health care free to patients?",
  o: ["Demand exceeds supply, leading to waiting lists", "Supply exceeds demand, leading to empty hospitals", "Prices rise to clear the market", "Demand falls because the service is free"],
  s: "Fiyat sıfırsa insanlar daha fazla tedavi talep eder. Arz (doktor, yatak) sınırlıdır. Fiyat yükselip piyasayı temizleyemediği için <b>Qd &gt; Qs</b> → kıtlık, <b>bekleme listeleri</b> (waiting lists) ve ihtiyaca göre öncelik. Kitap sağlıkta talebin hızla büyüdüğünü (yaşlanan nüfus, yeni ve pahalı tedaviler) ve sorunun giderek büyüdüğünü belirtir." },
{ l: 1, q: "If the government prohibits a product such as certain drugs, what is likely to happen?",
  o: ["An illegal market will develop", "Consumption will fall to zero", "The price will fall to zero", "Supply will increase"],
  s: "Yasak, malın arzını ve talebini ortadan kaldırmaz; sadece yasadışı hâle getirir. Hâlâ almak isteyenler ve yüksek kâr için risk alan satıcılar olduğu için <b>yasadışı bir piyasa</b> (illegal market) gelişir. Tüketim genelde serbest piyasaya göre düşer ama sıfıra inmez." },
{ l: 2, q: "For a type of hospital treatment, demand is Qd = 600 − 20P and the hospital can supply a fixed 400 treatments. If treatment is free, what is the shortage?",
  o: ["200 treatments", "400 treatments", "600 treatments", "No shortage"],
  s: "Ücretsiz → P = 0.<br>Qd = 600 − 20(0) = <b>600</b> tedavi talep edilir.<br>Qs = <b>400</b> (sabit).<br>Kıtlık = 600 − 400 = <b>200 tedavi</b>. Bu 200 kişi bekleme listesine girer ya da başka yollarla (ihtiyaç önceliği, özel hastane) karşılanır. 600 talep, 400 arzdır; ikisi de kıtlık değildir." },
{ l: 2, q: "Compared with a free market, how are demand and supply affected when a drug is made illegal?",
  o: ["Both demand and supply are lower", "Both demand and supply are higher", "Demand is higher, supply is lower", "Neither changes"],
  s: "Yasak hem alıcıları hem satıcıları cezalandırır. Bazı kullanıcılar ceza riski ve ahlaki/sosyal baskı yüzünden almaktan vazgeçer → <b>talep sola</b> kayar. Bazı satıcılar hapis riski yüzünden piyasadan çıkar ve satışın maliyeti artar → <b>arz sola</b> kayar. Kitaba göre sonuçta hem talep hem arz serbest piyasadakinden <b>düşüktür</b>, bu yüzden satılan miktar azalır." },
{ l: 2, q: "Under prohibition, penalties on SUPPLIERS are very harsh and they are likely to be caught, while users face small penalties. Compared with a free market, the price is likely to be:",
  o: ["Higher, because supply falls much more than demand", "Lower, because demand falls much more than supply", "The same, because both curves shift equally", "Zero, because the product is illegal"],
  s: "Kitabın kuralı: fiyatın daha yüksek mi düşük mü olacağı, <b>kimin daha ağır cezayla ve daha yüksek yakalanma olasılığıyla</b> karşılaştığına bağlıdır. Burada risk satıcılarda → <b>arz çok sola</b> kayar, talep az kayar → fiyat serbest piyasadakinden <b>daha yüksek</b> olur. Ceza ağırlıkla kullanıcılara uygulansaydı talep daha çok düşer ve fiyat daha düşük olabilirdi." },
{ l: 3, q: "For the treatment with demand Qd = 600 − 20P and fixed supply of 400, what price would eliminate the waiting list, and why might the government still not charge it?",
  o: ["£10; many people believe access to health care should depend on need, not ability to pay", "£20; because the hospital would make a loss", "£30; because demand would fall to zero", "£10; because charging would increase the waiting list"],
  s: "Bekleme listesini kaldıran fiyat, piyasayı temizleyen fiyattır: Qd = Qs<br>600 − 20P = 400 → 20P = 200 → <b>P = £10</b>.<br>Bu fiyatta 400 kişi tedavi olur, liste kalmaz. Peki neden alınmaz? Kitaba göre çoğu insan sağlık ve eğitimin bir <b>hak</b> olduğunu, erişimin <b>ödeme gücüne değil ihtiyaca</b> bağlı olması gerektiğini düşünür (yoksullar tedaviden mahrum kalmamalı). Ayrıca sağlık ve eğitim herkese fayda sağlar. Bu bir <b>normatif</b> tercihtir." },
{ l: 3, q: "Which statement correctly compares using a tax with using a ban (prohibition) to reduce consumption of a harmful product?",
  o: ["Both can reduce consumption, but a tax raises revenue and keeps the market legal, whereas a ban raises no revenue and may encourage related crime", "A ban always raises the price, whereas a tax always lowers it", "A tax creates an illegal market, whereas a ban does not", "They have exactly the same effects on price, crime and government revenue"],
  s: "Kitaba göre vergiyle de yasakla benzer bir tüketim düşüşü sağlanabilir, ama <b>diğer etkiler farklıdır</b>:<br>• <b>Fiyat</b>: vergide fiyat kesin yükselir; yasakta daha yüksek ya da düşük olabilir.<br>• <b>Gelir</b>: vergi devlete gelir sağlar; yasak sağlamaz (üstelik denetim maliyeti vardır).<br>• <b>Suç</b>: yasak, yasadışı piyasa ve ona bağlı suçları besleyebilir.<br>• <b>Algı</b>: yasal ve vergili ürün toplumda daha 'kabul edilebilir' görülebilir.<br>Çok yüksek vergi de kaçakçılığa yol açabilir ama vergi kendi başına yasadışı piyasa yaratmaz." },
{ l: 3, q: "A government bans a drug and decides to punish USERS very heavily, while dealers face only light penalties and are rarely caught. Compared with a free market, what is the likely outcome?",
  o: ["Quantity falls, and the price may be lower than in a free market, because demand falls much more than supply", "Quantity rises and the price rises", "Quantity falls and the price must be higher than in a free market", "Neither price nor quantity changes, because dealers are not affected"],
  s: "Ceza ve yakalanma riski ağırlıkla <b>kullanıcılarda</b> → birçok kişi almaktan vazgeçer → <b>talep çok sola</b> kayar. Satıcıların riski düşük → <b>arz az sola</b> kayar.<br>• Miktar: iki eğri de sola kaydığı için <b>kesin düşer</b>.<br>• Fiyat: talep, arzdan çok daha fazla düştüğü için fiyat serbest piyasadakinden <b>düşük</b> bile olabilir.<br>Önceki sorunun tersi: orada ceza satıcılardaydı ve fiyat yükseliyordu. Kitabın kuralı: fiyat, <b>kimin daha ağır cezayla ve yakalanma olasılığıyla</b> karşılaştığına bağlıdır. 'Fiyat mutlaka yükselir' yanlıştır." },
];

Q.t14 = [
{ l: 1, q: "Why are individual farmers described as price takers?",
  o: ["Each farmer is tiny relative to the whole market, so cannot influence the price", "The government sets all agricultural prices", "Farmers always accept low prices voluntarily", "Demand for food is perfectly elastic for the whole market"],
  s: "Tarım piyasasında <b>binlerce küçük çiftçi</b> vardır ve her biri piyasanın toplamına göre önemsizdir. Bir çiftçi üretimini iki katına çıkarsa bile piyasa fiyatı değişmez, bu yüzden fiyatı olduğu gibi <b>kabul eder</b>: price taker. Kitap bu yüzden serbest tarım piyasasının <b>tam rekabete</b> en yakın gerçek piyasa olduğunu söyler." },
{ l: 1, q: "Agricultural prices fluctuate a lot mainly because:",
  o: ["Supply fluctuates with harvests, and demand is price inelastic", "Demand fluctuates a lot, and supply is perfectly elastic", "Farmers change their prices every day", "Governments change taxes every year"],
  s: "Kitabın özeti: fiyat dalgalanmaları, <b>dalgalanan arzın</b> (hava ve hasada bağlı) <b>fiyat esnek olmayan talep</b> ile birleşmesinin sonucudur. Talep eğrisi dik olduğu için arzdaki küçük kaymalar fiyatta <b>büyük</b> değişimlere yol açar. Bu da çiftçi gelirlerini oynak yapar, tahmin ve yatırımı zorlaştırır." },
{ l: 1, q: "In the EU, 'set-aside' refers to:",
  o: ["Paying farmers to leave some of their land uncultivated", "Storing surplus food in warehouses", "Taxing imported food", "Setting a minimum price for crops"],
  s: "<b>Set-aside</b>, AB'de 1988'de başlayan bir <b>arzı azaltma</b> yöntemidir: çiftçilere topraklarının bir kısmını (ör. %10) <b>boş bırakmaları</b> karşılığında ödeme yapılır. Amaç, yüksek destek fiyatlarının yarattığı fazlaları azaltmaktır. Sorun: çiftçiler en verimsiz topraklarını boş bıraktı, bu yüzden üretim beklenenden az düştü. 2008 reformlarıyla sona erdirildi." },
{ l: 2, q: "One farmer having a bumper harvest becomes richer. But if ALL farmers have a bumper harvest, their total income may fall. This is an example of:",
  o: ["The fallacy of composition", "The identification problem", "Destabilising speculation", "The law of supply"],
  s: "<b>Fallacy of composition</b> (bileşim hatası, Box 3.7): bir birey için doğru olanın herkes için de doğru olduğunu varsaymak. Tek çiftçinin iyi hasadı piyasa fiyatını değiştirmez, daha çok satar ve kazanır. Ama <b>tüm</b> çiftçiler iyi hasat yaparsa piyasa arzı büyük ölçüde artar; talep fiyat esnek olmadığı için fiyat <b>oransal olarak daha çok</b> düşer ve toplam gelir azalır." },
{ l: 2, q: "Which statement about a buffer stock scheme is correct?",
  o: ["It can stabilise prices, but it cannot raise farm incomes over time", "It permanently raises farm prices and incomes", "It increases price fluctuations", "It works by paying farmers not to produce"],
  s: "<b>Buffer stock</b> (tampon stok): bol hasat yıllarında devlet (ya da kurum) ürün satın alıp stoklar, fiyatın çok düşmesini engeller; kıt yıllarda stoktan satar, fiyatın çok yükselmesini engeller. Böylece fiyat ortalama civarında <b>istikrarlı</b> kalır. Ama ortalama fiyatı yükseltmediği için çiftçilerin uzun dönemdeki gelirini <b>artıramaz</b> (fiyat ortalamanın üstünde tutulursa stoklar sürekli büyür). Çiftçiye üretmemesi için ödeme set-aside'dır." },
{ l: 2, q: "Why do farm incomes tend to fall in the long run in a free market?",
  o: ["Demand for food grows slowly (income inelastic), while supply grows rapidly with new technology, and demand is price inelastic", "Demand for food is income elastic and grows faster than supply", "Supply of food is falling over time", "Food is an inferior good"],
  s: "Uzun dönem sorunu iki yönlüdür:<br>• <b>Talep</b>: gıdanın gelir esnekliği düşüktür (0 &lt; YED &lt; 1), gelir artınca talep <b>yavaş</b> büyür.<br>• <b>Arz</b>: yeni teknoloji ve tarım yöntemleri sayesinde <b>hızla</b> büyür.<br>Arz talepten hızlı arttığı için fiyatlar <b>aşağı</b> baskı altındadır. Talep fiyat esnek olmadığı için fiyat düşüşü gelirleri daha da azaltır. Gıda düşük mal değildir: gelir artınca talebi biraz artar." },
{ l: 3, q: "A bumper harvest increases the supply of wheat by 20%. If the price elasticity of demand for wheat is −0.25, by approximately how much must the price fall for the extra wheat to be sold?",
  o: ["80%", "5%", "20%", "25%"],
  s: "Ek 20% buğdayın satılması için talep edilen miktarın %20 artması gerekir.<br>PED = %ΔQ / %ΔP → %ΔP = %ΔQ / PED = 20% / (−0.25) = <b>−80%</b>.<br>Fiyat yaklaşık %80 düşmelidir (yaklaşık bir hesap; bu kadar büyük değişimlerde kesin değer farklı olabilir). Bu, esnek olmayan talebin ne kadar sert fiyat düşüşlerine yol açtığını gösterir. Toplam gelir: yaklaşık 1.2 × 0.2 = 0.24 → eski gelirin dörtte biri! 5% = 20 × 0.25 (yanlış işlem)." },
{ l: 3, q: "Why do critics argue that the traditional CAP system harmed many developing countries?",
  o: ["Surpluses were sold abroad with export subsidies, lowering world prices, while import levies kept developing countries' produce out of the EU", "The CAP gave developing countries too much aid", "The CAP raised world food prices, helping poor farmers", "The CAP banned all food exports"],
  s: "Eski CAP fiyatları dünya fiyatının üstünde tuttu. Bu iki yoldan gelişmekte olan ülkelere zarar verdi:<br>• <b>Değişken ithalat vergileri</b> (variable import levies): ithal ürünleri AB fiyatına kadar pahalılaştırdı, yoksul ülkelerin ihracatını dışarıda tuttu.<br>• <b>İhracat sübvansiyonları</b>: AB fazlası dünya piyasasında ucuza satıldı (dumping), <b>dünya fiyatlarını düşürdü</b> ve oradaki çiftçilerin gelirlerini azalttı.<br>DTÖ müzakerelerinde de büyük konu oldu. Not: kitaba göre reformlarla fiyatlar düşünce AB'ye ayrıcalıklı satış yapan bazı Afrika/Karayip şeker üreticileri ise kaybetti." },
{ l: 3, q: "The 2003 CAP reforms moved towards a 'single farm payment' decoupled from production. What was the main economic purpose?",
  o: ["To support farm incomes without giving farmers an incentive to overproduce, so reducing surpluses", "To raise intervention prices and increase output", "To end all financial support for farmers", "To increase export subsidies"],
  s: "Eski sistemde destek <b>üretime bağlıydı</b>: ne kadar çok üretirsen o kadar çok destek alırdın → fazla üretim, tereyağı dağları, şarap gölleri. <b>Decoupling</b> (üretimden ayırma): ödeme, çiftliğin geçmişte (2000-2002) aldığı desteğe göre ve <b>çevre şartlarına</b> bağlı yapılır, üretilen miktara bağlı değildir. Böylece çiftçi geliri desteklenir ama <b>üretimi artırma teşviki</b> ortadan kalkar → fazlalar azalır, tüketiciye fiyatlar düşer. Destek sona ermedi, vergi mükellefleri finanse etmeye devam etti." },
];

</script>
<script>
const LV = { 1: "Kolay", 2: "Orta", 3: "Zor" };
const KEY = "econ-quiz-v1";
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { answers = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

// Soru kimlikleri: t1-0 ... t14-8. Şıklar kimliğe göre sabit sırayla karıştırılır.
const ALL = [];
TOPICS.forEach(t => Q[t.id].forEach((q, i) => { q.id = t.id + "-" + i; q.topic = t.id; ALL.push(q); }));
function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
function order(q) { const r = seeded(q.id), a = q.o.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const app = document.getElementById("app");
let view = { name: "ozet" }, filter = 0, mixSet = null, mixChapters = [1, 2, 3], resetAsk = false;

function topicStats(id) { const qs = Q[id]; let g = 0, b = 0; qs.forEach(q => { if (q.id in answers) answers[q.id] === 0 ? g++ : b++; }); return { g, b, n: qs.length }; }
function totals() { let g = 0, b = 0; ALL.forEach(q => { if (q.id in answers) answers[q.id] === 0 ? g++ : b++; }); return { g, b, n: ALL.length }; }
function bar(s) { return `<span class="bar"><i class="g" style="width:${s.g / s.n * 100}%"></i><i class="b" style="width:${s.b / s.n * 100}%"></i></span>`; }

function go(name, extra) { view = Object.assign({ name }, extra || {}); filter = 0; resetAsk = false;
  const hash = name === "topic" ? view.id : name === "mix" ? "karisik" : name;
  if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
  render(); window.scrollTo(0, 0); }

function render() {
  const t = totals();
  document.getElementById("score").textContent = `${t.g}/${t.n} doğru`;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current",
    (b.dataset.go === view.name || (b.dataset.go === "sorular" && (view.name === "topic" || view.name === "mix"))) ? "page" : "false"));
  document.getElementById("back").hidden = !(view.name === "topic" || view.name === "mix");
  ({ ozet: renderSummary, sorular: renderTopics, ilerleme: renderProgress, topic: renderTopic, mix: renderMix })[view.name]();
}

function renderSummary() {
  const tbl = h => h.replace(/<table class="tbl">/g, '<div class="tbl-wrap"><table class="tbl">').replace(/<\/table>/g, "</table></div>");
  app.innerHTML = `<div class="eyebrow">Part A + Part B</div><h1>Sınav özeti</h1>
  <p class="lead">Kitabın Part C'den önceki üç bölümü. Her başlığa dokunup aç. İngilizce terimler sınavda çıkacak hâliyle kalın yazıldı.</p>
  <div class="stack">${SUMMARY.map(c => `<section class="card chap">
    <div class="chap-head"><span class="chap-no">${c.ch}</span><div><h2>${c.title}</h2><div class="mute">${c.tr} · ${c.part}</div></div></div>
    ${c.sections.map(s => `<details class="sec" id="sec-${s.code}"><summary><span class="code">${s.code}</span><span><h3>${s.title}</h3><span class="sec-tr">${s.tr}</span></span></summary>
      <div class="sec-body">${tbl(s.html)}<button class="quiz-link" data-quiz="${s.code}">Bu konunun sorularını çöz →</button></div></details>`).join("")}
  </section>`).join("")}</div>`;
}

function renderTopics() {
  let html = `<div class="eyebrow">${ALL.length} soru · 14 konu</div><h1>Sorular</h1>
  <p class="lead">Her konuda 9 soru: 3 kolay, 3 orta, 3 zor. Bir şıkka dokununca hemen cevabı ve ayrıntılı çözümü görürsün. Sorular sınavdaki gibi İngilizce, çözümler Türkçe.</p>
  <div class="card mix"><h3>Karışık deneme sınavı</h3><div class="mute">Seçtiğin bölümlerden rastgele 15 soru.</div>
  <div class="row">${[1, 2, 3].map(c => `<button class="chip" data-mixch="${c}" aria-pressed="${mixChapters.includes(c)}">Bölüm ${c}</button>`).join("")}</div>
  <div class="row"><button class="btn" data-startmix>Denemeyi başlat</button></div></div>`;
  [1, 2, 3].forEach(ch => {
    const c = SUMMARY[ch - 1];
    html += `<div class="chapter-label">Bölüm ${ch} · ${c.title}</div><div class="stack" style="margin-top:8px">`;
    TOPICS.filter(t => t.ch === ch).forEach(t => { const s = topicStats(t.id);
      html += `<button class="card topic" data-topic="${t.id}"><span><span class="code">${t.code}</span> <h3 style="display:inline">${t.title}</h3><span class="sec-tr">${t.tr}</span></span>
      <span class="frac">${s.g}/${s.n}</span><span class="meta">${bar(s)}<span class="frac">${s.g + s.b === s.n ? "bitti" : (s.n - s.g - s.b) + " kaldı"}</span></span></button>`; });
    html += `</div>`;
  });
  app.innerHTML = html;
}

function qCard(q, no) {
  const done = q.id in answers, pick = answers[q.id], ord = order(q);
  const opts = ord.map((oi, k) => { let cls = "";
    if (done) { if (oi === 0) cls = "right"; else if (oi === pick) cls = "wrong"; }
    return `<button class="opt ${cls}" data-q="${q.id}" data-o="${oi}" ${done ? "disabled" : ""}><span class="let">${"ABCD"[k]}</span><span>${q.o[oi]}</span></button>`; }).join("");
  let sol = "";
  if (done) { const ok = pick === 0, letter = "ABCD"[ord.indexOf(0)];
    sol = `<div class="sol ${ok ? "" : "bad"}"><div class="sol-h ${ok ? "ok" : "no"}">${ok ? "Doğru!" : "Yanlış. Doğru cevap: " + letter}</div>${q.s}</div>`; }
  const t = TOPICS.find(x => x.id === q.topic);
  return `<article class="card q" id="q-${q.id}"><div class="q-head"><span class="lvl l${q.l}">${LV[q.l]}</span><span class="qno">Soru ${no}${view.name === "mix" ? " · " + t.code + " " + t.tr : ""}</span></div>
    <p class="q-text">${q.q}</p><div class="opts">${opts}</div>${sol}</article>`;
}

function renderTopic() {
  const t = TOPICS.find(x => x.id === view.id), s = topicStats(t.id);
  const qs = Q[t.id].filter(q => !filter || q.l === filter);
  app.innerHTML = `<div class="eyebrow">${t.code} · Bölüm ${t.ch}</div><h1>${t.title}</h1><p class="lead">${t.tr} · ${s.g} doğru, ${s.b} yanlış, ${s.n - s.g - s.b} cevapsız</p>
  <div class="row" style="margin-bottom:14px">${[0, 1, 2, 3].map(l => `<button class="chip" data-filter="${l}" aria-pressed="${filter === l}">${l ? LV[l] : "Hepsi"}</button>`).join("")}
  <button class="chip" data-summary="${t.code}">Özeti oku</button></div>
  <div class="stack">${qs.map(q => qCard(q, Q[t.id].indexOf(q) + 1)).join("")}</div>
  <div class="row" style="margin-top:16px">${s.g + s.b ? `<button class="btn ghost" data-resettopic="${t.id}">Bu konuyu sıfırla</button>` : ""}${nextTopicBtn(t.id)}</div>`;
}
function nextTopicBtn(id) { const i = TOPICS.findIndex(x => x.id === id); return i < TOPICS.length - 1 ? `<button class="btn" data-topic="${TOPICS[i + 1].id}">Sonraki konu →</button>` : ""; }

function renderMix() {
  const qs = mixSet.map(id => ALL.find(q => q.id === id));
  const got = qs.filter(q => q.id in view.local), right = qs.filter(q => view.local[q.id] === 0).length;
  app.innerHTML = `<div class="eyebrow">Deneme · ${qs.length} soru</div><h1>Karışık deneme</h1>
  <p class="lead">${got.length === qs.length ? `Bitti: <b>${right}/${qs.length}</b> doğru (%${Math.round(right / qs.length * 100)}).` : `${got.length}/${qs.length} cevaplandı · ${right} doğru`}</p>
  <div class="stack">${qs.map((q, i) => qCardMix(q, i + 1)).join("")}</div>
  <div class="row" style="margin-top:16px"><button class="btn" data-startmix>Yeni deneme</button></div>`;
}
// Denemede cevaplar ayrı tutulur ki aynı soru tekrar çözülebilsin; yine de genel ilerlemeye işlenir.
function qCardMix(q, no) { const keep = answers[q.id], has = q.id in answers; if (q.id in view.local) answers[q.id] = view.local[q.id]; else delete answers[q.id];
  const html = qCard(q, no); if (has) answers[q.id] = keep; else delete answers[q.id]; return html; }

function renderProgress() {
  const t = totals(), wrong = ALL.filter(q => q.id in answers && answers[q.id] !== 0);
  const byLv = [1, 2, 3].map(l => { const qs = ALL.filter(q => q.l === l), g = qs.filter(q => answers[q.id] === 0).length; return `<div class="card stat"><b>${g}/${qs.length}</b><span>${LV[l]}</span></div>`; }).join("");
  app.innerHTML = `<div class="eyebrow">Sadece bu telefonda saklanır</div><h1>İlerleme</h1>
  <div class="stats" style="margin-bottom:12px"><div class="card stat"><b>${t.g}</b><span>doğru</span></div><div class="card stat"><b>${t.b}</b><span>yanlış</span></div><div class="card stat"><b>${t.n - t.g - t.b}</b><span>cevapsız</span></div></div>
  <div class="stats">${byLv}</div>
  <h2 style="margin:24px 0 10px">Konulara göre</h2><div class="stack">${TOPICS.map(x => { const s = topicStats(x.id);
    return `<button class="card topic" data-topic="${x.id}"><span><span class="code">${x.code}</span> ${x.tr}</span><span class="frac">${s.g}/${s.n}</span><span class="meta">${bar(s)}</span></button>`; }).join("")}</div>
  <h2 style="margin:24px 0 4px">Yanlışlarım</h2><p class="lead">Yanlış cevapladığın sorular. Çözümü tekrar okumak için konuya git ve sıfırlayıp yeniden dene.</p>
  ${wrong.length ? `<div class="stack">${wrong.map(q => { const x = TOPICS.find(k => k.id === q.topic); return `<button class="card topic" data-jump="${q.id}"><span><span class="lvl l${q.l}">${LV[q.l]}</span> <span class="mute">${x.code} ${x.tr}</span><span class="sec-tr" style="color:var(--ink)">${q.q}</span></span></button>`; }).join("")}</div>` : `<div class="card empty">Henüz yanlış yok.</div>`}
  <div style="margin-top:24px">${resetAsk ? `<div class="confirm"><span>Tüm cevaplar silinsin mi?</span><button class="btn" style="background:var(--bad)" data-resetall="yes">Evet, sil</button><button class="btn ghost" data-resetall="no">Vazgeç</button></div>` : (t.g + t.b ? `<button class="btn ghost" data-resetall="ask">Tüm ilerlemeyi sıfırla</button>` : "")}</div>`;
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.q) { const q = ALL.find(x => x.id === d.q), o = +d.o;
    if (view.name === "mix") { view.local[q.id] = o; }
    answers[q.id] = o; save();
    const y = document.getElementById("q-" + q.id).getBoundingClientRect().top;
    render(); const el = document.getElementById("q-" + q.id); if (el) window.scrollBy(0, el.getBoundingClientRect().top - y); return; }
  if (d.topic) return go("topic", { id: d.topic });
  if (d.filter !== undefined) { filter = +d.filter; return render(); }
  if (d.quiz) { const t = TOPICS.find(x => x.code === d.quiz); return go("topic", { id: t.id }); }
  if (d.summary) { go("ozet"); const el = document.getElementById("sec-" + d.summary); if (el) { el.open = true; el.scrollIntoView(); } return; }
  if (d.mixch) { const c = +d.mixch; mixChapters = mixChapters.includes(c) ? mixChapters.filter(x => x !== c) : mixChapters.concat(c); if (!mixChapters.length) mixChapters = [c]; return render(); }
  if (d.startmix !== undefined) { const pool = ALL.filter(q => mixChapters.includes(TOPICS.find(t => t.id === q.topic).ch)); mixSet = shuffle(pool.slice()).slice(0, 15).map(q => q.id); return go("mix", { local: {} }); }
  if (d.resettopic) { Q[d.resettopic].forEach(q => delete answers[q.id]); save(); return render(); }
  if (d.resetall) { if (d.resetall === "ask") resetAsk = true; else { if (d.resetall === "yes") { answers = {}; save(); } resetAsk = false; } return render(); }
  if (d.jump) { const q = ALL.find(x => x.id === d.jump); go("topic", { id: q.topic }); const el = document.getElementById("q-" + q.id); if (el) el.scrollIntoView(); return; }
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
document.getElementById("back").addEventListener("click", () => go("sorular"));

const h = location.hash.slice(1);
if (/^t\d+$/.test(h) && Q[h]) go("topic", { id: h });
else if (["ozet", "sorular", "ilerleme"].includes(h)) go(h);
else render();
</script>

<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>

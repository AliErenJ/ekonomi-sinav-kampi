<title>Ekonomi Sınav Kampı</title>

<style>
/* Layout: tek sütunlu telefon uygulaması; altta sabit sekme çubuğu, üstte yapışkan başlık.
   Renkler bir arz-talep grafiğinden: talep mavisi, arz turuncusu, grafik kâğıdı zemin. */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --ink: #172235; --muted: #5d6879; --line: #d9dee7; --grid: #e6eaf1;
  --demand: #2457c5; --demand-soft: #e5ecfb; --supply: #c25a14; --supply-soft: #fbeadd;
  --good: #1d7a46; --good-soft: #e1f3e8; --bad: #b8322a; --bad-soft: #fbe5e3;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #10151e; --surface: #18202c; --ink: #e8edf5; --muted: #9aa6b8; --line: #2b3646; --grid: #1a2230;
  --demand: #7ea3f2; --demand-soft: #1d2b49; --supply: #f0a061; --supply-soft: #3a2616;
  --good: #5fcf8d; --good-soft: #15321f; --bad: #f08a80; --bad-soft: #3a1b19; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #10151e; --surface: #18202c; --ink: #e8edf5; --muted: #9aa6b8; --line: #2b3646; --grid: #1a2230;
  --demand: #7ea3f2; --demand-soft: #1d2b49; --supply: #f0a061; --supply-soft: #3a2616;
  --good: #5fcf8d; --good-soft: #15321f; --bad: #f08a80; --bad-soft: #3a1b19; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--demand); outline-offset: 2px }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px }
.back { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 4px 10px; cursor: pointer; font-weight: 700 }
.brand { font: 800 19px/1.1 var(--display); letter-spacing: -.01em; flex: 1; min-width: 0 }
.brand small { display: block; font: 400 12px/1.3 var(--body); color: var(--muted); letter-spacing: 0 }
.score { font: 500 13px var(--mono); color: var(--muted); white-space: nowrap }

main { max-width: 720px; margin: 0 auto; padding-block: 18px 110px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.tabs-in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr) }
.tab { background: none; border: 0; padding: 10px 4px 12px; cursor: pointer; display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 13px; font-weight: 700 }
.tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.tab[aria-current="page"] { color: var(--demand) }

h1 { font: 800 clamp(26px, 7vw, 34px)/1.1 var(--display); letter-spacing: -.02em; margin: 4px 0 6px; text-wrap: balance }
h2 { font: 800 22px/1.2 var(--display); margin: 0; text-wrap: balance }
h3 { font: 600 18px/1.3 var(--display); margin: 0; text-wrap: balance }
h4 { font: 700 16px/1.3 var(--body); margin: 18px 0 6px; color: var(--demand) }
.lead { color: var(--muted); margin: 0 0 18px }
.eyebrow { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--supply) }
.mute { color: var(--muted) }

.stack { display: grid; gap: 12px }
.stack > *, .sec-body { min-width: 0 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r) }

/* Özet */
.chap { padding: 16px }
.chap-head { display: flex; gap: 12px; align-items: baseline }
.chap-no { font: 800 34px/1 var(--display); color: var(--supply) }
.sec { border-top: 1px solid var(--line); margin-top: 12px }
.sec > summary { list-style: none; cursor: pointer; padding: 12px 0 4px; display: flex; gap: 10px; align-items: baseline }
.sec > summary::-webkit-details-marker { display: none }
.sec > summary::after { content: "+"; margin-left: auto; font: 500 18px var(--mono); color: var(--muted) }
.sec[open] > summary::after { content: "−" }
.code { font: 500 13px var(--mono); color: var(--demand); background: var(--demand-soft); padding: 1px 6px; border-radius: 5px; flex: none }
.sec-tr { display: block; font-size: 14px; color: var(--muted) }
.sec-body { padding-bottom: 10px; max-width: 65ch }
.sec-body p, .sec-body ul { margin: 6px 0 }
.sec-body ul { padding-left: 20px }
.sec-body li { margin: 4px 0 }
.fm { font: 500 15px/1.5 var(--mono); background: var(--demand-soft); border-radius: 8px; padding: 8px 12px; overflow-x: auto }
.tip { background: var(--supply-soft); border-radius: 8px; padding: 10px 12px; margin: 14px 0 6px; font-size: 15px }
.tbl-wrap { overflow-x: auto; margin: 8px 0 }
.tbl { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 300px }
.tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top }
.tbl th { background: var(--bg); font-weight: 700 }
.quiz-link { margin-top: 10px; display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--demand); color: var(--demand); background: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font-weight: 700; font-size: 14px }

.fig { margin: 12px 0; max-width: 420px }
.fig svg { width: 100%; height: auto; display: block; background: var(--bg); border-radius: 8px }
.fig figcaption { font-size: 13px; color: var(--muted); margin-top: 6px }
.ax { stroke: var(--ink); stroke-width: 1.5 }
.c-d { stroke: var(--demand); stroke-width: 3; fill: none }
.c-s { stroke: var(--supply); stroke-width: 3; fill: none }
.c-k { stroke: var(--ink); stroke-width: 2.5; fill: none }
.dash { stroke-dasharray: 6 5 }
.guide { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3 }
.guide2 { stroke: var(--muted); stroke-width: 1; opacity: .5 }
.pt { fill: var(--ink) } .pt-o { fill: var(--surface); stroke: var(--ink); stroke-width: 2 }
.lb { fill: var(--ink); font: 700 12px var(--body) } .lb.sm { font-size: 10.5px; font-weight: 400 } .lb.mute { fill: var(--muted) }
.lb.d { fill: var(--demand) } .lb.s { fill: var(--supply) }
.box { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5 } .box2 { fill: var(--demand-soft); stroke: var(--demand); stroke-width: 1.2 }
.arr { stroke-width: 2; marker-end: url(#ah) }

/* Konular */
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; text-align: left; cursor: pointer; width: 100% }
.topic:hover { border-color: var(--demand) }
.topic .meta { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px }
.bar { flex: 1; height: 6px; background: var(--grid); border-radius: 3px; overflow: hidden; display: flex }
.bar i { display: block; height: 100% }
.bar .g { background: var(--good) } .bar .b { background: var(--bad) }
.frac { font: 500 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums }
.chapter-label { font: 600 14px var(--display); color: var(--muted); margin: 14px 0 0 }
.mix { padding: 16px; display: grid; gap: 10px; background: var(--demand-soft); border-color: transparent }
.row { display: flex; flex-wrap: wrap; gap: 8px }
.btn { border: 0; background: var(--demand); color: #fff; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line) }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 14px; font-weight: 700 }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink) }

/* Soru */
.q { padding: 16px }
.q-head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap }
.lvl { font: 500 12px var(--mono); padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: .05em }
.lvl.l1 { background: var(--good-soft); color: var(--good) }
.lvl.l2 { background: var(--supply-soft); color: var(--supply) }
.lvl.l3 { background: var(--bad-soft); color: var(--bad) }
.qno { font: 500 12px var(--mono); color: var(--muted) }
.q-text { font-size: 17px; font-weight: 700; margin: 0 0 12px }
.opts { display: grid; gap: 8px }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; padding: 10px 12px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; font-size: 15.5px }
.opt:hover:not(:disabled) { border-color: var(--demand) }
.opt .let { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); font: 500 13px var(--mono) }
.opt:disabled { cursor: default }
.opt.right { border-color: var(--good); background: var(--good-soft) } .opt.right .let { background: var(--good); color: var(--surface) }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) } .opt.wrong .let { background: var(--bad); color: var(--surface) }
.sol { margin-top: 12px; border-left: 4px solid var(--good); background: var(--bg); border-radius: 0 8px 8px 0; padding: 10px 12px; font-size: 15.5px }
.sol.bad { border-left-color: var(--bad) }
.sol-h { font-weight: 700; margin-bottom: 4px }
.sol-h.ok { color: var(--good) } .sol-h.no { color: var(--bad) }
.empty { padding: 20px; text-align: center; color: var(--muted) }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px }
.stat { padding: 12px; text-align: center }
.stat b { display: block; font: 800 26px/1.1 var(--display); font-variant-numeric: tabular-nums }
.stat span { font-size: 13px; color: var(--muted) }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px; background: var(--bad-soft); border-radius: 8px }

@media (prefers-reduced-motion: no-preference) { .sol { animation: in .25s ease-out } @keyframes in { from { opacity: .3; transform: translateY(-4px) } } }

/* Doğru cevapta ekranın ortasında kısa süre "Bravo!" */
.bravo { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none }
.bravo span { font: 800 clamp(48px, 16vw, 84px)/1 var(--display); color: var(--good); background: var(--surface);
  border: 3px solid var(--good); border-radius: 20px; padding: 18px 30px; box-shadow: 0 12px 40px rgb(0 0 0 / .18);
  transform: rotate(-4deg); animation: bravo 1.3s ease-out forwards }
@keyframes bravo { 0% { opacity: 0; transform: rotate(-4deg) scale(.4) } 18% { opacity: 1; transform: rotate(-4deg) scale(1.12) }
  30% { transform: rotate(-4deg) scale(1) } 75% { opacity: 1 } 100% { opacity: 0; transform: rotate(-4deg) scale(1) translateY(-24px) } }
@media (prefers-reduced-motion: reduce) { .bravo span { animation: fade 1.3s linear forwards } @keyframes fade { 0%, 70% { opacity: 1 } 100% { opacity: 0 } } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

</defs></svg>

<body>
<header class="top"><div class="top-in">
  <button class="back" id="back" hidden aria-label="Geri">←</button>
  <div class="brand" id="brand">Ekonomi Sınav Kampı<small>Sloman, Economics · Bölüm 1–9</small></div>
  <div class="score" id="score"></div>

  { code: "1.1", title: "What do economists study?", tr: "Ekonomistler neyi inceler?", html: `
<p><b>Kıtlık (scarcity)</b> ekonominin temel sorunudur: insanların istekleri sınırsız, kaynaklar sınırlıdır. Bu yüzden herkese istediği her şeyi sağlamak imkânsızdır. Kitabın tanımı: kıtlık, isteklerin (potansiyel talep) mevcut kaynakları (potansiyel arz) aşmasıdır.</p>
<h4>Üretim faktörleri (factors of production)</h4>
<ul><li><b>Labour</b> (emek): insanların çalışması.</li><li><b>Land</b> (toprak): toprak ve tüm doğal kaynaklar (ham madde).</li><li><b>Capital</b> (sermaye): üretimde kullanılan insan yapımı araçlar (makine, bina, yol).</li></ul>
<p class="mute">Bazı kaynaklarda dördüncü faktör olarak <b>enterprise</b> (girişimcilik) de sayılır.</p>
<h4>Makro ve mikro</h4>
<ul><li><b>Macroeconomics</b>: ekonominin bütünü (toplamlar). Dört büyük konu: <b>economic growth</b> (büyüme), <b>unemployment</b> (işsizlik), <b>inflation</b> (enflasyon), <b>balance of payments</b> (dış ödemeler dengesi). Toplam talep (aggregate demand) ile toplam arz (aggregate supply) çerçevesinde incelenir.</li>
<li><b>Microeconomics</b>: tek tek birimler (tüketici, firma, sektör, işçi). Toplumun cevaplaması gereken üç soru: <b>What</b> (ne üretilecek?), <b>How</b> (nasıl üretilecek?), <b>For whom</b> (kimin için üretilecek?).</li></ul>
<h4>Fırsat maliyeti (opportunity cost)</h4>
<p>Bir şeyi seçmenin maliyeti, <b>vazgeçilen en iyi alternatiftir</b> (the best alternative forgone). Üniversiteye gitmenin fırsat maliyeti, o süre içinde çalışsaydın kazanacağın gelirdir (harç ve kitaplar da eklenir).</p>
<h4>Rasyonel seçim ve marjinal düşünce</h4>
<p>Rasyonel (akılcı) karar, bir faaliyetin <b>marginal benefit</b> (ek fayda) ve <b>marginal cost</b> (ek maliyet) karşılaştırmasıyla verilir. <b>MB &gt; MC</b> ise o faaliyetten daha fazla yapmak rasyoneldir. MB = MC olduğu noktada durulur.</p>
<h4>Üretim olanakları eğrisi (production possibility curve, PPC)</h4>
${FIG.ppc}
<ul><li>Eğri, bir ülkenin belli bir dönemde mevcut kaynaklarla üretebileceği iki malın tüm bileşimlerini gösterir.</li>
<li>Eğri üzerindeyken bir maldan daha fazla üretmek için diğerinden vazgeçmek gerekir. Bu <b>fırsat maliyetidir</b> ve eğrinin <b>eğimiyle</b> gösterilir.</li>
<li>Eğri dışbükeydir (dışarı doğru bükük), çünkü <b>artan fırsat maliyeti</b> (increasing opportunity cost) vardır: kaynaklar her iki mal için eşit derecede uygun değildir.</li>
<li>İçerideki nokta: boş (işsiz) kaynak ya da verimsizlik. İki maldan da aynı anda daha fazla üretilebilir.</li>
<li>Eğri dışarı kayar: yatırım, teknolojik ilerleme, işgücünün artması (ekonomik büyüme).</li></ul>
<h4>Döngüsel akım (circular flow of goods and incomes)</h4>
${FIG.flow}
<div class="tip"><b>Sınavda dikkat:</b> Fırsat maliyeti sorularında "vazgeçilen <u>en iyi</u> tek alternatif" sayılır, tüm alternatiflerin toplamı değil. PPC sorularında eğimi okumayı unutma: Y'nin ekseni dikeyse, X'in fırsat maliyeti = vazgeçilen Y / kazanılan X.</div>` },

  { code: "1.2", title: "Different economic systems", tr: "Farklı ekonomik sistemler", html: `
<p>Ekonomik sistemler, kaynak dağılımında <b>piyasaya</b> mı yoksa <b>devlete</b> mi dayandıklarına göre sınıflanır. Bir uçta komuta ekonomisi, diğer uçta serbest piyasa vardır. Gerçekte tüm ekonomiler <b>karma</b>dır.</p>
<h4>Komuta ekonomisi (command economy / planned economy)</h4>
<ul><li>Tüm kararları devlet verir: ne kadar tüketim, ne kadar yatırım, her sektörün çıktısı, üretim yöntemleri, çıktının kime dağıtılacağı.</li>
<li><b>Artıları:</b> büyüme, tam istihdam ve eşitlik gibi ulusal hedeflere doğrudan yönelebilir.</li>
<li><b>Eksileri:</b> bilgi toplamak için büyük bürokrasi gerekir; fiyatlar ve üretim yöntemleri keyfi olabilir; teşvikler (incentives) zayıftır; kıtlıklar ve fazlalıklar oluşur; bireysel özgürlük kısıtlanır. Örnek: eski Sovyetler Birliği (Box 1.5).</li></ul>
<h4>Serbest piyasa ekonomisi (free-market economy)</h4>
<ul><li>Kararları arz ve talebin etkileşimi verir. <b>Fiyat mekanizması</b> (price mechanism) arz ile talebi dengeler.</li>
<li>Kıtlık varsa fiyat yükselir, kıtlık ortadan kalkana kadar. Fazla arz varsa fiyat düşer.</li>
<li>Fiyatlar <b>sinyal</b> ve <b>teşvik</b> görevi görür. Mal piyasaları ile faktör piyasaları birbirine bağlıdır (interdependence): bir malın talebi artınca fiyatı ve kârı artar, firmalar bu mala kayar, bu da o maldaki işçi ve faktörlerin talebini artırır.</li>
<li>Adam Smith'in <b>"görünmez el"</b>i (invisible hand, Box 1.6): kişisel çıkarın peşindeki bireyler, farkında olmadan toplumun çıkarına hizmet eder.</li>
<li><b>Artıları:</b> kendiliğinden işler, bürokrasi gerekmez; rekabet tüketiciyi korur.</li>
<li><b>Eksileri:</b> rekabet sınırlı olabilir (tekeller), büyük gelir eşitsizliği, çevre ve toplum üzerinde olumsuz etkiler (dışsallıklar), makroekonomik istikrarsızlık (krizler, işsizlik).</li></ul>
<h4>Karma ekonomi (mixed economy)</h4>
<p>Piyasa ile devlet müdahalesinin karışımı. Ülkeleri ayıran şey, müdahalenin <b>derecesi ve biçimidir</b>. Devlet müdahale araçları: fiyat belirleme, vergi ve sübvansiyon, yasal düzenleme, kamu üretimi (sağlık, eğitim).</p>
<div class="tip"><b>Sınavda dikkat:</b> "Hangi sistemde kıtlık fiyatı yükseltir?" → serbest piyasa. "Hangi sistemde kıtlık kuyruk ve karneyle çözülür?" → komuta ekonomisi. Uluslararası ilişkiler açısından: Soğuk Savaş, Sovyet planlamasının çöküşü ve Çin'in piyasaya geçişi bu konunun güncel örnekleridir.</div>` },

  { code: "1.3", title: "The nature of economic reasoning", tr: "Ekonomik akıl yürütmenin doğası", html: `
<h4>Ekonomi bir bilim mi?</h4>
<p>Ekonomistler doğa bilimcilerine benzer yöntem kullanır: <b>model</b> (model) kurar, model <b>varsayımlara</b> (assumptions) dayanır, modelden <b>tahmin</b> (prediction) üretilir, tahminler <b>gerçek verilerle test edilir</b>. Başarısız modeller ya bırakılır ya da değiştirilir.</p>
<h4>Ceteris paribus</h4>
<p>"Diğer her şey sabitken" anlamına gelir (Box 1.7). Bir değişkenin etkisini yalnız başına incelemek için öteki etkenler sabit varsayılır. Örnek: "Ceteris paribus, fiyat artarsa talep edilen miktar düşer."</p>
<h4>Sosyal bilim olarak ekonomi</h4>
<p>Ekonomi insan davranışını inceler. İnsanlar değişir, çevre sürekli değişir, laboratuvar deneyi yapmak çoğu zaman mümkün değildir. Bu yüzden kesin tahmin yapmak zordur.</p>
<h4>Pozitif ve normatif ifadeler</h4>
<table class="tbl"><tr><th>Positive statement</th><th>Normative statement</th></tr>

<tr><td>"Faizi artırmak enflasyonu düşürür."</td><td>"Hükümet işsizliği azaltmaya öncelik vermelidir."</td></tr></table>
<p>Ekonomistler, bilim insanı olarak, bir politikanın <b>sonuçlarını</b> (pozitif) analiz eder. Politikanın <b>amacının iyi olup olmadığına</b> (normatif) karar vermek konusunda başka bir vatandaştan daha fazla hakları yoktur.</p>

  { code: "2.1", title: "Demand", tr: "Talep", html: `
<h4>Talep kanunu (law of demand)</h4>
<p>Bir malın fiyatı artınca, belli bir dönemde talep edilen miktar düşer (ceteris paribus). Bu hem bireysel hem de piyasa talebi için geçerlidir. <b>Piyasa talebi</b> (market demand), tüm bireysel taleplerin her fiyatta yatay olarak toplanmasıdır.</p>
<h4>Neden? İki etki</h4>
<ul><li><b>Income effect</b> (gelir etkisi): fiyat artınca tüketicinin reel geliri düşer, aynı parayla daha az alabilir.</li>
<li><b>Substitution effect</b> (ikame etkisi): fiyat artınca mal, alternatiflerine göre pahalılaşır; tüketici ikamelerine geçer.</li></ul>
<h4>Talep tablosu ve eğrisi</h4>
<p>Fiyat <b>dikey</b> eksende, belli bir dönemdeki talep edilen miktar <b>yatay</b> eksende gösterilir. Talep eğrisi negatif eğimlidir (aşağı iner).</p>
<h4>Talebin diğer belirleyicileri (determinants of demand)</h4>
<ul><li><b>Tastes</b> (zevkler, reklam, moda).</li>
<li><b>Substitutes</b> (ikame mallar): çay ile kahve. Kahvenin fiyatı artarsa çayın talebi artar.</li>
<li><b>Complements</b> (tamamlayıcı mallar): araba ile benzin. Benzin pahalanırsa araba talebi düşer.</li>
<li><b>Income</b> (gelir): <b>normal good</b> için gelir artınca talep artar; <b>inferior good</b> (düşük mal) için gelir artınca talep düşer (ucuz margarin, otobüs yolculuğu gibi).</li>
<li><b>Distribution of income</b> (gelir dağılımı).</li>
<li><b>Expectations</b> (beklentiler): fiyatın artacağı beklentisi bugünkü talebi artırır.</li></ul>
<h4>Hareket mi, kayma mı? (çok sık sorulur)</h4>
${FIG.dshift}
<table class="tbl"><tr><th>Neden</th><th>Grafikte</th><th>Adı</th></tr>
<tr><td>Malın <b>kendi fiyatı</b> değişir</td><td>Eğri üzerinde hareket</td><td>change in <b>quantity demanded</b></td></tr>
<tr><td>Fiyat dışında bir belirleyici değişir</td><td>Eğrinin tamamı kayar (sağa = artış, sola = azalış)</td><td>change in <b>demand</b></td></tr></table>
<h4>Talep fonksiyonu</h4>
<p class="fm">Qd = a − bP</p><p>Örnek: Qd = 100 − 5P. P = 10 ise Qd = 50.</p>
<div class="tip"><b>Sınavda dikkat:</b> "Gelir arttı, otobüs yolculuğu talebi düştü" → otobüs düşük maldır (inferior). "Bir malın fiyatı düştü, talebi arttı" demek yanlıştır: doğrusu "talep edilen miktar arttı" olur.</div>` },

  { code: "2.2", title: "Supply", tr: "Arz", html: `
<h4>Arz ve fiyat</h4>
<p>Fiyat artınca, belli bir dönemde arz edilen miktar genelde artar. Arz eğrisi pozitif eğimlidir (yukarı çıkar).</p>
<h4>Neden fiyat artınca daha çok arz edilir?</h4>
<ul><li><b>Kısa dönem</b> (1): üreticiler daha çok üretmenin getirdiği daha yüksek birim maliyetleri artık karşılayabilir (artan maliyetler).</li>
<li><b>Kısa dönem</b> (2): üreticiler kârlılığı artık daha düşük olan başka mallardan bu mala geçer.</li>
<li><b>Uzun dönem</b> (3): yüksek kâr <b>yeni firmaları</b> piyasaya çeker.</li></ul>
<h4>Arzın diğer belirleyicileri (determinants of supply)</h4>
<ul><li><b>Costs of production</b> (üretim maliyetleri): girdi fiyatları, teknoloji, vergiler. Maliyet düşerse arz artar (sağa kayar).</li>
<li><b>Profitability of alternative products</b> (alternatif malların kârlılığı, goods in demand/supply substitutes): buğday pahalanırsa çiftçi arpadan buğdaya geçer, arpa arzı düşer.</li>
<li><b>Profitability of goods in joint supply</b> (birlikte üretilen mallar): sığır eti üretimi artınca deri arzı da artar.</li>
<li><b>Nature, random shocks</b> (doğa, rastgele şoklar): hava, salgın, grev, savaş.</li>
<li><b>Aims of producers</b> (üreticinin amacı: kâr mı, satış mı).</li>
<li><b>Expectations</b> (beklentiler): fiyatın artacağı beklenirse üretici bugün satmayıp stok yapabilir, bugünkü arz düşer.</li></ul>
<h4>Hareket mi, kayma mı?</h4>
<table class="tbl"><tr><th>Neden</th><th>Grafikte</th><th>Adı</th></tr>
<tr><td>Kendi fiyatı değişir</td><td>Eğri üzerinde hareket</td><td>change in <b>quantity supplied</b></td></tr>
<tr><td>Başka bir belirleyici değişir</td><td>Eğri kayar</td><td>change in <b>supply</b></td></tr></table>
<p class="fm">Qs = c + dP</p><p>Örnek: Qs = −20 + 10P. P = 5 ise Qs = 30.</p>
<div class="tip"><b>Sınavda dikkat:</b> Sınavlarda tuzak: "the price of the good rose, so supply increased" yanlış ifadedir. Doğrusu: quantity supplied increased (eğri üzerinde hareket).</div>` },

  { code: "2.3", title: "Price and output determination", tr: "Fiyat ve miktarın belirlenmesi", html: `
${FIG.eq}
<ul><li><b>Shortage</b> (kıtlık / fazla talep): Qd &gt; Qs → fiyat yükselir.</li>
<li><b>Surplus</b> (fazla arz): Qs &gt; Qd → fiyat düşer.</li>
<li><b>Equilibrium price</b> (denge fiyatı) piyasayı temizleyen (market-clearing) fiyattır: Qd = Qs. Dengede kıtlık ya da fazla arz yoktur, değişme eğilimi yoktur.</li></ul>
<h4>Eğriler kayınca ne olur?</h4>
<table class="tbl"><tr><th>Değişim</th><th>Denge fiyatı</th><th>Denge miktarı</th></tr>
<tr><td>Talep artar (D sağa)</td><td>↑</td><td>↑</td></tr>
<tr><td>Talep azalır (D sola)</td><td>↓</td><td>↓</td></tr>
<tr><td>Arz artar (S sağa)</td><td>↓</td><td>↑</td></tr>
<tr><td>Arz azalır (S sola)</td><td>↑</td><td>↓</td></tr>
<tr><td>D ve S birlikte artar</td><td><b>belirsiz</b></td><td>↑</td></tr>
<tr><td>D artar, S azalır</td><td>↑</td><td><b>belirsiz</b></td></tr></table>
<p>İki eğri birlikte kayınca, hangisinin daha çok kaydığı bilinmeden bir değişken belirsiz kalır.</p>
<h4>Dengeyi hesaplamak</h4>
<p class="fm">Qd = Qs → a − bP = c + dP → P* = (a − c) / (b + d)</p>
<p>Örnek: Qd = 100 − 5P, Qs = −20 + 10P → 100 − 5P = −20 + 10P → 120 = 15P → <b>P* = 8</b>, Q* = 100 − 40 = <b>60</b>.</p>
<h4>Tanımlama sorunu (identification problem)</h4>
<p>Gerçek verilerde fiyat ve miktar noktalarını birleştirerek talep eğrisini bulamayız, çünkü aynı dönemde iki eğri de bilinmeyen miktarda kaymış olabilir.</p>
<div class="tip"><b>Sınavda dikkat:</b> Önce hangi eğrinin kaydığını bul (talep mi arz mı, ikisi mi), sonra yönünü bul. Örnek: "Kötü hava kahve hasatlarını düşürdü" → arz sola kayar → fiyat ↑, miktar ↓. Ev fiyatları (Box 2.2) ve borsa fiyatları (Box 2.3) bu modelle açıklanır.</div>` },

  { code: "2.4", title: "The control of prices", tr: "Fiyatların kontrolü", html: `
<p>Devlet piyasaya şöyle müdahale edebilir: fiyat belirlemek, vergi ya da sübvansiyon, üretimi düzenlemek, malı doğrudan kendisi üretmek.</p>
${FIG.ceil}
<h4>Taban fiyat (minimum price / price floor)</h4>
<ul><li>Dengenin <b>üstünde</b> konursa etkilidir → <b>fazla arz</b> (Qs − Qd).</li>
<li>Amaç: üreticilerin gelirini korumak (tarım), ileride arz düşerse diye stok oluşturmak. Örnek: asgari ücret (işgücü fazlası = işsizlik riski).</li>
<li>Devlet fazlayı ne yapacağına karar vermelidir: satın alıp depolamak, yok etmek, yurtdışına satmak, üretim kotası koymak.</li></ul>
<h4>Tavan fiyat (maximum price / price ceiling)</h4>
<ul><li>Dengenin <b>altında</b> konursa etkilidir → <b>kıtlık</b> (Qd − Qs).</li>
<li>Amaç: fiyatı tüketici için düşük tutmak (kira kontrolü, savaş döneminde gıda, temel ihtiyaçlar).</li>
<li>Sonuçlar: kuyruklar (queues), bekleme listeleri, firmanın sadece tanıdık müşterilere satması, devlet <b>karne</b> (rationing) sistemi.</li>
<li><b>Underground (black) market</b> (karaborsa, Box 2.4): mal yasadışı olarak tavan fiyatın üstünde satılır.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Dengenin üstüne konan tavan fiyat ya da dengenin altına konan taban fiyat <b>etkisizdir</b> (hiçbir şey değiştirmez). Kıtlık/fazla hesaplarken fiyatı iki denkleme de koy ve farkı al.</div>` },

  { code: "3.1", title: "Elasticity", tr: "Esneklik", html: `
<p><b>Esneklik</b>, talebin (ya da arzın) belirleyicilerinden birindeki değişime ne kadar <b>duyarlı</b> olduğunu ölçer. Genel formül:</p>
<p class="fm">Esneklik = miktardaki % değişim / belirleyicideki % değişim</p>
<h4>Talebin fiyat esnekliği (price elasticity of demand, PED)</h4>
<p class="fm">PED = %ΔQd / %ΔP</p>
<p>Talep eğrisi aşağı indiği için PED negatiftir; yorumda <b>mutlak değere</b> bakılır.</p>
<table class="tbl"><tr><th>|PED|</th><th>Ad</th><th>Anlamı</th></tr>
<tr><td>&gt; 1</td><td>elastic (esnek)</td><td>Miktar fiyattan oransal olarak <b>daha çok</b> değişir</td></tr>
<tr><td>= 1</td><td>unit elastic (birim esnek)</td><td>Aynı oranda değişir</td></tr>
<tr><td>&lt; 1</td><td>inelastic (esnek değil)</td><td>Miktar <b>daha az</b> değişir</td></tr>
<tr><td>0</td><td>perfectly inelastic</td><td>Dikey talep eğrisi</td></tr>
<tr><td>∞</td><td>perfectly elastic</td><td>Yatay talep eğrisi</td></tr></table>
<h4>PED'in belirleyicileri</h4>
<ul><li><b>İkamelerin sayısı ve yakınlığı</b>: ne kadar çok ve yakın ikame varsa o kadar esnek. (Belli bir marka benzin esnek, genel olarak benzin esnek değil.)</li>
<li><b>Gelir içindeki pay</b>: gelirin büyük kısmını alan mallar (araba, tatil) daha esnek; tuz, kibrit esnek değil.</li>
<li><b>Zaman</b>: fiyat değişiminden sonra ne kadar zaman geçerse talep o kadar esnek olur (insanlar alternatif bulur).</li></ul>
<h4>Esneklik ve toplam harcama / gelir (total revenue, TR = P × Q)</h4>
<table class="tbl"><tr><th>Talep</th><th>Fiyat ↑</th><th>Fiyat ↓</th></tr>
<tr><td>Esnek</td><td>TR ↓</td><td>TR ↑</td></tr>
<tr><td>Esnek değil</td><td>TR ↑</td><td>TR ↓</td></tr>
<tr><td>Birim esnek</td><td>TR değişmez</td><td>TR değişmez</td></tr></table>
${FIG.tr}
<h4>Ölçme: yay esnekliği (arc elasticity, orta nokta formülü)</h4>
<p class="fm">PED = (ΔQ / ortalama Q) ÷ (ΔP / ortalama P)</p>
<p>Örnek: P 4 → 6, Q 20 → 10. ΔQ/ort.Q = −10/15 = −0,667; ΔP/ort.P = 2/5 = 0,4 → PED = <b>−1,67</b> (esnek).</p>
<p><b>Nokta esnekliği</b> (point elasticity, *): PED = (dQ/dP) × (P/Q). Örnek: Q = 100 − 5P, P = 8, Q = 60 → PED = −5 × 8/60 = −0,67.</p>
<h4>Arzın fiyat esnekliği (price elasticity of supply, PES)</h4>
<p class="fm">PES = %ΔQs / %ΔP</p>
<p>Pozitiftir. Belirleyicileri: üretim arttıkça maliyetlerin ne kadar hızlı arttığı, ve <b>zaman</b>: anlık dönem (dikey'e yakın), kısa dönem, uzun dönem (en esnek).</p>
<h4>Talebin gelir esnekliği (income elasticity of demand, YED)</h4>
<p class="fm">YED = %ΔQd / %ΔY</p>
<ul><li>YED &gt; 0: <b>normal good</b>. YED &gt; 1: income elastic (lüks, tatil). 0 &lt; YED &lt; 1: income inelastic (temel gıda).</li>
<li>YED &lt; 0: <b>inferior good</b> (düşük mal).</li></ul>
<h4>Çapraz fiyat esnekliği (cross-price elasticity, XED)</h4>
<p class="fm">XED(A,B) = %ΔQd(A) / %ΔP(B)</p>
<ul><li>XED &gt; 0: <b>substitutes</b> (ikame). XED &lt; 0: <b>complements</b> (tamamlayıcı). XED ≈ 0: ilişkisiz.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Esneklik formüllerinde miktar hep <b>pay</b>da (üstte), fiyat ya da gelir hep <b>payda</b>da (altta). Gelir esnekliğinde ve çapraz esneklikte <b>işaret önemlidir</b>, fiyat esnekliğinde mutlak değere bakılır. Doğrusal talep eğrisinin eğimi sabittir ama esnekliği değişir.</div>` },

  { code: "3.2", title: "The time dimension", tr: "Zaman boyutu", html: `
<h4>Kısa dönem ve uzun dönem</h4>
<p>Üreticiler ve tüketiciler fiyat değişimine tam uyum sağlamak için zaman ister. Genelde <b>kısa dönem arz ve talebi, uzun dönemdekinden daha az esnektir</b>.</p>
<ul><li>Bu yüzden bir eğri kayınca, kısa dönemde etki daha çok <b>fiyata</b>, uzun dönemde daha çok <b>miktara</b> yansır.</li>
<li>Örnek: petrol fiyatı yükselir. Kısa dönemde insanlar yine araba kullanır, fiyat çok artar. Uzun dönemde yakıt tasarruflu arabalar, yeni petrol sahaları gelir, miktar daha çok uyum sağlar.</li></ul>
<h4>Spekülasyon (speculation)</h4>
<p>İnsanlar fiyat değişimlerini <b>tahmin eder</b> ve buna göre bugün alır ya da satar.</p>
<ul><li><b>Stabilising speculation</b> (istikrar sağlayan): insanlar fiyat değişiminin <b>geçici</b> olduğunu düşünür. Fiyat düşünce "nasılsa geri çıkar" deyip alırlar, fiyat düşüşü yavaşlar. Dalgalanmalar azalır.</li>
<li><b>Destabilising speculation</b> (istikrarı bozan): insanlar fiyatın <b>aynı yönde devam edeceğini</b> düşünür. Fiyat yükselirken daha da yükselecek diye alırlar, arz edenler satmayı erteler. Dalgalanma büyür (konut balonları, borsa çöküşleri).</li>
<li>Kendini gerçekleştiren kehanet (self-fulfilling): beklenti, fiyatı beklenen yöne iter.</li></ul>
<h4>Risk ve belirsizlik</h4>
<ul><li><b>Risk</b>: olası sonuçların <b>olasılıkları bilinir</b> (ör. geçmiş veriden).</li>
<li><b>Uncertainty</b> (belirsizlik): olasılıklar <b>bilinmez</b>.</li>
<li>Gelecek fiyat belirsizliğine karşı <b>stok tutma</b> (holding stocks): fiyat düşükken stok biriktir, fiyat yüksekken sat.</li>
<li><b>Futures market</b> (vadeli işlem piyasası, Box 3.5): bugünden, gelecekteki bir tarihte belirlenmiş fiyattan alım/satım anlaşması. Riski azaltır.</li>
<li><b>Short selling</b> (açığa satış, Box 3.4): sahip olmadığın hisseyi ödünç alıp satmak, fiyat düşünce ucuza geri alıp kâr etmek.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> "Fiyatlar artarken insanlar daha fazla artacağını düşünüp alıyor" → talep sağa kayar, arz sola kayar (satıcılar bekler) → fiyat daha da artar → istikrarı bozan spekülasyon.</div>` },

  { code: "3.3", title: "Indirect taxes", tr: "Dolaylı vergiler", html: `
<p>Mal ve hizmetlerden alınan vergiler: KDV (VAT), sigara, alkol, akaryakıt üzerindeki özel tüketim vergileri (excise duties).</p>
<ul><li><b>Specific tax</b> (birim başına sabit vergi): litre başına X ₺. Arz eğrisi vergi kadar <b>paralel</b> olarak yukarı kayar.</li>
<li><b>Ad valorem tax</b> (değer üzerinden, yüzde vergi): KDV. Arz eğrisi oransal kayar, fiyat arttıkça aradaki fark büyür.</li></ul>
${FIG.tax}
<h4>Verginin yükü (incidence of tax)</h4>
<p>Vergi tüketicinin ödediği fiyatı artırır, üreticinin vergiden sonra eline geçeni düşürür. Yükün kimde kaldığı esnekliklere bağlıdır:</p>
<ul><li>Talep <b>ne kadar az esnek</b>, arz <b>ne kadar esnekse</b> → yük o kadar çok <b>tüketicide</b>.</li>

<p class="fm">Vergi geliri = t × Q₁ &nbsp;&nbsp; Tüketici payı = Pc − P₀ &nbsp;&nbsp; Üretici payı = P₀ − Pp</p>
<div class="tip"><b>Sınavda dikkat:</b> Hesaplamada vergiyi arz denklemine eklerken üreticinin aldığı fiyatın (P − t) olduğunu unutma: Qs = c + d(P − t). Box 3.6: sigara vergisi, talep esnek olmadığı için yüksek gelir getirir ama yoksul içicilere ağır gelir (ahlaki ikilem).</div>` },

  { code: "3.4", title: "Government rejection of market allocation", tr: "Devletin piyasa dağılımını reddetmesi", html: `
<p>Devlet bazı malların piyasa yoluyla dağıtılmasını istemeyebilir. İki uç örnek:</p>
<h4>Kullanım noktasında ücretsiz hizmet (free at the point of delivery)</h4>
<ul><li>Devlet hastanesinde tedavi, devlet okulunda eğitim. Gerekçe: insanların hakkı olduğu düşüncesi ve topluma faydası (eğitim herkese yarar).</li>
<li>Analiz, sıfır fiyatlı bir <b>tavan fiyata</b> benzer: fiyat sıfırken talep edilen miktar arzı aşar → <b>kıtlık</b>.</li>
<li>Sonuç: bekleme listeleri (waiting lists), ihtiyaca göre önceliklendirme. Sağlıkta talep hızla artmaktadır (yaşlanan nüfus, yeni tedaviler).</li></ul>
<h4>Yasaklanan mallar (prohibition)</h4>
<ul><li>Uyuşturucu, bazı silahlar. Yasak → <b>yasadışı piyasa</b> doğar.</li>
<li>Hem talep hem arz serbest piyasaya göre <b>daha az</b> olur (ikisi de sola kayar), miktar düşer.</li>
<li><b>Fiyat</b> daha yüksek de olabilir, daha düşük de: <b>kimin cezası daha ağır ve yakalanma olasılığı daha yüksekse</b> (satıcı mı kullanıcı mı) ona bağlıdır. Satıcıya ağır ceza → arz çok azalır → fiyat yükselir.</li></ul>
<h4>Yasak yerine vergi?</h4>
<p>Vergiyle de tüketim azaltılabilir. Ama etkiler farklıdır: vergide fiyat kesin yükselir, devlet gelir elde eder, suç (ilgili suçlar) ve ürünün toplumdaki kabul edilebilirliği farklı etkilenir.</p>
<div class="tip"><b>Sınavda dikkat:</b> Ücretsiz sağlık = "maximum price of zero" (sıfır tavan fiyat). Kıtlık miktarı = fiyat sıfırken Qd − Qs.</div>` },

  { code: "3.5", title: "Agriculture and agricultural policy", tr: "Tarım ve tarım politikası", html: `
<p>Tarım piyasası neredeyse <b>tam rekabet</b>tir: binlerce küçük çiftçi var, hepsi <b>fiyat alıcıdır</b> (price takers). Buna rağmen dünyada en çok devlet müdahalesi tarımdadır (AB bütçesinin yaklaşık yarısı). Bu bir paradokstur.</p>
<h4>Neden müdahale? (serbest tarım piyasasının sorunları)</h4>
<ul><li><b>Fiyat dalgalanmaları</b>: arz hasata göre çok dalgalanır, talep fiyat esnek değildir → fiyat ve çiftçi gelirleri çok oynar. Tahmin zorlaşır, yatırım azalır.</li>
<li><b>Düşük çiftçi gelirleri (uzun dönem)</b>: gıda talebi <b>gelir esnek değildir</b>, gelir artınca yavaş büyür. Arz ise teknoloji sayesinde hızla artar → fiyatlar uzun dönemde düşer. Talep fiyat esnek olmadığı için bu düşüş gelirleri daha da düşürür.</li>
<li>Diğer amaçlar: <b>kendi kendine yeterlilik</b> (self-sufficiency, savaşta gıda güvenliği), çiftçi yatırımını teşvik, kırsal yaşamı ve çevreyi korumak.</li></ul>
${FIG.farm}
<h4>Bileşim hatası (fallacy of composition, Box 3.7)</h4>
<p>Tek bir çiftçi için doğru olan, hepsi için doğru olmayabilir. Bir çiftçinin hasadı iyiyse geliri artar. Ama <b>tüm</b> çiftçilerin hasadı iyiyse fiyat çok düşer ve hepsinin geliri azalabilir.</p>
<h4>Müdahale türleri</h4>
<ul><li><b>Buffer stocks</b> (tampon stok): iyi yılda fiyatı korumak için alıp stoklamak, kötü yılda satmak. Fiyatı <b>istikrara kavuşturur</b> ama zamanla çiftçi gelirlerini <b>artıramaz</b>.</li>
<li><b>Subsidies</b> (sübvansiyon): çiftçi gelirini artırır, tüketici fiyatını dünya fiyatına (ya da piyasanın temizlendiği yere) düşürür.</li>
<li><b>High minimum prices</b> (yüksek taban fiyat): fazla arz yaratır. Devlet fazlayı satın alır (intervention buying).</li>
<li><b>Reducing supply</b> (arzı azaltmak): kotalar (quotas), <b>set-aside</b> (çiftçiye toprağı boş bırakması için ödeme).</li>
<li><b>Structural policies</b> (yapısal politikalar): çiftçileri başka işlere yönlendirmek, kırsal kalkınma, eğitim.</li></ul>
<h4>AB Ortak Tarım Politikası (Common Agricultural Policy, CAP)</h4>
<ul><li>Fiyatlar hem çiftçi hem tüketici için yüksek tutuldu. Kısmen ithal edilen ürünlerde <b>değişken ithalat vergileri</b> (variable import levies), AB'nin kendine yettiği ürünlerde fazlanın <b>müdahale fiyatından</b> (intervention price) satın alınması.</li>

<tr><td>Perfect competition</td><td>Çok fazla</td><td>Tamamen serbest</td><td>Homojen</td><td>Sebze, döviz</td></tr>
<tr><td>Monopolistic competition</td><td>Çok</td><td>Serbest</td><td>Farklılaştırılmış</td><td>Restoran, kuaför</td></tr>
<tr><td>Oligopoly</td><td>Az</td><td>Engelli</td><td>Aynı ya da farklı</td><td>Araba, petrol, banka</td></tr>
<tr><td>Monopoly</td><td>Tek</td><td>Engelli / imkânsız</td><td>Benzersiz</td><td>Su şebekesi</td></tr></table>
<p><b>Concentration ratio</b> (Box 6.1): en büyük 3, 5 ya da 15 firmanın sektör payı. Yüksekse piyasa yoğunlaşmıştır.</p>
<h4>Tam rekabetin varsayımları</h4>
<ol><li>Çok sayıda firma (hepsi <b>price taker</b>)</li><li>Giriş ve çıkış tamamen serbest</li><li>Homojen (aynı) ürün</li><li>Tam bilgi (üretici ve tüketici)</li></ol>
${FIG2.pc}
<ul><li><b>Kısa dönem</b>: firma <b>P = MC</b> noktasında üretir. Aşırı kâr ya da zarar olabilir. Firmanın kısa dönem arz eğrisi, <b>MC eğrisinin AVC'nin üstündeki kısmıdır</b>.</li>
<li><b>Uzun dönem</b>: aşırı kâr varsa yeni firmalar girer → arz artar → fiyat düşer → kâr normale iner. Zarar varsa firmalar çıkar. Denge: <b>P = MC = LRAC (en düşük)</b>.</li>
<li>Endüstrinin uzun dönem arz eğrisi external ekonomiler varsa aşağı, external eksi ekonomiler varsa yukarı eğimlidir.</li>
<li>Büyük ölçek ekonomileri olsaydı büyük firmalar küçükleri yok eder, tam rekabet kalmazdı.</li></ul>
<h4>Tam rekabet en iyisi mi? (Box 6.2)</h4>
<ul><li><b>Artıları:</b> P = MC (kaynak dağılımı etkin), en düşük maliyette üretim, düşük fiyat, verimlilik baskısı, tüketici egemenliği.</li>
<li><b>Eksileri:</b> AR-GE yapmaya istek ve para yok, ürün çeşitliliği yok, adil gelir dağılımı ya da çevreye zarar vermeme garantisi yok.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Endüstrinin talep eğrisi aşağı eğimlidir ama <b>tek firmanınki yataydır</b>: firma piyasaya göre çok küçük olduğu için piyasa fiyatından istediği kadar satabilir, üstünde hiç satamaz.</div>` },

  { code: "6.3", title: "Monopoly", tr: "Tekel", html: `
<p>Sektörde <b>tek firma</b>. Ama bu, sektörün ne kadar dar tanımlandığına bağlıdır; önemli olan <b>tekel gücüdür</b> (yakın ikamelerin olmaması).</p>
<h4>Giriş engelleri (barriers to entry)</h4>
<ul><li><b>Economies of scale</b>: LRAC piyasanın tamamını karşılayan çıktıya kadar düşüyorsa <b>natural monopoly</b> (doğal tekel: su, elektrik şebekesi, demiryolu altyapısı). İki firma olsa ikisinin de maliyeti yüksek olurdu.</li>
<li>Ürün farklılaştırma ve marka sadakati, girdi kaynaklarını ya da satış noktalarını kontrol, <b>patent ve telif hakkı</b>, yasal koruma, rakipleri yok etme taktikleri (satın alma, agresif reklam, fiyat kırma), kurulum maliyetleri.</li></ul>
${FIG2.mono}
<ul><li>Kâr maksimizasyonu yine <b>MR = MC</b>. Fiyat talep eğrisinden okunur ve <b>P &gt; MC</b>'dir.</li>
<li>Giriş engelli olduğu için aşırı kâr <b>uzun dönemde de sürer</b>.</li>
<li>Tekelin arz eğrisi yoktur (miktar–fiyat tek bir ilişkiye bağlı değil).</li></ul>
<h4>Tekel ve kamu yararı</h4>
<ul><li><b>Aleyhine:</b> daha yüksek fiyat ve daha düşük üretim (tam rekabete göre), adaletsiz gelir dağılımı, rekabet olmadığı için verimsizlik ve <b>X inefficiency</b> (Box 6.5: maliyetleri kontrol etme baskısı yok), yenilik eksikliği, hükümet üzerinde siyasi baskı.</li>
<li><b>Lehine:</b> ölçek ekonomileri düşük fiyatlara yansıyabilir; yüksek kârlar <b>AR-GE</b> ve yatırıma gidebilir (yeni ürünler); <b>competition for corporate control</b> (satın alınma tehdidi) verimliliği zorlar.</li></ul>
<p class="fm">*Kâr maksimize eden fiyat: P = MC / (1 + 1/PED)</p>
<div class="tip"><b>Sınavda dikkat:</b> Tekel <b>talebin esnek</b> olduğu kısımda üretir, çünkü MC &gt; 0 ve MR = MC ise MR pozitiftir; MR pozitif ise talep esnektir.</div>` },

  { code: "6.4", title: "The theory of contestable markets", tr: "Yarışılabilir piyasalar teorisi", html: `
<ul><li>Fiyat ve üretimi belirleyen şey sektördeki firma sayısı değil, <b>gerçek bir rekabet tehdidi</b> olup olmadığıdır. <b>Potential competition</b> (potansiyel rekabet), gerçek rekabet kadar etkili olabilir.</li>
<li>Örnek: fabrikanın yemekhanesini işleten firma tekeldir ama fiyatı artırırsa fabrika başka bir firmayla anlaşabilir.</li>
<li><b>Perfectly contestable market</b>: giriş ve çıkış <b>maliyetsiz ve hızlıdır</b>. Tekel bile aşırı kâr ederse "vur-kaç" (hit-and-run) firmalar girer; bu yüzden tekel kârını <b>normal düzeyde</b> tutmak zorundadır.</li>
<li>Çıkış maliyeti <b>sunk costs</b>'a (batık maliyet: çıkarken geri alınamayan, ör. reklam, özel makine) bağlıdır. Batık maliyet ne kadar düşükse piyasa o kadar yarışılabilir.</li>
<li><b>Limit pricing</b>: tekel ya da oligopolün yeni girişleri caydırmak için fiyatı bilerek düşük tutması.</li>
<li>Örnek: havayolu deregülasyonu (Box 6.6): uçaklar kiralanabilir ve başka hatta kaydırılabilir → batık maliyet düşük → yeni girişler fiyatları düşürdü (düşük maliyetli havayolları).</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Teori, "firma sayısına bakarak" yapılan analizlere göre daha gerçekçidir. Politika sonucu: devlet tekelleri parçalamak yerine <b>giriş engellerini kaldırarak</b> piyasayı yarışılabilir yapabilir.</div>` },
  ]

  ch: 7, title: "Profit Maximising under Imperfect Competition", tr: "Eksik Rekabette Kâr Maksimizasyonu", part: "Part C",
  sections: [
  { code: "7.1", title: "Monopolistic competition", tr: "Tekelci rekabet", html: `
<ul><li>Çok sayıda firma, <b>serbest giriş</b>, ama her firma <b>farklılaştırılmış</b> bir ürün sattığı için biraz piyasa gücüne sahip (aşağı eğimli ama esnek talep). Örnek: restoranlar, kuaförler, yerel dükkânlar (Box 7.1: öğrenci dondurma satışı).</li>
<li><b>Kısa dönem</b>: MR = MC, aşırı kâr olabilir.</li>
<li><b>Uzun dönem</b>: serbest giriş aşırı kârı yok eder. Denge: talep (AR) eğrisi LRAC'a <b>teğet</b>tir, P = AC, normal kâr.</li>
<li>Talep eğrisi aşağı eğimli olduğu için teğet nokta LRAC'ın <b>en düşük noktasında değildir</b> → <b>excess capacity</b> (atıl kapasite): daha çok üreterek daha düşük maliyete inilebilirdi.</li>
<li>Gerçekte aşırı kâr sürebilir: eksik bilgi, tam serbest olmayan giriş, <b>fiyat dışı rekabet</b> (non-price competition): ürün geliştirme ve ürün tanıtımı (reklam).</li></ul>
<h4>Kamu yararı</h4>
<ul><li>Tam rekabete göre: atıl kapasite yüzünden <b>daha yüksek maliyet</b>, ama tüketiciye <b>daha çok çeşit</b>.</li>
<li>Tekele göre: daha az ölçek ekonomisi ve AR-GE, ama rekabet fiyatları daha düşük tutabilir.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Tekelci rekabetin uzun dönemi tam rekabete benzer (normal kâr), farkı <b>teğet noktası</b> ve <b>atıl kapasitedir</b>.</div>` },

  { code: "7.2", title: "Oligopoly", tr: "Oligopol", html: `
<p>Az sayıda firma sektörün büyük kısmını paylaşır. İki temel özellik:</p>
<ul><li><b>Giriş engelleri</b> (tekeldekilere benzer).</li><li><b>Interdependence</b> (karşılıklı bağımlılık): her firmanın kararı rakiplerin tepkisine bağlıdır.</li></ul>
<p>Firmalar arasında çelişki: <b>ortak kârı</b> en büyük yapmak için <b>işbirliği</b> (collusion) yapmak isterler; ama her biri en büyük payı ister, bu da onları <b>rekabete</b> iter.</p>
<h4>İşbirlikçi oligopol (collusive)</h4>
<ul><li><b>Cartel</b> (kartel): resmî işbirliği anlaşması, tekel gibi davranmayı amaçlar. Fiyatı belirleyip üyeleri pay için yarıştırabilir ya da <b>kotalar</b> verebilir. Örnek: <b>OPEC</b> (Box 7.3).</li>
<li>Kartel üyeleri <b>hile yapmaya</b> (gizlice fiyat kırıp daha çok satmaya) meyillidir; bu fiyat savaşı başlatabilir.</li>
<li><b>Tacit collusion</b> (örtülü işbirliği): <b>price leadership</b> (fiyat liderliği: baskın firma ya da "barometre" firma fiyatı belirler, diğerleri izler), ortalama maliyet fiyatlaması, <b>benchmark pricing</b> (yuvarlak fiyatlar gibi kurallar).</li>
<li>İşbirliği olasılığı artar: firma sayısı azsa, birbirlerine açıklarsa, ürün ve maliyetleri benzerse, baskın firma varsa, giriş engelleri yüksekse, piyasa istikrarlıysa, yasal yasak yoksa.</li></ul>
<h4>İşbirlikçi olmayan oligopol</h4>
<ul><li><b>Cournot</b> modeli: firma rakibin <b>miktarını</b> sabit varsayar → fiyat ve kâr tekelden düşük, tam rekabetten yüksek.</li>
<li><b>Bertrand</b> modeli: firma rakibin <b>fiyatını</b> sabit varsayar → fiyatlar normal kâra kadar düşer.</li>
<li><b>Kinked demand curve</b> (kırık talep eğrisi): firma, fiyatı <b>artırırsa rakiplerin izlemeyeceğini</b> (talep esnek), <b>düşürürse izleyeceğini</b> (talep esnek değil) varsayar. Sonuç: <b>fiyatlar katı (sabit)</b> kalır; MR eğrisinde bir boşluk olduğu için maliyet değişse bile fiyat değişmeyebilir.</li></ul>
<p>Oligopol kamu yararına mı? Duruma bağlı: rekabetin derecesi, <b>countervailing power</b> (karşı güç: büyük alıcılar), reklam, çeşitlilik, AR-GE ve piyasanın yarışılabilirliği.</p>
<div class="tip"><b>Sınavda dikkat:</b> IR öğrencisi için OPEC önemli: kartelin istikrarı, üyelerin kotayı aşma eğilimine ve OPEC dışı üreticilerin payına bağlıdır. Kartellerin çoğu ülkede yasadışıdır.</div>` },

  { code: "7.3", title: "Game theory", tr: "Oyun teorisi", html: `
<p><b>Game theory</b>, sonucun başkalarının seçimine de bağlı olduğu <b>stratejik</b> durumları inceler. Oligopolü ve uluslararası ilişkileri (silahlanma yarışı, ticaret savaşı) anlamada çok kullanılır.</p>
<ul><li><b>Single-move (normal-form) game</b>: tek seferlik oyun, kazanç matrisi (payoff matrix) ile gösterilir.</li>
<li><b>Dominant strategy</b> (baskın strateji): rakip ne yaparsa yapsın en iyi sonucu veren strateji.</li>
<li><b>Maximin</b> (düşük risk): her stratejinin <b>en kötü</b> sonucuna bak, en kötüsü en iyi olanı seç. <b>Maximax</b> (yüksek risk): her stratejinin <b>en iyi</b> sonucuna bak, en büyüğünü seç.</li>
<li><b>Nash equilibrium</b>: rakibin stratejisi veriyken hiçbir oyuncunun kendi stratejisini değiştirmek istemediği durum.</li></ul>
<h4>Mahkûmlar ikilemi (prisoners' dilemma, Box 7.4)</h4>
<p>Her oyuncu için <b>kendi çıkarına en iyi</b> seçim (itiraf etmek / fiyat kırmak), birlikte sonuçta ikisini de <b>daha kötü</b> duruma sokar. Nash dengesi, işbirliği yapsalardı elde edecekleri kârdan daha düşüktür.</p>
<table class="tbl"><tr><th>A \\ B</th><th>B: yüksek fiyat</th><th>B: düşük fiyat</th></tr>
<tr><td>A: yüksek fiyat</td><td>A 10, B 10</td><td>A 5, B 12</td></tr>
<tr><td>A: düşük fiyat</td><td>A 12, B 5</td><td><b>A 8, B 8</b> (Nash)</td></tr></table>
<p>Her ikisi için düşük fiyat baskın stratejidir → (8, 8). İşbirliği yapsalar (10, 10) alırlardı.</p>
<h4>Çok hamleli oyunlar (multiple-move games)</h4>
<ul><li>Oyuncular sırayla hareket eder; <b>decision tree</b> (karar ağacı) ile gösterilir.</li>
<li>Tehdit ve vaatler ancak <b>credible</b> (inandırıcı) ise etkilidir.</li>
<li><b>First-mover advantage</b>: önce davranan (ör. yeni ürünü ilk çıkaran) stratejik üstünlük kazanabilir.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Matris sorusunda her oyuncu için ayrı ayrı "rakip X yaparsa ben ne yaparım, Y yaparsa ne yaparım" diye bak. Her iki durumda da aynı seçim çıkıyorsa o baskın stratejidir.</div>` },

  { code: "7.4", title: "Price discrimination", tr: "Fiyat farklılaştırması", html: `
<p>Aynı ürünü, maliyet aynı olduğu halde farklı tüketicilere <b>farklı fiyatlarla</b> satmak.</p>
<ul><li><b>First-degree</b> (birinci derece): her tüketiciden ödemeye razı olduğu <b>en yüksek</b> fiyat alınır (pazarlık). Tüketici rantının tamamı firmaya geçer. Kâr maksimizasyonu: <b>P = MC</b>.</li>
<li><b>Second-degree</b>: alınan <b>miktara göre</b> farklı fiyat (ilk kilovatsaatler pahalı, sonrakiler ucuz).</li>
<li><b>Third-degree</b>: tüketiciler <b>ayrı gruplara</b> bölünür, her grupta farklı fiyat (öğrenci indirimi, gündüz/gece tren bileti, çocuk sinema bileti, ülkelere göre fiyat). <b>Talebi daha az esnek</b> olan gruba <b>daha yüksek</b> fiyat.</li></ul>
<h4>Koşullar</h4>
<ol><li>Firmanın <b>piyasa gücü</b> olmalı (fiyat belirleyici).</li><li>Piyasalar <b>ayrılabilmeli</b> ve ucuza alan pahalı piyasada <b>yeniden satamamalı</b>.</li><li>Gruplar arasında talep esnekliği <b>farklı</b> olmalı.</li></ol>
<p class="fm">Üçüncü derece: her piyasada MR₁ = MR₂ = MC</p>
<ul><li>Firma aynı satıştan <b>daha çok gelir</b> elde eder.</li><li>Kazananlar ve kaybedenler vardır: düşük fiyat ödeyen gruplar kazanır (bazıları hiç alamayacakken alabilir), yüksek fiyat ödeyenler kaybeder.</li><li><b>Peak-load pricing</b> (Box 7.6): yoğun saatlerde yüksek fiyat (maliyet de farklı olduğu için tam olarak ayrımcılık değildir).</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> İş seyahati yapanlar tren/uçak bileti talebinde esnek değildir (zorunlu, şirket öder) → pahalı esnek bilet; turistler esnek → ucuz, kısıtlamalı bilet.</div>` },
  ]
},

  ch: 8, title: "Alternative Theories of the Firm", tr: "Alternatif Firma Teorileri", part: "Part C",
  sections: [
  { code: "8.1", title: "Problems with traditional theory and alternative maximising theories", tr: "Geleneksel teorinin sorunları ve alternatif maksimizasyon teorileri (8.1–8.2)", html: `
<h4>Geleneksel kâr maksimizasyonu teorisine iki eleştiri</h4>
<ol><li>Firmaların kârı maksimize edecek <b>bilgisi olmayabilir</b>: talep, maliyet ve rakip tepkileri bilinmez; fırsat maliyeti kavramı kullanılmaz → basit <b>rules of thumb</b> (pratik kurallar).</li>
<li>Kâr maksimize etmeyi <b>istemeyebilirler</b>: büyük şirketlerde <b>sahiplik ile kontrolün ayrılması</b> (separation of ownership and control). Sahipler (hissedarlar) en yüksek kârı ister, kararları ise yöneticiler verir ve onlar kendi faydalarını en büyük yapmak ister → <b>profit satisficing</b> (yeterli kârla yetinmek).</li></ol>
<h4>Principal–agent problem (asıl–vekil sorunu)</h4>
<p>Vekil (yönetici) her zaman asılın (sahip) isteğine göre davranmaz. Sebep <b>asymmetric information</b> (asimetrik bilgi): yönetici, sahipten daha çok bilir. Çözüm: <b>izleme</b> (monitoring) ve <b>teşvik</b> (kâra bağlı prim, hisse opsiyonu). Aynı sorun IR'de de vardır (seçmen–politikacı, hükümet–diplomat).</p>
<h4>Alternatif maksimizasyon teorileri</h4>
<ul><li><b>Long-run profit maximisation</b>: bugünkü kâr yerine uzun dönem kârı. Tahmin etmek zordur.</li>
<li><b>Managerial utility maximisation</b> (Williamson): yönetici maaş, iş güvencesi, güç, prestij ister; yeterli kâr sağlandığı sürece serbesttir.</li>
<li><b>Sales revenue maximisation</b> (Baumol): yöneticiler satış gelirini en büyük yapmak ister (maaş ve prestij satışla bağlantılı). Kâr kısıtı yoksa <b>MR = 0</b> noktasında üretir. Sonuç: kâr maksimize edene göre <b>daha fazla üretim</b> ve <b>daha çok reklam</b>.</li>
<li><b>Growth maximisation</b> (büyüme): iç büyüme (kârı yeniden yatırmak, hisse ihracı, borçlanma) ya da birleşme. Yeterli kâr gerekir, yoksa şirket <b>ele geçirilmeye</b> (takeover) açık hâle gelir.</li></ul>
<h4>Büyüme yolları</h4>
<ul><li><b>Vertical integration</b> (dikey bütünleşme): üretim zincirinde geriye (tedarikçi) ya da ileriye (satış) doğru büyüme. Maliyeti düşürür, belirsizliği azaltır.</li>
<li><b>Merger</b> (birleşme): <b>horizontal</b> (aynı aşamadaki rakiple), <b>vertical</b> (farklı aşama), <b>conglomerate</b> (ilgisiz sektör). Birleşmeler dalgalar hâlinde gelir. Nedenler: büyüme, ölçek ekonomisi, piyasa gücü, hisse değeri, belirsizliği azaltma.</li>
<li><b>Strategic alliances</b> (stratejik ortaklık): yeni pazarlara giriş, risk paylaşımı, sermaye birleştirme. Ve <b>yurtdışına büyüme</b>.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Satış geliri maksimize eden firma (kısıtsız) MR = 0'da, kâr maksimize eden MR = MC'de üretir. MC &gt; 0 olduğu için satış maksimize eden firma <b>daha çok</b> üretir.</div>` },

  { code: "8.3", title: "Multiple aims and pricing in practice", tr: "Çoklu amaçlar ve uygulamada fiyatlama (8.3–8.4)", html: `
<h4>Çoklu amaçlar (behavioural theories)</h4>
<ul><li>Büyük firmada kararları birçok grup etkiler: yöneticiler, hissedarlar, işçiler, müşteriler, tedarikçiler, alacaklılar (<b>stakeholders</b>, paydaşlar, Box 8.6). Amaçları çelişir.</li>
<li>Firma birden çok çelişen amacı aynı anda maksimize edemez → her biri için <b>tatmin edici bir hedef</b> (satisficing) koyar.</li>
<li>Hedefler geçen yıl kolay tutturulduysa bu yıl yükseltilir; tutturulamadıysa <b>search procedure</b> (sorunu arama) ve yöneticiler arası <b>pazarlık</b> başlar.</li>
<li><b>Organisational slack</b> (örgütsel boşluk): hedefler tutmayınca kullanılmak üzere bırakılan pay; çatışmayı azaltır.</li>
<li>Satisficing firmalar daha az yenilikçi ve daha az agresiftir, değişikliği genelde rakiplere tepki olarak yapar; piyasa gücünü daha az kötüye kullanır ama <b>X inefficiency</b> daha fazla olabilir.</li></ul>
<h4>Uygulamada fiyatlama</h4>
<p>Firmalar MR ve MC eğrileri çizmez; basit kurallar kullanır.</p>
<p class="fm">Mark-up (cost-plus) pricing: P = AFC + AVC + kâr payı</p>

<li>*MC'ye ve esnekliğe göre kâr payı kâr maksimizasyonu verir: P = MC / (1 + 1/PED). Örnek: MC = £10, PED = −5 → P = 10 / 0.8 = <b>£12.50</b>.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Mark-up fiyatlama, firmanın kâr maksimize etmeye çalışmadığı (satisficing) ya da MC ve MR'yi bilmediği durumlarda en olasıdır.</div>` },

<p>Tam rekabetçi işgücü piyasasında ücret arz ve talep ile belirlenir. Firmalar ve işçiler <b>wage taker</b>'dır.</p>
<h4>Emek arzı</h4>
<ul><li>Bireyin çalışma saati arzı, işin <b>artan marjinal katlanılmazlığını</b> (marginal disutility of work) yansıtır: çok çalıştıkça her ek saat daha zahmetli olur.</li>
<li>Ücret artışının iki etkisi: <b>ikame etkisi</b> (+): boş zaman pahalılaştı, daha çok çalış. <b>Gelir etkisi</b> (−): zenginleştim, daha az çalışabilirim.</li>
<li>Gelir etkisi daha büyükse emek arz eğrisi <b>geriye bükülür</b> (backward-bending supply curve): yüksek ücretlerde ücret artışı çalışma saatini düşürür.</li>
<li>Tam rekabette tek bir işverene emek arzı <b>tamamen esnektir</b> (yatay). Piyasa arzı yukarı eğimlidir; esnekliği <b>emek hareketliliğine</b> (labour mobility, mesleki ve coğrafi) bağlıdır.</li></ul>
<h4>Emek talebi: marjinal verimlilik teorisi</h4>
<p class="fm">MRP_L = MPP_L × MR  ·  Kural: MRP_L = MC_L (tam rekabette = W)</p>
<ul><li><b>Marginal revenue product</b>: ek işçinin ürettiği çıktıdan firmanın elde ettiği ek gelir. Azalan verimler yüzünden düşer; MRP eğrisi firmanın emek talep eğrisidir.</li>
<li>Emek talebinin esnekliği daha yüksektir eğer: ürünün talebi esnekse, emek diğer faktörlerle kolayca ikame edilebiliyorsa, ikame faktörlerin arzı esnekse, ücretler toplam maliyetin büyük kısmıysa, uzun dönemse.</li></ul>
<h4>Ücret farklılıkları neden sürer?</h4>
<p>Farklı yetenek ve beceriler (<b>human capital</b>), eksik hareketlilik, işlerin farklı nitelikleri (tehlike, sevimsizlik), piyasa aksaklıkları, toprak ve sermaye sahipliğindeki eşitsizlik.</p>
<div class="tip"><b>Sınavda dikkat:</b> Tablo sorusu: MRP = MPP × P (tam rekabette MR = P). Ücret W ise, MRP ≥ W olan son işçiye kadar istihdam et.</div>` },

<h4>Monopsony (alıcı tekeli)</h4>

<li>Daha çok işçi almak için ücreti <b>herkese</b> artırması gerekir → <b>MC_L &gt; ücret (AC_L)</b>.</li>
<li>MRP_L = MC_L noktasında istihdam eder, ücreti arz eğrisinden okur → tam rekabete göre <b>daha az işçi, daha düşük ücret</b>.</li></ul>
<h4>Sendikalar (trade unions)</h4>
<ul><li>Sendika tekel satıcı gibi davranır. İşveren mal piyasasında tam/tekelci rekabetteyse, ücret artışı <b>istihdamı düşürür</b>.</li>
<li><b>Bilateral monopoly</b> (iki yanlı tekel): tekel sendika karşısında monopsonist işveren. Sendika ücreti monopsony düzeyinin üstüne <b>istihdamı düşürmeden</b> çıkarabilir (asgari ücret de benzer etki yapabilir). Tek bir denge yoktur; sonuç <b>toplu pazarlığa</b> (collective bargaining) bağlıdır: güç, tutum, beceri, firmanın kârlılığı, bilgi, yasal çerçeve. Tehditler (grev, lokavt) inandırıcı olmalıdır.</li></ul>
<h4>Diğer aksaklıklar</h4>
<ul><li>Eksik bilgi, süren dengesizlik, kâr maksimize etmeyen firmalar.</li>
<li><b>Discrimination</b> (ırk, cinsiyet, yaş ayrımcılığı): piyasa gücü olan işveren ayrımcılık yapılan grubun ücretini düşürebilir. Eşit ücret yasası, ayrımcılık da yasaklanmazsa bu grubun istihdamını azaltabilir.</li>
<li>Box 9.3: göç ve İngiltere işgücü piyasası; emek arzını artırır, bazı sektörlerde ücretleri etkileyebilir (IR için ilgili).</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> Monopsonide, monopsony ücreti ile rekabetçi ücret arasına konan bir asgari ücret istihdamı <b>artırabilir</b>; bu, tam rekabet modelindeki sonucun tersidir.</div>` },

<ul><li>Faktör <b>hizmetini kiralamak</b> (rent/hire) ile faktörü <b>satın almak</b> ayrı şeylerdir.</li>
<li>Toprak ve sermaye hizmetleri de MRP = fiyat (tam rekabette) ya da MRP = MC (monopsonide) noktasına kadar kullanılır. Sermayenin MRP'si azalan verimler yüzünden düşer.</li>
<li>Sermaye hizmetlerinin arzı kısa dönemde çok esnek değildir (makineler özeldir), uzun dönemde daha esnektir.</li></ul>
<h4>Yatırım kararı: indirgeme (discounting)</h4>
<p class="fm">Bugünkü değer PV = X / (1 + r)ⁿ</p>
<ul><li>Yatırımın gelecekteki tüm getirileri piyasa faiziyle bugüne indirgenir. <b>PV &gt; yatırımın maliyeti</b> ise yatırım yapılmalıdır (net present value pozitif).</li>
<li>Ya da yatırımın <b>getiri oranı</b> hesaplanıp başka yerde kazanılacak faizle karşılaştırılır.</li>
<li>Riskli yatırım için piyasa faizinden <b>daha yüksek</b> getiri istenir.</li>
<li>Faiz, <b>loanable funds</b> (ödünç verilebilir fonlar) arz ve talebiyle belirlenir. Fon arzı faize, tasarruf eğilimine ve beklentilere bağlıdır.</li>
<li>Finansman: <b>iç kaynak</b> (dağıtılmayan kâr) ya da <b>dış kaynak</b> (borç, hisse senedi). Borsa hem <b>birincil piyasa</b> (yeni hisseler, şirkete fon) hem <b>ikincil piyasa</b>dır (var olan hisselerin alım satımı).</li></ul>
<h4>Toprak ve rant</h4>
<ul><li>Toprağın arzı <b>tamamen (ya da neredeyse) esnek değildir</b> (dikey). Talebi toprağın MRP'sidir. Rant arz–talep ile belirlenir, bu yüzden <b>tamamen talep tarafından</b> belirlenir.</li>
<li>Toprağın fiyatı: kira getirisi (marjinal fayda) ile satın almak için borçlanmanın geri ödeme maliyeti (marjinal maliyet) eşitlenir. Faiz düşerse toprak fiyatı artar.</li>
<li>Kişinin geliri sadece ücrete değil, sahip olduğu toprak ve sermayeye de bağlıdır: <b>gelir dağılımının</b> son parçası.</li></ul>
<div class="tip"><b>Sınavda dikkat:</b> PV örneği: 2 yıl sonra alınacak £121, faiz %10 → 121 / 1.1² = <b>£100</b>. Faiz yükselirse gelecek getirilerin bugünkü değeri <b>düşer</b>, yatırım azalır.</div>` },

  o: ["X consumes less now, but its PPC shifts outwards faster in the future", "X consumes more now and grows faster", "Both countries grow at the same rate because their PPCs are identical", "X's PPC shifts inwards because it produces fewer consumer goods"],
  s: "Sermaye malları (makine, fabrika) bugün tüketilmez ama <b>gelecekteki üretim kapasitesini</b> artırır. X sermaye malına ağırlık verdiği için bugün daha az tüketim malı üretir (bugünkü tüketimin fırsat maliyeti). Karşılığında yatırım daha fazla olduğu için PPC'si ileride <b>daha hızlı dışarı kayar</b>. Bu, bugünkü tüketim ile gelecekteki büyüme arasındaki seçimdir. PPC'nin bugün aynı olması gelecekteki büyümenin aynı olacağı anlamına gelmez." },
{ l: 3, q: "In a simple circular flow model, households decide to spend more on goods. Which chain of events is most likely?",
  o: ["Firms' sales revenue rises, they demand more factors of production, and factor incomes paid to households rise", "Firms' revenue rises but factor incomes fall because firms keep the extra profit", "Only goods markets are affected; factor markets do not change", "Household incomes fall because they are spending more"],
  s: "Döngüsel akım, mal ve faktör piyasalarının <b>birbirine bağlı</b> olduğunu gösterir. Hanehalkı daha çok harcarsa firmaların satış geliri artar. Firmalar daha çok üretmek için daha çok emek ve diğer faktörleri talep eder. Faktör piyasasında bu, hanehalkına ödenen ücret, kira ve kârın artması demektir. Yani harcama artışı akım boyunca gelirleri de artırır. Kâr da hanehalkına (firma sahiplerine) giden bir faktör gelirdir." },
];

Q.t3 = [
{ l: 1, q: "In a command economy, decisions about what, how and for whom to produce are made mainly by:",
  o: ["The state (central planners)", "Consumers and firms through the price mechanism", "Trade unions", "Foreign governments"],
  s: "<b>Command economy</b> (komuta / planlı ekonomi) uçta yer alan sistemdir: tüm ekonomik kararları devlet verir. Ne kadar tüketim, ne kadar yatırım yapılacağını, her sektörün ne üreteceğini, hangi yöntemle üreteceğini ve çıktının kime gideceğini planlamacılar belirler. Fiyat mekanizmasıyla karar verilen sistem serbest piyasa ekonomisidir." },
{ l: 1, q: "In a free-market economy, if there is a shortage of a good, what normally happens?",
  o: ["The price rises until the shortage is eliminated", "The government introduces rationing", "The price falls", "Firms produce less of the good"],
  s: "Serbest piyasada <b>fiyat mekanizması</b> arz ile talebi dengeler. Kıtlık (talep &gt; arz) varsa alıcılar malı almak için rekabet eder, fiyat yükselir. Yüksek fiyat talep edilen miktarı düşürür ve arz edilen miktarı artırır, kıtlık kapanana kadar. Karne (rationing) bir devlet müdahalesidir, komuta ekonomisi ya da tavan fiyatlarla ilgilidir." },
{ l: 1, q: "Which description best fits a mixed economy?",
  o: ["Resources are allocated partly by the market and partly by the government", "All resources are owned and allocated by the state", "There is no government involvement at all", "Only foreign firms are allowed to operate"],
  s: "<b>Mixed economy</b> (karma ekonomi), piyasa ile devlet müdahalesinin karışımıdır. Kitabın vurgusu: gerçekte <b>tüm ekonomiler karmadır</b>; ülkeleri birbirinden ayıran şey devlet müdahalesinin derecesi ve biçimidir. Tamamen devlet kontrolü komuta ekonomisi, hiç müdahale olmaması saf serbest piyasadır." },
{ l: 2, q: "Which is a major problem of a command economy?",
  o: ["Planners need huge amounts of information, and incentives for workers and managers may be weak", "Prices change too quickly", "There is too much competition between firms", "Income is always very unequally distributed"],
  s: "Kitap komuta ekonomisinin sorunlarını şöyle sıralar: bilgiyi toplamak ve işlemek için <b>büyük bürokrasi</b> gerekir; fiyatlar ve üretim yöntemleri <b>keyfi</b> olabilir; <b>teşvikler</b> uygunsuz olabilir; <b>kıtlıklar ve fazlalar</b> ortaya çıkar. Hızlı fiyat değişimi ve aşırı rekabet piyasa ekonomisinin özellikleridir. Komuta ekonomisi tersine eşitliği hedefleyebilir." },
{ l: 2, q: "Adam Smith's idea of the 'invisible hand' suggests that:",
  o: ["Individuals pursuing their own self-interest in free markets are led to promote the interests of society", "Governments should secretly control markets", "Markets always lead to an equal distribution of income", "Firms should act out of kindness rather than profit"],
  s: "Adam Smith (Box 1.6), <i>The Wealth of Nations</i> (1776): kasap, fırıncı ya da biracı bize iyilik olsun diye değil, <b>kendi çıkarları</b> için mal satar. Ama rekabetçi piyasada, kendi çıkarının peşindeki bireyler bir 'görünmez el' tarafından yönlendirilmiş gibi toplumun çıkarına hizmet eder: insanların istediği mallar üretilir. Bu fikir eşit gelir dağılımını garanti etmez." },
{ l: 2, q: "Consumer demand for electric cars rises sharply. In a free-market economy, which sequence is most likely?",
  o: ["The price and profitability of electric cars rise, firms produce more, and the demand for (and wages of) workers making them rise", "The price of electric cars falls, so firms produce fewer", "The government orders factories to produce more electric cars", "The price stays the same but queues form"],
  s: "Piyasada mal ve faktör piyasaları <b>birbirine bağlıdır</b> (interdependence). Talep artışı → mal piyasasında kıtlık → fiyat ve kâr artar → firmalar bu mala yönelir, üretimi artırır → faktör piyasasında bu malı üretecek işçilere ve diğer faktörlere talep artar → ücretleri artar. Fiyat burada bir <b>sinyal</b> (ne üretilmeli) ve <b>teşvik</b> (üretmek kârlı) işlevi görür. Devlet emri komuta ekonomisidir; sabit fiyatla kuyruk ise fiyat kontrolü olduğunda olur." },
{ l: 3, q: "Which of the following is a weakness of a FREE-MARKET economy rather than of a command economy?",
  o: ["Firms may pollute the environment without paying for the damage", "Shortages persist because prices are fixed by the state", "A huge bureaucracy is needed to plan output", "Managers meet output targets by producing low-quality goods"],
  s: "Kitap serbest piyasanın sorunlarını sıralar: rekabet sınırlı olabilir (tekel gücü), büyük <b>eşitsizlik</b>, olumsuz <b>sosyal ve çevresel sonuçlar</b> (kirlilik gibi, firmalar bu maliyeti ödemez) ve <b>makroekonomik istikrarsızlık</b>. Diğer üç seçenek komuta ekonomisinin sorunlarıdır: devlet fiyatı sabitlediği için süren kıtlıklar, büyük planlama bürokrasisi ve kota tutturmak için düşük kalite." },
{ l: 3, q: "Soviet planners set a nail factory's target in tonnes of nails. The factory produced a small number of huge, heavy nails that nobody wanted. This mainly illustrates which problem of central planning?",
  o: ["Inappropriate incentives: managers meet the target rather than produce what users need", "The problem of too much competition", "The invisible hand working efficiently", "Excess demand caused by low prices"],
  s: "Bu klasik örnek komuta ekonomisinde <b>teşvik sorununu</b> (inappropriate incentives) gösterir. Yönetici ödülü kullanıcıların ihtiyacına değil, plandaki hedefe (ton) göre aldığı için hedefi en kolay tutturan şeyi yapar: az sayıda, çok ağır çivi. Hedef 'adet' olsaydı minik, işe yaramaz çiviler üretilirdi. Piyasada ise kimsenin almadığı çivi zarar ettirir, bu yüzden fiyat ve kâr doğru teşviki verir." },
{ l: 3, q: "In a free market, demand for coal falls permanently. What is the likely effect in the FACTOR market?",
  o: ["Demand for coal miners falls, so mining wages fall and/or jobs are lost, and labour moves to other industries", "Coal miners' wages rise because the price of coal falls", "Nothing happens in the factor market; only the coal price changes", "Demand for coal miners rises because firms must work harder"],
  s: "Mal piyasası ile faktör piyasası bağlıdır. Kömür talebi düşer → kömür fiyatı ve kârı düşer → firmalar üretimi azaltır → <b>kömür madencilerine talep</b> düşer → ücretler düşer ve/veya işler kaybedilir. Bu durum, işgücünün talebi artan başka sektörlere geçmesi için bir sinyaldir. Kısa vadede bu geçiş acılı olabilir (bölgesel işsizlik): bu da serbest piyasanın sosyal maliyetlerinden biridir." },
];

Q.t4 = [
{ l: 1, q: "The term 'ceteris paribus' means:",
  o: ["Other things being equal", "In the long run", "At the margin", "Prices are fixed"],
  s: "<b>Ceteris paribus</b> Latince 'diğer şeyler sabitken' demektir (Box 1.7). Ekonomistler bir değişkenin etkisini yalnız başına görmek için diğer belirleyicileri sabit varsayar. Örneğin talep kanunu 'ceteris paribus, fiyat artarsa talep edilen miktar düşer' der; gelir, zevkler, diğer malların fiyatları değişmiyor kabul edilir." },
{ l: 1, q: "Which of the following is a normative statement?",
  o: ["The government should reduce the level of unemployment", "Unemployment rose by 2 per cent last year", "Higher interest rates reduce consumer spending", "If the minimum wage is raised, some firms will employ fewer workers"],
  s: "<b>Normative statement</b> bir değer yargısıdır: ne olması gerektiğini söyler ('should', 'ought', 'fair', 'better'). 'Hükümet işsizliği azaltmalı' cümlesi bir görüştür, verilerle test edilemez. Diğer üç ifade <b>pozitiftir</b>: geçen yılın verisi, faiz ile harcama ilişkisi ve asgari ücretin istihdam etkisi gerçeklere bakarak test edilebilir." },
{ l: 1, q: "A positive statement is one that:",
  o: ["Can be tested by appeal to the facts", "Is always true", "Expresses an opinion about what ought to happen", "Is approved by most economists"],
  s: "Kitabın tanımı: <b>positive statement</b> değer yargısı içermeyen ve <b>gerçeklere başvurarak test edilebilen</b> bir ifadedir. Önemli: pozitif bir ifade <b>yanlış</b> da olabilir, test edilince yanlış çıkabilir; yine de pozitiftir. Ne olması gerektiğini söylemek normatiftir. Ekonomistlerin çoğunun onaylaması bir ifadeyi pozitif yapmaz." },
{ l: 2, q: "Classify: \"It is incorrect to state that putting up interest rates will reduce inflation.\"",
  o: ["Positive, because it is a claim about cause and effect that can be tested", "Normative, because it uses the word 'incorrect'", "Normative, because it is about government policy", "Neither positive nor normative"],
  s: "Bu cümle kitaptaki alıştırmalardan biridir. 'Incorrect' kelimesi değer yargısı değildir; cümle aslında 'faiz artışı enflasyonu düşürmez' diyor. Bu bir <b>neden-sonuç iddiasıdır</b> ve verilerle test edilebilir, yani <b>pozitiftir</b>. Politika hakkında olması da onu normatif yapmaz; normatif olması için 'yapılmalı/yapılmamalı' gibi bir değer yargısı gerekirdi." },
{ l: 2, q: "Why is it harder for economists than for natural scientists to make accurate predictions?",
  o: ["Economics studies human behaviour in a constantly changing environment, and controlled experiments are rarely possible", "Economists do not use models", "Economic theories cannot be tested at all", "Economists are less intelligent than physicists"],
  s: "Ekonomi bir <b>sosyal bilimdir</b>: insan davranışını inceler. İnsanların tercihleri, beklentileri değişir; ekonomik çevre sürekli değişir. Laboratuvarda 'diğer her şeyi sabit tutarak' deney yapmak çoğu zaman mümkün değildir. Yine de ekonomistler model kurar ve teorileri verilerle test eder; sadece tahmin daha zordur." },
{ l: 2, q: "An economic model consistently fails to predict what actually happens. According to scientific method, what should economists do?",
  o: ["Amend the model or abandon it", "Keep the model, because models do not need to match the facts", "Change the facts to fit the model", "Replace it with a normative statement"],
  s: "Kitaba göre ekonomistlerin yöntemi doğa bilimine benzer: model kurulur, model <b>tahmin</b> üretir, tahminler gerçeklerle <b>test edilir</b>. Model başarısızsa ya <b>değiştirilir</b> (amended: varsayımlar düzeltilir) ya da <b>bırakılır</b> (abandoned) ve yerine daha iyisi kurulur. Bilimsel bir model gerçeklere uymak zorundadır." },
{ l: 3, q: "\"Cutting the higher rates of income tax will redistribute incomes from the poor to the rich.\" This statement is:",
  o: ["Positive, because its effect on the distribution of income can be tested", "Normative, because it is about rich and poor people", "Normative, because it criticises the government", "Positive only if it is true"],
  s: "Kitaptaki alıştırma (a). Konusu gelir dağılımı (adalet) olsa da cümle bir <b>değer yargısı içermiyor</b>: bir politikanın <b>sonucunu</b> iddia ediyor. Vergi indiriminden sonra gelir dağılımına bakarak test edilebilir, bu yüzden pozitiftir. 'Sadece doğruysa pozitif' yanlıştır: yanlış çıksa da pozitif kalır. Normatif olsaydı şöyle olurdu: 'Zengine vergi indirimi yapmak adaletsizdir.'" },
{ l: 3, q: "What role should economists, as economists, play in government policy?",
  o: ["They can analyse which policy is more likely to achieve a given aim, but they have no special right to decide whether the aim is desirable", "They should decide what the government's goals ought to be", "They should only make normative statements", "They should avoid policy questions entirely"],
  s: "Kitap şunu vurgular: ekonomistler, bilim insanı olarak, politikaların <b>sonuçlarını</b> inceleyebilir (pozitif): 'kamu harcamasını artırmak işsizliği düşürür ama enflasyonu artırır'. Ama bu sonucun <b>istenir olup olmadığına</b> (normatif) karar vermekte başka vatandaşlardan daha fazla hakları yoktur. Değer yargısını birey olarak yapabilirler. Bu yüzden politika sorularından kaçmaları da gerekmez; hükümetin hedeflerine ulaşıp ulaşmadığını değerlendirmede büyük rol oynarlar." },
{ l: 3, q: "A model assumes that all firms aim to maximise profit, although some real firms have other aims. How should the model be judged?",
  o: ["By how well it explains and predicts real-world behaviour", "It should be rejected because its assumptions are not perfectly realistic", "It should be accepted because economists built it", "By whether its assumptions are normative"],
  s: "Modeller gerçeğin <b>sadeleştirilmiş</b> hâlidir; tüm ayrıntıyı içerseydi kullanışsız olurdu. Bu yüzden varsayımların tam gerçekçi olmaması modeli tek başına geçersiz kılmaz. Kitaba göre model, gerçek dünyadaki olayları ne kadar iyi <b>açıklayıp tahmin ettiğine</b> göre (gerçeklerle test edilerek) değerlendirilir. Tahminleri sürekli tutmazsa değiştirilir ya da bırakılır." },
];

Q.t5 = [
{ l: 1, q: "According to the law of demand, when the price of a good rises (ceteris paribus):",
  o: ["The quantity demanded falls", "The quantity demanded rises", "The demand curve shifts to the left", "Supply falls"],
  s: "<b>Law of demand</b>: diğer şeyler sabitken bir malın fiyatı artarsa, belli bir dönemde <b>talep edilen miktar</b> düşer. Bu, talep eğrisi <b>üzerinde</b> yukarı doğru bir harekettir; eğrinin kendisi kaymaz. Eğri sadece fiyat dışındaki belirleyiciler değişince kayar." },
{ l: 1, q: "On a demand curve diagram, what is shown on the vertical axis?",
  o: ["Price", "Quantity demanded per period of time", "Income", "Total revenue"],
  s: "Ekonomide gelenek: <b>fiyat dikey eksende</b> (y), <b>belli bir dönemdeki miktar yatay eksende</b> (x) gösterilir. Matematikte bağımsız değişken genelde yatay eksendedir; ekonomide ise fiyat dikeyde olduğu halde talebi belirleyen değişkendir. Bu farkı bilmek grafik okumada önemlidir." },
{ l: 1, q: "The price of petrol rises sharply. What is likely to happen to the demand for large cars?",
  o: ["It falls, because petrol and cars are complements", "It rises, because petrol and cars are substitutes", "It does not change, because only the price of cars affects car demand", "The quantity of cars demanded rises along the curve"],
  s: "Benzin ve araba <b>tamamlayıcı mallardır</b> (complements): birlikte kullanılırlar. Benzin pahalanınca araba kullanmanın toplam maliyeti artar, özellikle çok yakan büyük arabalar için. Bu yüzden büyük araba <b>talebi</b> düşer: talep eğrisi sola kayar. Arabanın kendi fiyatı değişmediği için bu bir eğri üzerinde hareket değil, kaymadır." },
{ l: 2, q: "When people's incomes rise, they buy fewer bus journeys. Bus travel is therefore:",
  o: ["An inferior good", "A normal good", "A complement to income", "A good with perfectly inelastic demand"],
  s: "Gelir artınca talebi <b>düşen</b> mallara <b>inferior good</b> (düşük mal) denir. İnsanlar zenginleşince otobüs yerine kendi arabalarını ya da taksiyi tercih eder. Gelir artınca talebi artan mallar <b>normal good</b>'dur. Düşük mal 'kalitesiz mal' demek değildir; sadece gelirle talep arasındaki ters ilişkiyi anlatır." },
{ l: 2, q: "Which of the following causes a MOVEMENT ALONG the demand curve for tea (not a shift)?",
  o: ["A fall in the price of tea", "A fall in the price of coffee", "An advertising campaign for tea", "A rise in consumers' incomes"],
  s: "Kural: malın <b>kendi fiyatı</b> değişirse eğri üzerinde hareket olur (change in quantity demanded). Başka herhangi bir belirleyici değişirse eğri kayar (change in demand). Kahvenin fiyatı (ikame), reklam (zevkler) ve gelir fiyat dışı belirleyicilerdir, bunlar çayın talep eğrisini kaydırır. Sadece çayın kendi fiyatındaki düşüş eğri üzerinde aşağı doğru harekettir." },
{ l: 2, q: "The substitution effect of a price rise means that:",
  o: ["Consumers switch to alternative goods that are now relatively cheaper", "Consumers' real income falls so they can afford less", "Producers switch to making other goods", "The demand curve shifts to the right"],
  s: "Talep kanununun iki açıklaması vardır:<br>• <b>Substitution effect</b> (ikame etkisi): fiyatı artan mal, alternatiflerine göre <b>görece pahalı</b> olur; tüketici ikamelere geçer.<br>• <b>Income effect</b> (gelir etkisi): fiyat artınca tüketicinin <b>reel geliri</b> düşer, aynı parayla daha az alabilir.<br>Gerçek gelirin düşmesi gelir etkisidir, ikame etkisi değildir. Üreticilerin geçişi arz tarafıdır." },
{ l: 3, q: "A market has three consumers. At £2 they buy A = 4, B = 6, C = 0 units. At £1 they buy A = 6, B = 9, C = 3 units. By how much does market quantity demanded increase when the price falls from £2 to £1?",
  o: ["8 units", "18 units", "10 units", "3 units"],
  s: "<b>Piyasa talebi</b>, her fiyatta bireysel taleplerin <b>toplamıdır</b> (yatay toplama).<br>£2'de: 4 + 6 + 0 = <b>10</b> birim.<br>£1'de: 6 + 9 + 3 = <b>18</b> birim.<br>Artış: 18 − 10 = <b>8 birim</b>. 18 ve 10 sadece tek bir fiyattaki toplamlardır. C'nin £2'de hiç almayıp £1'de 3 alması, fiyat düşünce piyasaya <b>yeni alıcıların</b> girdiğini de gösterir." },
{ l: 3, q: "The demand function for a good is Qd = 200 − 10P. Incomes then rise and the demand function becomes Qd = 260 − 10P. At the same time the price rises from £8 to £12. What is the overall change in quantity demanded?",
  o: ["It rises by 20 units", "It falls by 40 units", "It rises by 60 units", "It falls by 20 units"],
  s: "Başlangıç: eski fonksiyon, P = 8 → Qd = 200 − 80 = <b>120</b>.<br>Son durum: yeni fonksiyon, P = 12 → Qd = 260 − 120 = <b>140</b>.<br>Net değişim: 140 − 120 = <b>+20</b>.<br>Ayrıştırırsak: fiyat artışı tek başına (eğri üzerinde hareket) miktarı 40 düşürür (120 → 80, eski eğride); gelir artışı (eğrinin kayması) her fiyatta 60 artırır. Toplam: −40 + 60 = +20. '−40' sadece hareketi, '+60' sadece kaymayı görür." },
{ l: 3, q: "Which of the following would shift the demand curve for coffee to the LEFT?",
  o: ["A fall in the price of tea", "A rise in the price of coffee", "A rise in the price of tea", "A rise in incomes, if coffee is a normal good"],
  s: "Çay ve kahve <b>ikamedir</b>. Çay ucuzlarsa bazı insanlar kahveden çaya geçer, her fiyatta daha az kahve talep edilir: kahve talep eğrisi <b>sola</b> kayar. Çay pahalanırsa tersi olur (sağa kayma). Normal malda gelir artışı talebi sağa kaydırır. Kahvenin kendi fiyatının artması ise eğriyi kaydırmaz, eğri <b>üzerinde</b> harekettir: sınavda en sık düşülen tuzak budur." },
];

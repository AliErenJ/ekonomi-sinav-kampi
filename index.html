Q.t15 = [
{ l: 1, q: "The principle of diminishing marginal utility states that:",
  o: ["The more of a good a person consumes, the less extra satisfaction each additional unit gives", "Total utility falls as more of a good is consumed", "The price of a good falls as more is consumed", "Utility cannot be measured"],
  s: "<b>Marginal utility</b> (MU), bir birim daha tüketmenin verdiği <b>ek</b> tatmindir. Bir maldan ne kadar çok tüketirsen, her ek birimin verdiği tatmin <b>azalır</b> (ilk dilim pizza ile beşinci dilim). Toplam fayda (TU) ise MU pozitif olduğu sürece hâlâ <b>artar</b>, sadece daha yavaş; bu yüzden 'toplam fayda düşer' yanlıştır." },
{ l: 1, q: "According to marginal utility theory, a rational consumer will buy a good up to the point where:",
  o: ["Marginal utility equals price", "Total utility equals price", "Marginal utility is zero", "Total utility is at its maximum"],
  s: "Tüketici bir birim daha almanın faydasını (MU, para cinsinden) fiyatıyla karşılaştırır. MU &gt; P ise o birimi almak <b>tüketici rantını</b> artırır. MU &lt; P ise artık almaz. Bu yüzden <b>MU = P</b> olana kadar alır. MU = 0 noktası, mal bedava olsaydı tüketeceği miktardır (toplam faydanın en yüksek olduğu nokta)." },
{ l: 1, q: "Total utility from a good is at its maximum when:",
  o: ["Marginal utility is zero", "Marginal utility is at its maximum", "Marginal utility equals total utility", "Marginal utility is negative"],
  s: "MU, toplam faydadaki <b>değişimdir</b>. MU pozitifken TU artar, MU negatifken TU düşer. Bu yüzden TU, <b>MU = 0</b> olduğu noktada en yüksektir (bir birim daha hiçbir şey eklemiyor). Örneğin çok susamışken içilen su: belli bir bardaktan sonra bir bardak daha hiç tatmin vermez." },
{ l: 2, q: "A good costs £4. A consumer's marginal utility (in £) from successive units is 10, 8, 6, 4, 2. How much consumer surplus does she get if she behaves rationally?",
  o: ["£12", "£30", "£16", "£10"],
  s: "Rasyonel tüketici MU ≥ P olduğu sürece alır: MU'lar 10, 8, 6, 4 → <b>4 birim</b> (5. birimin MU'su 2 &lt; 4).<br><b>Consumer surplus</b> = her birim için (MU − P) toplamı:<br>(10 − 4) + (8 − 4) + (6 − 4) + (4 − 4) = 6 + 4 + 2 + 0 = <b>£12</b>.<br>£30 toplam faydadır (10+8+6+4+2), rant değildir. £16, 4 birimin toplam ödemesidir." },
{ l: 2, q: "Good A costs £4 and its marginal utility is 20. Good B costs £3 and its marginal utility is 30. To increase total utility, the consumer should:",
  o: ["Buy more B and less A", "Buy more A and less B", "Keep the same combination", "Buy more of both goods with the same income"],
  s: "<b>Equi-marginal principle</b>: harcanan son liranın her malda aynı faydayı vermesi gerekir (MUa/Pa = MUb/Pb).<br>A: 20 / 4 = <b>5</b> fayda/£<br>B: 30 / 3 = <b>10</b> fayda/£<br>B'ye harcanan her lira daha çok fayda veriyor → paranı A'dan B'ye kaydır. B'den çok aldıkça MU_B düşer, A'dan az aldıkça MU_A artar, oranlar eşitlenene kadar. Aynı gelirle ikisinden de fazla almak mümkün değildir." },
{ l: 2, q: "Water is essential for life, yet cheap; diamonds are not essential, yet expensive. Marginal utility theory explains this by saying that:",
  o: ["Price reflects marginal utility, and water is so plentiful that its marginal utility is low", "Price reflects total utility, which is higher for diamonds", "Water has no utility because it is cheap", "Diamonds have higher costs, so utility is irrelevant"],
  s: "Bu <b>su–elmas paradoksudur</b> (Box 4.2, marjinal fayda devrimi). Suyun <b>toplam</b> faydası çok yüksektir ama o kadar bol tüketiriz ki <b>bir bardak daha</b> suyun faydası (MU) çok düşüktür. Elmas çok kıt olduğu için ek bir elmasın MU'su yüksektir. Fiyatı belirleyen <b>marjinal</b> faydadır, toplam fayda değil." },
{ l: 3, q: "A consumer has £12 to spend. Good A costs £2 and good B costs £1. Marginal utilities: A = 20, 16, 12, 8 (1st to 4th unit); B = 10, 8, 6, 4, 3 (1st to 5th unit). Which combination maximises her utility?",
  o: ["4 units of A and 4 units of B", "3 units of A and 6 units of B", "6 units of A and 0 units of B", "2 units of A and 8 units of B"],
  s: "Her birim için <b>MU/P</b> (bir sterlin başına fayda) hesapla:<br>A: 20/2 = 10, 16/2 = 8, 12/2 = 6, 8/2 = 4<br>B: 10/1 = 10, 8, 6, 4, 3<br>En yüksek orandan başlayarak harca: 10'lar (A1 + B1 = £3), 8'ler (A2 + B2, toplam £6), 6'lar (A3 + B3, toplam £9), 4'ler (A4 + B4, toplam <b>£12</b>). Para bitti.<br>Sonuç: <b>4 A, 4 B</b>; kontrol 4×£2 + 4×£1 = £12 ✓, ve MU_A/P_A = 8/2 = 4 = MU_B/P_B = 4/1 ✓ (eşit marjinal ilke). Diğer seçenekler de £12 tutar ama daha düşük orandaki birimleri alıp daha yüksekleri bırakır." },
{ l: 3, q: "Why will market demand for a good tend to be more price elastic if it has many close substitutes, according to marginal utility theory?",
  o: ["Because marginal utility falls only slowly as consumption rises, as people readily switch to the good when its price falls", "Because marginal utility falls very quickly when there are substitutes", "Because total utility is higher for goods with substitutes", "Because substitutes make the demand curve vertical"],
  s: "Kitabın özeti (4.1, madde 6): talep esnekliği, MU'nun ne kadar <b>hızlı azaldığına</b> bağlıdır. Yakın ikameler varsa, fiyat düştüğünde insanlar ikamelerden bu mala kolayca geçer; daha çok tükettikçe faydası çok az düşer (çünkü ikamelerin yerini alıyor). MU yavaş düşerse fiyattaki küçük bir düşüş, miktarda büyük bir artışa yol açar → talep <b>esnektir</b>. Hiç ikamesi olmayan malda MU hızla düşer → talep esnek değildir." },
{ l: 3, q: "Marginal utility theory measures utility in money. A rich person and a poor person both pay £5 for the same cinema ticket. What weakness of this approach does the example show?",
  o: ["It assumes money has constant marginal utility, but the poor person probably gives up more utility by spending £5", "It shows that both people get exactly the same utility from the film", "It proves that rich people are irrational", "It shows that price does not affect demand"],
  s: "Faydayı parayla ölçmek hayali 'util' biriminden kurtarır ama bir varsayım getirir: <b>paranın marjinal faydası sabittir</b>. Gerçekte gelir arttıkça paranın marjinal faydası <b>azalır</b>: £5 yoksul birine zengin birinden çok daha değerlidir. Yani iki kişi aynı fiyatı ödese de vazgeçtikleri fayda farklıdır. Kitap bu yüzden daha tatmin edici bir yaklaşım olarak mallar arası seçime (eşit marjinal ilke, kayıtsızlık analizi) geçer." },
];

Q.t16 = [
{ l: 1, q: "A person who prefers a certain £50 to a 50% chance of winning £100 (and a 50% chance of nothing) is:",
  o: ["Risk averse", "A risk lover", "Risk neutral", "Irrational"],
  s: "Bahsin <b>beklenen değeri</b> = 0.5 × £100 + 0.5 × £0 = £50, yani kesin £50 ile aynıdır. Aynı beklenen değerde <b>kesin</b> olanı tercih eden kişi <b>risk averse</b>'tür (riskten kaçınan). Bahsi tercih eden risk lover, ikisine kayıtsız olan risk neutral olurdu. Kitaba göre riskten kaçınmak rasyoneldir (azalan marjinal fayda)." },
{ l: 1, q: "Insurance companies can take on risks that individuals want to avoid mainly because of:",
  o: ["The law of large numbers: across many independent policies, total losses become predictable", "Government guarantees on all claims", "The fact that accidents never happen", "Higher marginal utility of money for insurance companies"],
  s: "Tek bir ev sahibinin evinin yanıp yanmayacağı <b>öngörülemez</b>. Ama 100,000 evden yaklaşık kaçının yanacağı çok <b>öngörülebilirdir</b>: <b>law of large numbers</b> (büyük sayılar yasası). Şirket riski çok sayıda poliçeye yayar, toplam ödemeleri tahmin edip primleri buna göre belirler. Koşul: risklerin birbirinden <b>bağımsız</b> olması." },
{ l: 1, q: "A bet gives a 50% chance of winning £100 and a 50% chance of losing £60. What is its expected value?",
  o: ["+£20", "+£40", "+£80", "−£10"],
  s: "<b>Expected value</b> = Σ (olasılık × sonuç)<br>= 0.5 × (+£100) + 0.5 × (−£60) = £50 − £30 = <b>+£20</b>.<br>Bahis ortalamada kazandırıyor. Ama riskten kaçınan biri yine de reddedebilir: £60 kaybetmenin acısı ona daha büyük gelebilir (beklenen <b>fayda</b> beklenen paradan farklıdır). +£40, kaybı hesaba katmayan (100 − 60) bir hatadır." },
{ l: 2, q: "Why is it rational for most people to be risk averse?",
  o: ["Because of the diminishing marginal utility of income: losing £100 reduces utility more than gaining £100 increases it", "Because people always overestimate the probability of losses", "Because money has increasing marginal utility", "Because insurance is compulsory"],
  s: "Gelir arttıkça her ek liranın faydası azalır (<b>diminishing marginal utility of income</b>). Bu yüzden £100 kazanmak, son £100'ünü kaybetmekten <b>daha az</b> fayda değişimi yaratır. Adil bir bahiste (beklenen değer 0) bile beklenen fayda düşer. Rasyonel kişi bu yüzden riskten kaçınır ve kesinlik için para (sigorta primi) ödemeye razıdır. Kumar, ancak kumarın kendisi zevk veriyorsa rasyonel olabilir." },
{ l: 2, q: "People who know they are high-risk drivers are more likely to buy comprehensive car insurance, but the insurer cannot tell them apart from low-risk drivers. This is:",
  o: ["Adverse selection", "Moral hazard", "The law of large numbers", "Risk neutrality"],
  s: "<b>Adverse selection</b> (ters seçim, Box 4.5): sigortaya en çok ihtiyaç duyanlar (riski yüksek olanlar) daha çok başvurur ve sigortacı onları ayırt edemez (<b>asimetrik bilgi</b>). Prim ortalama riske göre belirlenirse düşük riskliler için pahalı olur, onlar ayrılır, havuz daha da riskli hale gelir. <b>Moral hazard</b> ise sigortalandıktan <b>sonra</b> davranışın değişmesidir." },
{ l: 2, q: "After insuring her phone against loss, Ayşe becomes careless and often leaves it on café tables. This is an example of:",
  o: ["Moral hazard", "Adverse selection", "Risk loving", "Diminishing marginal utility"],
  s: "<b>Moral hazard</b> (ahlaki tehlike): sigorta kişiyi kayıptan koruduğu için kişi <b>daha az dikkatli</b> davranır, bu da kayıp olasılığını artırır. Sigortacı onun davranışını tam izleyemez (asimetrik bilgi). Şirketler bu yüzden <b>muafiyet</b> (excess: ilk £50'yi sen ödersin) koyar ya da hasarsızlık indirimi verir, böylece kişi kaybın bir kısmını yine kendisi taşır." },
{ l: 3, q: "There is a 1% chance that a house's contents (worth £20,000) will be stolen this year. A risk-averse owner pays an insurance premium of £250. Which statement is correct?",
  o: ["The expected loss is £200; she pays more than this because she values certainty, and the insurer can cover costs and profit by pooling many such policies", "The expected loss is £250, so the premium is exactly fair", "She is irrational, because she pays more than the expected loss", "The expected loss is £20,000, so the premium is very cheap"],
  s: "Beklenen kayıp = 0.01 × £20,000 = <b>£200</b>.<br>Prim (£250) beklenen kayıptan £50 fazla. Bu irrasyonel değil: riskten kaçınan kişi için <b>£20,000'lik bir kayıp ihtimalinden kurtulmak</b>, ortalamada £50 ödemeye değer (büyük kaybın fayda kaybı çok büyük). Sigortacı ise binlerce bağımsız poliçede ortalama £200 öder; farktan yönetim maliyetlerini ve kârını karşılar. Böylece iki taraf da kazanır." },
{ l: 3, q: "Why might insurance companies refuse to cover, or charge very high premiums for, flood damage in a region where floods affect most houses at the same time?",
  o: ["The risks are not independent, so the law of large numbers does not make total losses predictable", "Because flood victims are risk lovers", "Because moral hazard is impossible with floods", "Because the expected value of flood damage is zero"],
  s: "Büyük sayılar yasası, risklerin <b>bağımsız</b> olmasını gerektirir: bir evin yanması diğerinin yanma ihtimalini değiştirmemelidir. Sel ise bölgedeki evlerin <b>çoğunu aynı anda</b> vurur. Şirket riski poliçelere yayamaz: kötü bir yılda herkes aynı anda tazminat ister ve şirket batabilir. Aynı sorun deprem, salgın ve savaş için de geçerlidir; bu yüzden devletler bu tür riskleri sıkça üstlenir (ör. DASK, terör sigortası havuzları)." },
{ l: 3, q: "A risk-averse person is offered a fair bet: a 50% chance of winning £1,000 and a 50% chance of losing £1,000. Why will she refuse it?",
  o: ["The utility lost from losing £1,000 is greater than the utility gained from winning £1,000, so the bet lowers her expected utility", "Because the expected value of the bet is negative", "Because the probabilities are unknown", "Because her marginal utility of income is rising"],
  s: "Bahsin beklenen <b>değeri</b> sıfırdır (0.5 × 1000 − 0.5 × 1000 = 0), yani 'adil' bir bahistir. Ama gelirin marjinal faydası azalan olduğu için:<br>• £1,000 kazanmak faydayı biraz artırır (ek paralar daha az değerli).<br>• £1,000 kaybetmek faydayı daha çok azaltır (kaybedilen paralar daha değerli).<br>Ortalaması alındığında beklenen <b>fayda</b> düşer, bu yüzden reddeder. Olasılıklar bilindiği için bu bir <b>risk</b> durumudur, belirsizlik değil." },
];

Q.t17 = [
{ l: 1, q: "An indifference curve shows:",
  o: ["All combinations of two goods that give a consumer the same level of satisfaction", "All combinations of two goods that a consumer can afford", "How demand changes when income changes", "The prices of two goods"],
  s: "<b>Indifference curve</b> (kayıtsızlık eğrisi): tüketicinin aralarında <b>kayıtsız</b> olduğu, yani aynı tatmini veren tüm sepetler. Faydayı <b>ölçmeye gerek yoktur</b>, sadece sıralama yeterlidir. Tüketicinin parasının yettiği bileşimleri gösteren çizgi <b>bütçe doğrusudur</b>." },
{ l: 1, q: "The slope of a budget line (with good X on the horizontal axis) is equal to:",
  o: ["Px / Py", "Py / Px", "MUx", "Income / Px"],
  s: "Bütçe doğrusu boyunca bir birim daha X almak için Px kadar para gerekir; bu para Px/Py birim Y'ye denk gelir. Bu yüzden eğim (mutlak değer) = <b>Px / Py</b>, yani göreli fiyattır. Gelir / Px ise doğrunun yatay ekseni kestiği noktadır (hepsi X'e harcanırsa)." },
{ l: 1, q: "If a consumer's income rises and prices stay the same, the budget line will:",
  o: ["Shift outwards parallel to the original line", "Pivot outwards on the Y axis", "Become steeper", "Shift inwards"],
  s: "Gelir artınca her iki maldan da daha fazla alınabilir ama <b>göreli fiyat</b> (Px/Py) değişmez. Bu yüzden eğim aynı kalır ve doğru <b>paralel olarak dışarı</b> kayar. Bir malın fiyatı değişseydi doğru diğer malın ekseni üzerinde <b>dönerdi</b> (pivot)." },
{ l: 2, q: "A consumer has £60. Good X costs £3 and good Y costs £2. Where does the budget line meet the axes?",
  o: ["20 units of X (horizontal axis) and 30 units of Y (vertical axis)", "30 units of X and 20 units of Y", "180 units of X and 120 units of Y", "20 units of X and 20 units of Y"],
  s: "Tüm gelir X'e harcanırsa: £60 / £3 = <b>20 birim X</b> (yatay eksen).<br>Tüm gelir Y'ye harcanırsa: £60 / £2 = <b>30 birim Y</b> (dikey eksen).<br>Eğim = 30/20 = 1.5 = Px/Py = 3/2 ✓. Bu iki nokta arasındaki düz çizgi tüketicinin alabileceği tüm bileşimlerdir. İkinci seçenek fiyatları ters kullanır." },
{ l: 2, q: "Why are indifference curves usually convex to the origin?",
  o: ["Because of a diminishing marginal rate of substitution: the more X a consumer has, the less Y she will give up for an extra unit of X", "Because prices rise as more is bought", "Because of increasing marginal utility", "Because the budget line is straight"],
  s: "<b>Marginal rate of substitution</b> (MRS) = bir birim daha X için vazgeçmeye razı olunan Y miktarı = eğrinin eğimi = MUx/MUy. Çok Y'si ve az X'i olan biri, bir X için çok Y verir; X arttıkça ve Y azaldıkça, X'in değeri gözünde düşer, Y'ninki artar → her ek X için <b>daha az</b> Y verir. Eğim giderek yatıklaşır: eğri orijine göre <b>dışbükeydir</b>." },
{ l: 2, q: "At a consumer's current choice, MUx / MUy = 2, while Px / Py = 1.5. To increase utility, she should:",
  o: ["Buy more X and less Y", "Buy more Y and less X", "Stay where she is, because she is at the optimum", "Spend less in total"],
  s: "Optimumda <b>MUx/MUy = Px/Py</b> olmalı (kayıtsızlık eğrisi bütçe doğrusuna teğet). Burada MUx/MUy = 2 &gt; 1.5: tüketici bir X'i 2 Y değerinde görüyor ama piyasada X sadece 1.5 Y'ye mal oluyor. X'i 'ucuz' buluyor → <b>daha çok X</b> almalı. X arttıkça MUx düşer, Y azaldıkça MUy artar, oran 1.5'e inene kadar. (Bu, eşit marjinal ilkenin aynısıdır.)" },
{ l: 3, q: "The price of good X falls. What happens to the budget line, and what is the line joining the new optimum points called?",
  o: ["It pivots outwards on the Y axis; the optimum points trace the price–consumption curve", "It shifts outwards parallel; the points trace the income–consumption curve", "It pivots inwards on the X axis; the points trace the demand curve", "It does not move; only the indifference curves shift"],
  s: "X ucuzlayınca, tüm gelir X'e harcandığında alınabilecek X artar ama Y'nin fiyatı değişmediği için Y eksenindeki kesişim <b>aynı kalır</b>. Doğru, Y ekseni üzerinde <b>dışarı döner</b> (pivot). Her fiyat için yeni teğet noktaları birleştiren çizgi <b>price–consumption curve</b>'dür; bundan X'in <b>talep eğrisi</b> türetilir. Paralel kayma gelir değişimidir (income–consumption curve)." },
{ l: 3, q: "A Giffen good is one for which:",
  o: ["It is an inferior good whose income effect is larger than its substitution effect, so a price rise increases quantity demanded", "Income and substitution effects both reduce quantity demanded when price rises", "Demand is perfectly elastic", "It is a luxury good with income elasticity above 1"],
  s: "Fiyat artışında:<br>• <b>İkame etkisi</b> her zaman miktarı düşürür (mal göreli olarak pahalandı).<br>• <b>Gelir etkisi</b>: normal malda miktarı düşürür; <b>düşük</b> malda miktarı <b>artırır</b> (fakirleşen kişi ucuz mala daha çok yönelir).<br><b>Giffen good</b>: gelir etkisi ikame etkisinden <b>büyük</b> olan düşük mal. Sonuçta fiyat artınca talep edilen miktar <b>artar</b> (talep eğrisi yukarı eğimli). Klasik örnek: çok yoksul hanelerin temel gıdası (19. yüzyıl İrlanda patatesi). Çok nadirdir." },
{ l: 3, q: "The price of an inferior good (which is NOT a Giffen good) falls. What are the income and substitution effects on the quantity demanded?",
  o: ["Substitution effect increases quantity; income effect reduces it; overall quantity rises because the substitution effect is larger", "Both effects increase quantity", "Both effects reduce quantity", "Substitution effect reduces quantity; income effect increases it; overall quantity falls"],
  s: "Fiyat düşünce:<br>• <b>İkame etkisi</b>: mal göreli olarak ucuzladı → miktar <b>artar</b> (her mal için).<br>• <b>Gelir etkisi</b>: reel gelir arttı; mal <b>düşük</b> olduğu için zenginleşen tüketici ondan <b>daha az</b> ister → miktar <b>azalır</b>.<br>Giffen olmayan düşük malda ikame etkisi daha büyüktür → toplamda miktar <b>artar</b>, talep eğrisi normal biçimde aşağı eğimlidir. Normal malda ise iki etki de aynı yöndedir (ikisi de miktarı artırır)." },
];

Q.t18 = [
{ l: 1, q: "In economics, the short run is a period in which:",
  o: ["At least one factor of production is fixed", "All factors of production are variable", "Firms cannot change output at all", "Technology changes"],
  s: "<b>Short run</b>: en az bir faktör (genelde bina, makine) <b>sabittir</b>; firma sadece değişken faktörleri (emek, ham madde) değiştirerek üretimi ayarlar. <b>Long run</b>: tüm faktörler değişkendir. Süre takvimle değil, sektöre göre tanımlanır: bir kafe için birkaç ay, bir elektrik santrali için yıllar. Teknolojinin değiştiği dönem 'very long run'dır." },
{ l: 1, q: "The law of diminishing marginal returns states that:",
  o: ["When more of a variable factor is added to a fixed factor, eventually each extra unit adds less to output", "When all factors are doubled, output less than doubles", "Total output falls as soon as more workers are hired", "Costs fall as output rises"],
  s: "Sabit bir faktöre (ör. tek bir fırın, Box 5.2) <b>değişken</b> faktör (işçi) eklendikçe, bir noktadan sonra her ek işçinin üretime katkısı (<b>MPP</b>) azalır: fırın etrafında kalabalık olur. Toplam üretim yine artabilir, sadece daha yavaş. 'Tüm faktörler iki katına çıkınca' durumu ölçeğe göre getiridir (uzun dönem), farklı bir kavramdır." },
{ l: 1, q: "Average physical product of labour (APP) is calculated as:",
  o: ["Total physical product ÷ number of workers", "Change in total product ÷ change in workers", "Total physical product × wage", "Number of workers ÷ total product"],
  s: "<b>APP = TPP / L</b>: işçi başına ortalama üretim. <b>MPP = ΔTPP / ΔL</b>: bir işçi daha eklemenin getirdiği ek üretim. Örnek: 4 işçi 60 birim üretiyorsa APP = 15." },
{ l: 2, q: "Workers (1 to 5) produce total output of 10, 25, 45, 60, 70 units. With which worker do diminishing marginal returns set in?",
  o: ["The 4th worker", "The 2nd worker", "The 3rd worker", "The 5th worker"],
  s: "MPP = toplam üretimdeki artış:<br>1. işçi: 10, 2. işçi: 25 − 10 = 15, 3. işçi: 45 − 25 = 20, 4. işçi: 60 − 45 = <b>15</b>, 5. işçi: 70 − 60 = 10.<br>MPP 3. işçiye kadar <b>artıyor</b> (uzmanlaşma), 4. işçiyle ilk kez <b>düşüyor</b>. Azalan verimler 4. işçiyle başlar. Toplam üretim yine de artmaya devam ediyor; azalan verim, toplam üretimin düşmesi demek değildir." },
{ l: 2, q: "When marginal physical product (MPP) is above average physical product (APP), APP must be:",
  o: ["Rising", "Falling", "At its minimum", "Zero"],
  s: "Ortalama–marjinal ilişkisi (Box 5.3): sınıf ortalaması 60 iken gelen yeni öğrencinin notu 80 ise ortalama <b>yükselir</b>; 40 ise düşer. Aynı şekilde ek işçinin üretimi (MPP) ortalamanın (APP) üstündeyse APP <b>artar</b>. MPP, APP'nin altına inince APP düşmeye başlar. Bu yüzden MPP eğrisi APP eğrisini APP'nin <b>en yüksek</b> noktasından keser." },
{ l: 2, q: "Total physical product is at its maximum when:",
  o: ["Marginal physical product is zero", "Marginal physical product is at its maximum", "Average physical product is at its maximum", "Marginal physical product equals average physical product"],
  s: "MPP, toplam üretimdeki <b>değişimdir</b>. MPP pozitifken TPP artar; MPP negatifse (çok fazla işçi birbirinin işine engel oluyor) TPP düşer. Bu yüzden TPP, <b>MPP = 0</b> olduğunda en yüksektir. MPP = APP olan nokta ise APP'nin en yüksek noktasıdır, TPP'nin değil." },
{ l: 3, q: "Workers (1 to 5) produce total output of 10, 25, 45, 60, 70 units. Why does average product fall when the 5th worker is hired?",
  o: ["Because the 5th worker's marginal product (10) is below the average product of the first four (15)", "Because total output falls", "Because the 5th worker's marginal product is negative", "Because average product is always falling"],
  s: "4 işçide APP = 60/4 = <b>15</b>. 5. işçinin MPP'si = 70 − 60 = <b>10</b>.<br>Yeni işçinin katkısı ortalamanın <b>altında</b> olduğu için ortalamayı aşağı çeker: 5 işçide APP = 70/5 = <b>14</b>.<br>Toplam üretim düşmüyor (60 → 70), MPP de negatif değil. Bu, 'MPP &lt; APP ise APP düşer' kuralının sayısal örneğidir." },
{ l: 3, q: "Thomas Malthus predicted that population growth would lead to falling food output per person. Which concept was his argument based on, and why did his prediction largely fail in industrialised countries?",
  o: ["Diminishing returns to labour on a fixed supply of land; technological progress raised output from each hectare", "Increasing returns to scale; governments banned population growth", "Diminishing marginal utility; people ate less food", "Economies of scale; farms became too large"],
  s: "Malthus (Box 5.1): toprak <b>sabit</b> bir faktördür. Nüfus (emek) arttıkça her ek çiftçinin ürettiği gıda azalır: <b>azalan verimler</b>. Bu yüzden kişi başı gıda düşecek ve kıtlık nüfusu sınırlayacaktı ('dismal science'). Tahminin büyük ölçüde tutmamasının sebebi <b>teknolojik ilerlemedir</b> (gübre, makine, yeni tohumlar): aynı topraktan çok daha fazla ürün alındı. Bu, toplam üretim eğrisinin yukarı kaymasıdır. Azalan verimler, teknoloji sabitken geçerlidir." },
{ l: 3, q: "A firm doubles ALL of its inputs (labour, machines and buildings) and its output rises by 80%. This is an example of:",
  o: ["Decreasing returns to scale", "Diminishing marginal returns", "Increasing returns to scale", "Constant returns to scale"],
  s: "<b>Tüm</b> girdiler değiştiği için bu bir <b>uzun dönem</b> durumudur ve <b>ölçeğe göre getiri</b> ile ölçülür. Girdiler %100 arttı, çıktı sadece %80 arttı → çıktı girdilerden <b>daha az</b> oranda arttı → <b>decreasing returns to scale</b>. 'Diminishing marginal returns' ise sadece <b>bir</b> faktör değişirken diğerleri sabitken (kısa dönem) ortaya çıkar. İkisini karıştırmak sınavda en sık yapılan hatadır." },
];

Q.t19 = [
{ l: 1, q: "Which of the following is most likely to be a fixed cost in the short run?",
  o: ["Rent on the factory building", "Raw materials", "Electricity used by machines", "Wages of temporary workers paid per hour"],
  s: "<b>Fixed costs</b> (sabit maliyetler) kısa dönemde üretimle <b>değişmez</b>: hiçbir şey üretmesen bile ödersin (kira, sigorta, kredi faizi). Ham madde, makinelerin kullandığı elektrik ve saatlik ücretler üretim arttıkça artar: <b>variable costs</b> (değişken maliyetler)." },
{ l: 1, q: "Marginal cost is:",
  o: ["The extra cost of producing one more unit of output", "Total cost divided by output", "Fixed cost plus variable cost", "The cost of the first unit produced"],
  s: "<b>MC = ΔTC / ΔQ</b>: bir birim daha üretmenin getirdiği <b>ek</b> maliyet. Sabit maliyetler değişmediği için MC aynı zamanda değişken maliyetteki artıştır (ΔTVC/ΔQ). TC / Q ise <b>average cost</b> (AC), TFC + TVC ise toplam maliyettir." },
{ l: 1, q: "As output rises, average fixed cost (AFC):",
  o: ["Falls continuously", "Rises continuously", "Stays constant", "First falls, then rises"],
  s: "AFC = TFC / Q. Toplam sabit maliyet aynı kalırken daha fazla birime bölünür, bu yüzden üretim arttıkça AFC <b>sürekli düşer</b> (ama sıfıra hiç ulaşmaz). Örnek: £1,000 kira, 100 birimde birim başına £10, 1,000 birimde £1. 'Önce düşer sonra artar' AVC ve AC için geçerlidir." },
{ l: 2, q: "The owner of a small shop could earn £30,000 a year working for another firm. In the economist's measure of the shop's costs, this £30,000 is:",
  o: ["An implicit cost (opportunity cost of a factor the firm already owns)", "An explicit cost", "Not a cost, because no money is paid", "A variable cost paid to suppliers"],
  s: "Ekonomistler maliyeti <b>fırsat maliyeti</b> ile ölçer. Firmanın sahip olduğu faktörleri (sahibinin kendi emeği, kendi binası, kendi sermayesi) kullanmak için para ödenmez ama yine de bir maliyeti vardır: o faktörün en iyi alternatifte kazanabileceği. Buna <b>implicit cost</b> (örtük maliyet) denir. Dışarıdan alınan faktörlere ödenen para ise <b>explicit cost</b>'tur. Muhasebeciler örtük maliyeti saymaz." },
{ l: 2, q: "A firm has total fixed cost of £100. Total variable cost is £40 for 1 unit, £70 for 2, £110 for 3 and £170 for 4. What are the average cost and the marginal cost of the 4th unit?",
  o: ["AC = £67.50, MC = £60", "AC = £42.50, MC = £60", "AC = £67.50, MC = £170", "AC = £90, MC = £60"],
  s: "4 birimde: TC = TFC + TVC = 100 + 170 = <b>£270</b>.<br>AC = TC / Q = 270 / 4 = <b>£67.50</b>.<br>MC (4. birim) = TVC(4) − TVC(3) = 170 − 110 = <b>£60</b> (sabit maliyet MC'ye girmez).<br>£42.50 sadece AVC'dir (170/4), £170 toplam değişken maliyettir." },
{ l: 2, q: "If marginal cost is below average cost, then average cost must be:",
  o: ["Falling", "Rising", "At its minimum", "Equal to marginal cost"],
  s: "Ortalama–marjinal kuralı maliyetlere de uygulanır: ek birim ortalamadan <b>ucuza</b> üretiliyorsa ortalamayı aşağı çeker → AC <b>düşer</b>. MC, AC'nin üstüne çıkınca AC yükselmeye başlar. Bu yüzden MC eğrisi AC (ve AVC) eğrisini en <b>düşük</b> noktasından keser." },
{ l: 3, q: "A café earns revenue of £200,000 a year. It pays £150,000 in wages, rent and supplies. The owner could earn £40,000 elsewhere, and the £100,000 she invested could earn £15,000 a year in a bank. What are the accounting profit and the economic (supernormal) profit?",
  o: ["Accounting profit £50,000; economic profit −£5,000 (a loss)", "Accounting profit £50,000; economic profit £50,000", "Accounting profit £10,000; economic profit −£5,000", "Accounting profit −£5,000; economic profit £50,000"],
  s: "<b>Muhasebe kârı</b> = gelir − açık maliyetler = 200,000 − 150,000 = <b>£50,000</b>.<br><b>Ekonomik kâr</b> = gelir − açık − örtük maliyetler:<br>Örtük maliyetler: sahibinin vazgeçtiği maaş £40,000 + sermayesinin vazgeçilen faizi £15,000 = £55,000.<br>200,000 − 150,000 − 55,000 = <b>−£5,000</b>.<br>Kâğıt üstünde kâr var ama sahibi kendi emeğini ve parasını başka yerde kullansa £5,000 daha iyi durumda olurdu: <b>normal kârı</b> bile karşılamıyor. Uzun dönemde işi kapatması rasyonel olabilir." },
{ l: 3, q: "A firm bought raw materials for £10 a tonne last year. Their market price is now £15 a tonne. What is the opportunity cost of using a tonne in production today?",
  o: ["£15, because that is what the firm gives up by not selling it now", "£10, the price actually paid", "£0, because it has already been paid for", "£5, the difference"],
  s: "Box 5.5 (geçmiş maliyetleri kullanma hatası): karar verirken önemli olan <b>bugünkü fırsat maliyetidir</b>, geçmişte ödenen fiyat (historic cost) değil. Firma bu ham maddeyi kullanmak yerine bugün piyasada <b>£15</b>'ten satabilirdi; kullanınca bu £15'ten vazgeçiyor. £10 ile hesaplarsa maliyeti olduğundan düşük görür ve kârsız işleri kârlı sanabilir." },
{ l: 3, q: "A firm pays each worker £60 a day. Labour is the only variable factor. When the marginal product of an extra worker is 20 units a day, the marginal cost of output is £3. If diminishing returns reduce the marginal product to 15 units, what is the marginal cost now?",
  o: ["£4", "£3", "£2.25", "£45"],
  s: "Ek işçi £60'a mal olur ve MPP kadar ek çıktı üretir. Bu yüzden bir birim daha çıktının maliyeti:<br><b>MC = W / MPP</b><br>MPP = 20 iken: 60 / 20 = £3 ✓<br>MPP = 15 iken: 60 / 15 = <b>£4</b>.<br>Bu, kısa dönem maliyetlerin üretimden nasıl türetildiğini gösterir: <b>MPP düşerken MC yükselir</b>. Azalan verimler, MC eğrisinin yukarı eğimli olmasının sebebidir." },
];

Q.t20 = [
{ l: 1, q: "In the long run:",
  o: ["All factors of production are variable", "At least one factor is fixed", "Only labour can be changed", "Technology must change"],
  s: "<b>Long run</b>: firmanın yeni fabrika kurmak, yeni makine almak, yer ve üretim tekniği değiştirmek için yeterli zamanı vardır; <b>tüm</b> faktörler değişkendir. Bu yüzden uzun dönemde <b>sabit maliyet yoktur</b>. Teknolojinin de değiştiği dönem 'very long run' olarak ayrıca tanımlanır." },
{ l: 1, q: "Economies of scale occur when:",
  o: ["Average cost per unit falls as the scale of production increases", "Total cost falls as output increases", "A firm's profits rise because prices rise", "Marginal cost rises as more is produced in the short run"],
  s: "<b>Economies of scale</b>: üretim ölçeği (firmanın büyüklüğü) arttıkça <b>birim maliyetin</b> (LRAC) düşmesi. Toplam maliyet tabii ki artar, düşen birim başına maliyettir. Kısa dönemde artan MC, azalan verimlerle ilgilidir, ölçekle değil." },
{ l: 1, q: "A firm increases all its inputs by 10% and output rises by 15%. This shows:",
  o: ["Increasing returns to scale", "Decreasing returns to scale", "Constant returns to scale", "Diminishing marginal returns"],
  s: "Tüm girdiler %10 arttı, çıktı %15 arttı: çıktı girdilerden <b>daha fazla</b> oranda arttı → <b>increasing returns to scale</b>. Aynı oranda (%10) artsaydı constant, daha az artsaydı decreasing returns to scale olurdu. Ölçeğe göre artan getiri, ölçek ekonomilerinin bir kaynağıdır." },
{ l: 2, q: "A large car plant divides production into many small tasks, with each worker becoming skilled at one task. Which source of economies of scale is this?",
  o: ["Specialisation and the division of labour", "The container principle", "Financial economies", "External economies of scale"],
  s: "<b>Specialisation and division of labour</b> (uzmanlaşma ve işbölümü): büyük firma işi küçük parçalara bölebilir; her işçi bir işte ustalaşır, iş değiştirirken zaman kaybedilmez, özel makineler kullanılabilir. Küçük firmada bir kişi birçok işi birden yapmak zorundadır. Adam Smith'in iğne fabrikası örneği bunu anlatır." },
{ l: 2, q: "Which of the following is a likely cause of diseconomies of scale?",
  o: ["Management becomes harder to coordinate, and communication and worker motivation suffer in very large firms", "Bulk buying of raw materials", "Cheaper borrowing for large firms", "Using larger, more efficient machines"],
  s: "<b>Diseconomies of scale</b>: firma çok büyüyünce birim maliyet yeniden <b>yükselir</b>. Nedenler: yönetim kademeleri artar ve <b>koordinasyon</b> zorlaşır, iletişim yavaşlar, bürokrasi, işçilerin kendini önemsiz hissetmesi (<b>motivasyon</b>), grevlerin etkisi büyür. Toplu alım, ucuz borçlanma ve büyük makineler ölçek <b>ekonomileridir</b>." },
{ l: 2, q: "Many software firms locate in the same region, which develops a pool of skilled workers, specialist suppliers and good transport links. Every firm's costs fall. This is an example of:",
  o: ["External economies of scale", "Internal economies of scale", "Diminishing returns", "Diseconomies of scale"],
  s: "<b>External economies of scale</b>: birim maliyetin tek firmanın kendi büyümesinden değil, <b>sektörün (ya da bölgenin) büyümesinden</b> dolayı düşmesi. Nitelikli işgücü havuzu, yan sanayi, ortak altyapı ve bilgi paylaşımı her firmaya yarar (Silikon Vadisi, Londra'nın finans merkezi). Firmanın kendi büyüklüğünden gelen avantajlar <b>internal</b> ekonomilerdir." },
{ l: 3, q: "For a firm, the marginal product of labour is 20 units and labour costs £10 per unit; the marginal product of capital is 60 units and capital costs £20 per unit. To minimise the cost of producing its output, the firm should:",
  o: ["Use more capital and less labour", "Use more labour and less capital", "Keep the current combination", "Reduce both labour and capital equally"],
  s: "En az maliyetli bileşim kuralı: <b>MPP_L / P_L = MPP_K / P_K</b> (her faktöre harcanan son lira aynı ek üretimi vermeli).<br>Emek: 20 / 10 = <b>2</b> birim/£<br>Sermaye: 60 / 20 = <b>3</b> birim/£<br>Sermayeye harcanan her lira daha çok üretiyor → emekten sermayeye kay. Sermaye arttıkça MPP_K düşer, emek azaldıkça MPP_L artar, oranlar eşitlenene kadar. Bu, tüketicinin eşit marjinal ilkesinin üretimdeki karşılığıdır (isoquant–isocost teğet noktası)." },
{ l: 3, q: "A firm doubles the length, width and height of a storage tank. Why does this give economies of scale (the 'container principle')?",
  o: ["The surface area (and so material cost) rises 4 times, but the capacity (volume) rises 8 times, so cost per unit of capacity falls", "Both cost and capacity double, so cost per unit is unchanged", "Capacity rises 4 times but cost rises 8 times", "Bigger tanks are always cheaper in total"],
  s: "Tankın maliyeti büyük ölçüde <b>yüzey alanına</b> (malzeme) bağlıdır, kapasitesi ise <b>hacmine</b>.<br>Boyutlar 2 katına çıkınca: yüzey alanı 2² = <b>4 kat</b>, hacim 2³ = <b>8 kat</b> artar.<br>Maliyet 4 kat, kapasite 8 kat → birim kapasite başına maliyet <b>yarıya</b> iner. Bu bir <b>teknik ölçek ekonomisidir</b> ve petrol tankerlerinin, boru hatlarının, fırınların neden çok büyük yapıldığını açıklar. Toplam maliyet tabii ki artar." },
{ l: 3, q: "In an industry, minimum efficient scale (MES) is reached at an output equal to 40% of total market demand. What is the likely market structure?",
  o: ["Only about two firms can operate at efficient size, so the industry is likely to be highly concentrated (oligopoly or even monopoly)", "Many small firms, because MES is irrelevant to market structure", "Perfect competition, because MES is below 100%", "There must be exactly 40 firms"],
  s: "<b>Minimum efficient scale</b> (Box 5.8): LRAC'ın düzleştiği, ölçek ekonomilerinin büyük ölçüde tükendiği en küçük üretim. MES piyasanın %40'ıysa, en düşük maliyetle çalışabilecek firma sayısı en fazla 100/40 = <b>2.5</b>, yani yaklaşık 2'dir. Daha küçük firmalar çok daha yüksek maliyetle çalışır ve rekabet edemez. Bu yüzden sektör <b>yoğunlaşmış</b> olur (oligopol); MES piyasanın tamamına yakınsa doğal tekel çıkar. MES piyasaya göre küçükse çok sayıda firma sığar." },
];

Q.t21 = [
{ l: 1, q: "Average revenue (AR) is equal to:",
  o: ["Price", "Total revenue × quantity", "Marginal revenue in all cases", "Total cost ÷ quantity"],
  s: "<b>AR = TR / Q</b>. TR = P × Q olduğu için AR = (P × Q) / Q = <b>P</b>. Bu yüzden firmanın AR eğrisi, ürününün <b>talep eğrisiyle</b> aynıdır. MR ancak fiyat alıcı firmada AR'ye eşittir. TC / Q ise ortalama maliyettir." },
{ l: 1, q: "A firm maximises profit at the output where:",
  o: ["Marginal revenue equals marginal cost", "Average revenue equals average cost", "Total revenue is at its maximum", "Marginal cost is at its minimum"],
  s: "<b>MR = MC</b>: bir birim daha satmanın getirdiği ek gelir, ek maliyete eşit. MR &gt; MC iken üretimi artırmak kârı büyütür; MR &lt; MC iken azaltmak büyütür. AR = AC noktası sadece <b>normal kâr</b> (sıfır ekonomik kâr) noktasıdır. TR'nin en yüksek olduğu nokta (MR = 0) satış geliri maksimizasyonudur." },
{ l: 1, q: "Normal profit is:",
  o: ["The minimum profit needed to keep a firm in the industry in the long run; economists count it as a cost", "Any profit above zero accounting profit", "Profit above the industry average", "The profit made when price is above average cost"],
  s: "<b>Normal profit</b>: sahibin emeğinin ve sermayesinin fırsat maliyetini karşılayacak, firmayı uzun dönemde sektörde tutmaya yetecek en düşük kâr. Ekonomistler bunu <b>maliyetin bir parçası</b> sayar (AC'nin içinde). Bu yüzden P = AC iken firma normal kâr eder. P &gt; AC iken elde edilen fazlaya <b>supernormal profit</b> denir." },
{ l: 2, q: "A firm is a price taker and the market price is £5. What is its marginal revenue?",
  o: ["£5 at every level of output", "Less than £5 and falling as output rises", "Zero", "It depends on the firm's costs"],
  s: "Fiyat alıcı firma (tam rekabet) piyasa fiyatından istediği kadar satabilir. Her ek birim tam <b>£5</b> getirir ve diğer birimlerin fiyatını düşürmez. Bu yüzden <b>P = AR = MR = £5</b>; talep eğrisi yatay, TR orijinden çıkan düz bir çizgidir. Aşağı eğimli talep eğrisinde ise MR, fiyatın altında kalır." },
{ l: 2, q: "A firm faces a downward-sloping demand curve. In the price range where demand is price ELASTIC, marginal revenue is:",
  o: ["Positive, so total revenue rises as output rises", "Negative, so total revenue falls as output rises", "Zero", "Equal to price"],
  s: "Esnek talepte fiyatı biraz düşürünce satışlar oransal olarak <b>daha çok</b> artar, toplam gelir <b>artar</b> → ek birimden gelen gelir (MR) <b>pozitiftir</b>. Esnek olmayan talepte fiyat düşüşü TR'yi azaltır → MR <b>negatiftir</b>. Birim esnek noktada MR = 0 ve TR en yüksektir. Aşağı eğimli talepte MR her zaman fiyatın altındadır." },
{ l: 2, q: "In the short run, a firm should shut down if:",
  o: ["Price is below average variable cost", "Price is below average total cost", "It is making any loss", "Marginal cost is rising"],
  s: "Kısa dönemde firma kapansa bile <b>sabit maliyetleri</b> (kira gibi) ödemek zorundadır. Bu yüzden üretip üretmemeye bakarken önemli olan, en azından <b>değişken maliyetleri</b> karşılayıp karşılamadığıdır.<br>• P ≥ AVC: üretmeye devam et; değişken maliyeti karşılar ve sabit maliyetin bir kısmına da katkı yapar (zarar, kapanmaktan küçük).<br>• <b>P &lt; AVC</b>: kapan; üretmek zararı büyütür.<br>Uzun dönemde ise P &lt; LRAC (normal kâr yok) ise firma sektörden çıkar." },
{ l: 3, q: "A firm's prices (AR) for outputs 1 to 5 are £10, £9, £8, £7, £6. Its total costs are £6, £10, £15, £22, £32. What is the profit-maximising output and the profit at that output?",
  o: ["3 units, profit £9", "4 units, profit £6", "5 units, profit £30", "2 units, profit £8"],
  s: "TR = P × Q: 10, 18, 24, 28, 30.<br>Kâr = TR − TC: 10 − 6 = 4; 18 − 10 = 8; 24 − 15 = <b>9</b>; 28 − 22 = 6; 30 − 32 = −2.<br>En yüksek kâr <b>3 birimde £9</b>.<br>Marjinal yöntemle kontrol: 3. birim MR = 24 − 18 = 6, MC = 15 − 10 = 5 → MR &gt; MC, üret. 4. birim MR = 4, MC = 7 → MR &lt; MC, üretme. £30, 5 birimdeki toplam gelirdir (TR'yi en büyük yapmak kârı en büyük yapmaz)." },
{ l: 3, q: "At its best output, a firm's price is £6, its average variable cost is £5 and its average total cost is £8. What should it do?",
  o: ["Keep producing in the short run, because it covers variable costs and part of fixed costs; leave the industry in the long run if this continues", "Shut down immediately, because it is making a loss", "Keep producing for ever, because price is above average variable cost", "Raise its price to £8, because it is a price taker"],
  s: "Birim başına: fiyat £6, AVC £5, AC £8 → birim başına £2 <b>zarar</b> (AFC = 8 − 5 = £3).<br>• Üretirse: her birimden £1 sabit maliyete katkı → birim başına zarar £2.<br>• Kapanırsa: tüm sabit maliyeti (£3/birim kadar) yine öder → zarar daha büyük.<br>Kısa dönemde <b>P &gt; AVC</b> olduğu için üretmeye devam eder. Uzun dönemde sabit maliyetler de değişkenleşir; fiyat LRAC'ın altında kalırsa sektörden <b>çıkar</b>. Fiyat alıcı olduğu için fiyatı kendisi yükseltemez." },
{ l: 3, q: "A firm sells 100 units at £12 each. Its average cost (which includes normal profit) is £9. Which statement is correct?",
  o: ["It makes supernormal profit of £300 in addition to normal profit", "It makes total profit of only £300, which is below normal profit", "It makes supernormal profit of £1,200", "It makes no supernormal profit, because normal profit is included in costs"],
  s: "Toplam kâr formülü: <b>(AR − AC) × Q</b> = (£12 − £9) × 100 = <b>£300</b>.<br>Ekonomistler normal kârı AC'nin <b>içinde</b> saydığı için bu £300, normal kârın <b>üstündeki</b> kârdır: <b>supernormal profit</b>. Yani firma hem normal kârı hem de £300 fazlasını kazanıyor. £1,200 toplam gelirdir. Tam rekabette bu aşırı kâr uzun dönemde yeni firmaları çeker." },
];

Q.t22 = [
{ l: 1, q: "Which of the following is an assumption of perfect competition?",
  o: ["Firms produce a homogeneous (identical) product", "There are a few large firms", "There are high barriers to entry", "Each firm can set its own price"],
  s: "Tam rekabetin dört varsayımı: (1) <b>çok sayıda</b> firma, (2) giriş ve çıkış <b>tamamen serbest</b>, (3) <b>homojen</b> (aynı) ürün, (4) üretici ve tüketicilerde <b>tam bilgi</b>. Ürünler aynı olduğu için hiçbir firma fiyatını piyasanın üstüne çıkaramaz; hepsi <b>price taker</b>'dır. Az sayıda büyük firma ve giriş engelleri oligopol ya da tekel özellikleridir." },
{ l: 1, q: "The demand curve facing an individual firm in perfect competition is:",
  o: ["Horizontal at the market price", "Downward sloping like the industry demand curve", "Vertical", "Upward sloping"],
  s: "Endüstrinin talep eğrisi aşağı eğimlidir. Ama tek firma piyasaya göre <b>çok küçüktür</b>: piyasa fiyatından istediği kadar satabilir (üretimi piyasa fiyatını etkilemez); fiyatı biraz artırırsa hiç satamaz, çünkü ürünler aynıdır ve tüketiciler her şeyi bilir. Bu yüzden firmanın talep eğrisi piyasa fiyatında <b>yataydır</b>: P = AR = MR." },
{ l: 1, q: "In perfect competition, what happens to supernormal profits in the long run?",
  o: ["They are competed away as new firms enter the industry", "They persist because of barriers to entry", "They grow as firms become larger", "The government taxes them away"],
  s: "Aşırı kâr, giriş serbest olduğu için <b>yeni firmaları</b> çeker. Girişle endüstri arzı sağa kayar, piyasa fiyatı düşer. Fiyat, firmaların en düşük uzun dönem ortalama maliyetine (LRAC) inene kadar giriş sürer. Sonuçta sadece <b>normal kâr</b> kalır. Kalıcı aşırı kâr, giriş engelleri olan tekelin özelliğidir." },
{ l: 2, q: "A perfectly competitive firm faces a market price of £14. To maximise profit in the short run it will produce where:",
  o: ["Marginal cost equals £14", "Average cost equals £14", "Average cost is at its minimum", "Total revenue is at its maximum"],
  s: "Kâr maksimizasyonu kuralı MR = MC'dir. Fiyat alıcı firmada MR = P olduğu için kural <b>P = MC</b>'ye dönüşür: firma, MC'nin £14'e eşit olduğu miktarı üretir. AC = £14 olan nokta sadece normal kâr noktasıdır. Fiyat alıcı firmada TR'nin en yüksek noktası yoktur (TR durmadan artar)." },
{ l: 2, q: "A perfectly competitive firm's short-run supply curve is:",
  o: ["Its marginal cost curve above the average variable cost curve", "Its average cost curve", "Its whole marginal cost curve, including the part below AVC", "A horizontal line at the market price"],
  s: "Firma her fiyatta <b>P = MC</b> olan miktarı üretir, bu yüzden 'fiyat → miktar' ilişkisini MC eğrisi verir. Ama fiyat <b>AVC'nin altına</b> düşerse firma kısa dönemde kapanır (değişken maliyetleri karşılayamaz). Bu yüzden arz eğrisi, MC eğrisinin <b>AVC'nin en düşük noktasının üstündeki</b> kısmıdır. Yatay çizgi firmanın talep eğrisidir, arz eğrisi değil." },
{ l: 2, q: "The five largest firms in an industry account for 80% of total sales. This figure is the:",
  o: ["Five-firm concentration ratio", "Market share of the largest firm", "Herfindahl index of competition", "Minimum efficient scale"],
  s: "<b>Concentration ratio</b> (Box 6.1): en büyük n firmanın sektör satışları (ya da istihdamı) içindeki payı. Burada <b>5-firm concentration ratio = %80</b>. Oran yüksekse sektör yoğunlaşmış, büyük ihtimalle oligopoldür. Dezavantajı: bu firmaların ayrı ayrı büyüklüğünü (biri %70 mi, beşi %16'şar mı) göstermez." },
{ l: 3, q: "A perfectly competitive firm faces a price of £14. Its total costs for outputs 0 to 6 are £10, £18, £24, £32, £44, £60, £80. What is its profit-maximising output and its supernormal profit?",
  o: ["4 units, £12", "5 units, £10", "6 units, £4", "3 units, £10"],
  s: "MC = TC'deki artış: 1. birim 8, 2. birim 6, 3. birim 8, 4. birim <b>12</b>, 5. birim <b>16</b>, 6. birim 20.<br>Kural P = MC: MC ≤ £14 olduğu sürece üret → 4. birim (MC 12) üretilir, 5. birim (MC 16 &gt; 14) üretilmez → <b>Q = 4</b>.<br>Kâr = TR − TC = (14 × 4) − 44 = 56 − 44 = <b>£12</b>. (AC = 44/4 = 11; (14 − 11) × 4 = 12 ✓)<br>Kontrol: 5 birimde kâr = 70 − 60 = 10, 3 birimde 42 − 32 = 10; ikisi de daha az. Tam rekabetin uzun döneminde bu aşırı kâr girişlerle yok olur." },
{ l: 3, q: "Firms in a perfectly competitive industry are making supernormal profits. Which sequence correctly describes the move to long-run equilibrium?",
  o: ["New firms enter, industry supply shifts right, price falls until it equals minimum long-run average cost", "Existing firms raise prices, demand falls, and price settles above average cost", "Firms leave the industry, supply shifts left, and price rises", "Nothing changes, because each firm is a price taker"],
  s: "Aşırı kâr → serbest giriş → endüstri arz eğrisi <b>sağa</b> kayar → piyasa fiyatı <b>düşer</b> → her firmanın yatay talep eğrisi aşağı iner → kâr azalır. Bu süreç fiyat <b>LRAC'ın en düşük noktasına</b> eşitlenene kadar sürer. Uzun dönem dengesi: <b>P = MC = LRAC (min)</b>, sadece normal kâr. Firmalar fiyat alıcı olduğu için fiyatı kendileri yükseltemez; çıkış ise zarar varken olur." },
{ l: 3, q: "Which is a criticism of perfect competition, even though it produces where P = MC?",
  o: ["Firms may lack the funds and the incentive to invest in research and development, and there is little product variety", "Firms make large supernormal profits in the long run", "Prices are higher than under monopoly", "Firms produce above minimum average cost"],
  s: "Box 6.2 (Tam rekabet en iyisi mi?): <b>Artıları</b>: P = MC (kaynak dağılımı etkin), uzun dönemde en düşük maliyette üretim, düşük fiyat, verimlilik baskısı.<br><b>Eksileri</b>: aşırı kâr olmadığı için <b>AR-GE yapacak para</b> yoktur; yenilik yapılsa bile rakipler hemen kopyalar (tam bilgi), bu yüzden <b>teşvik</b> de yoktur. Ürünler homojen olduğu için <b>çeşitlilik</b> yoktur. Adil gelir dağılımı ve zararlı yan etkilerin (kirlilik) olmayacağı da garanti değildir. Diğer seçenekler tam rekabet için doğru değildir." },
];

Q.t23 = [
{ l: 1, q: "Which of the following is a barrier to entry that can protect a monopoly?",
  o: ["A patent on a new drug", "A large number of small competitors", "Perfect knowledge among consumers", "Low set-up costs"],
  s: "Tekelin aşırı kârını uzun dönemde koruyabilmesi için <b>giriş engelleri</b> gerekir: ölçek ekonomileri (doğal tekel), ürün farklılaştırma ve marka sadakati, girdi kaynaklarının ya da satış noktalarının kontrolü, <b>patent ve telif hakkı</b>, yasal koruma, rakipleri ezme taktikleri. Patent, yeni ilacı belli süre sadece o firmanın üretmesini yasal olarak garanti eder. Diğer seçenekler girişi kolaylaştırır." },
{ l: 1, q: "A natural monopoly exists when:",
  o: ["Long-run average costs keep falling up to an output large enough to supply the whole market, so one firm can supply it more cheaply than two or more", "The government owns the only firm", "The firm controls a natural resource such as oil", "Demand for the product is perfectly inelastic"],
  s: "<b>Natural monopoly</b>: ölçek ekonomileri o kadar büyük ki LRAC, piyasanın tamamını karşılayan çıktıya kadar düşmeye devam eder. Tek firma piyasayı en düşük maliyetle karşılar; iki firma olsa ikisi de daha küçük ölçekte, daha yüksek maliyetle çalışırdı. Örnekler: su ve doğalgaz şebekesi, elektrik iletim hattı, demiryolu altyapısı (iki paralel şebeke israf olurdu). Devlet mülkiyeti şart değildir." },
{ l: 1, q: "A profit-maximising monopolist chooses its output where:",
  o: ["MR = MC, and charges the price given by the demand curve at that output", "P = MC", "AR = AC", "Demand is perfectly inelastic"],
  s: "Tekel de MR = MC kuralını uygular. Miktarı bulduktan sonra fiyatı <b>talep (AR) eğrisinden</b> okur: tüketicilerin o miktar için ödemeye razı olduğu en yüksek fiyat. Tekelde talep eğrisi aşağı eğimli olduğu için MR &lt; P'dir ve sonuçta <b>P &gt; MC</b> olur. P = MC tam rekabetin kuralıdır." },
{ l: 2, q: "Why is a monopolist's marginal revenue below its price?",
  o: ["To sell an extra unit it must lower the price, not only on that unit but on all the units it sells", "Because its costs are higher than a competitive firm's", "Because the government taxes each extra unit", "Because demand is horizontal"],
  s: "Tekel tüm piyasanın talep eğrisiyle karşı karşıyadır (aşağı eğimli). Bir birim daha satmak için fiyatı düşürmek zorundadır, ve bu düşük fiyat <b>tüm birimlerde</b> geçerlidir (tek fiyat). Ek birimin getirdiği gelir = yeni fiyat − önceki birimlerde kaybedilen gelir. Örnek: 10 birimi £10'dan (TR 100) ya da 11 birimi £9.50'den (TR 104.5) satabiliyorsa, 11. birimin MR'si £4.50'dir, fiyatı £9.50 olduğu halde." },
{ l: 2, q: "Why can a monopolist continue to make supernormal profits in the long run?",
  o: ["Barriers to entry prevent new firms from entering and competing the profits away", "Because it always produces at minimum average cost", "Because its demand curve is horizontal", "Because it is a price taker"],
  s: "Tam rekabette aşırı kâr yeni girişlerle yok olur. Tekelde ise <b>giriş engelleri</b> (patent, ölçek ekonomisi, kaynak kontrolü...) yeni firmaların girmesini engeller. Bu yüzden aşırı kâr <b>uzun dönemde de sürebilir</b>. Engeller düşükse (yarışılabilir piyasa, konu 6.4) tekel bile kârını normal düzeyde tutmak zorunda kalabilir." },
{ l: 2, q: "Which of the following is an argument IN FAVOUR of monopoly?",
  o: ["Its supernormal profits can finance research and development, leading to new and better products", "It charges a higher price relative to cost than competitive firms", "It may suffer from X inefficiency", "It can exert political pressure on governments"],
  s: "Kitap tekelin <b>lehine</b> iki argüman verir: (1) <b>ölçek ekonomileri</b>nin bir kısmı düşük fiyatla tüketiciye geçebilir; (2) yüksek kârlar <b>AR-GE ve yatırıma</b> harcanabilir, daha iyi ve belki daha ucuz ürünler gelir (ilaç sektörü örneği). Diğer üç seçenek tekelin <b>aleyhine</b> olan argümanlardır: yüksek fiyat, X verimsizliği (rekabet baskısı olmadığı için maliyetleri kontrol etmemek), siyasi baskı." },
{ l: 3, q: "A monopolist faces demand P = 100 − 2Q, so MR = 100 − 4Q. Its marginal cost and average cost are constant at £20. What are its profit-maximising price, output and profit?",
  o: ["Q = 20, P = £60, profit = £800", "Q = 40, P = £20, profit = £0", "Q = 25, P = £50, profit = £750", "Q = 20, P = £20, profit = £400"],
  s: "Kural MR = MC: 100 − 4Q = 20 → 4Q = 80 → <b>Q = 20</b>.<br>Fiyat talep eğrisinden: P = 100 − 2(20) = <b>£60</b>.<br>Kâr = (P − AC) × Q = (60 − 20) × 20 = <b>£800</b>.<br>Karşılaştırma: tam rekabette P = MC = 20 → 100 − 2Q = 20 → Q = 40. Tekel <b>yarı miktarı</b> üç kat fiyata satıyor. Q = 25, P = 50 ise MR = 0 noktasıdır (satış geliri maksimizasyonu, Bölüm 8)." },
{ l: 3, q: "Why will a profit-maximising monopolist (with positive marginal cost) always produce on the price-ELASTIC part of its demand curve?",
  o: ["Because MR = MC and MC is positive, so MR must be positive, and MR is positive only where demand is elastic", "Because demand is always elastic for monopolies", "Because it wants to maximise total revenue", "Because inelastic demand would make its price fall"],
  s: "Kâr maksimumunda MR = MC. Üretmenin maliyeti pozitif (MC &gt; 0) ise MR de <b>pozitif</b> olmalıdır. Bölüm 5.5'ten: MR, sadece talebin <b>esnek</b> olduğu kısımda pozitiftir (esnek olmayan kısımda fiyat düşüşü TR'yi azaltır → MR negatif). Sezgi: talep esnek değilse tekel fiyatı artırarak hem <b>daha çok gelir</b> elde eder hem <b>daha az üretip</b> maliyetten tasarruf eder, yani orada durmaz." },
{ l: 3, q: "Under what circumstances could a monopoly charge a LOWER price than a perfectly competitive industry would?",
  o: ["If its economies of scale make its marginal cost much lower than the costs of many small competitive firms", "Never: a monopoly always charges a higher price", "If its demand is perfectly inelastic", "If it suffers from X inefficiency"],
  s: "Standart karşılaştırma iki yapının <b>aynı maliyet eğrilerine</b> sahip olduğunu varsayar; o zaman tekel daha yüksek fiyat koyar. Ama tek büyük firma <b>ölçek ekonomileri</b> sayesinde çok daha düşük maliyetle üretebilir. MC'si yeterince düşükse, MR = MC'de belirlediği fiyat, küçük ve yüksek maliyetli firmalardan oluşan bir rekabetçi piyasanın fiyatından bile <b>düşük</b> olabilir (doğal tekel durumu). X verimsizliği tam tersine maliyeti yükseltir; esnek olmayan talepte tekel daha da yüksek fiyat koyar." },
];

Q.t24 = [
{ l: 1, q: "A market is perfectly contestable when:",
  o: ["Entry and exit by potential rivals are costless and can happen rapidly", "There is only one firm in the market", "There are many firms selling identical products", "The government sets the price"],
  s: "<b>Perfectly contestable market</b>: potansiyel rakipler piyasaya <b>maliyetsiz ve hızlı</b> girip çıkabilir. Böyle bir piyasada firma sayısı önemli değildir; tek firma olsa bile yeni giriş tehdidi onu rekabetçi davranmaya zorlar. Çok sayıda firma ve homojen ürün tam rekabetin tanımıdır." },
{ l: 1, q: "The theory of contestable markets argues that what matters most in determining a firm's price and output is:",
  o: ["The threat of potential competition", "The number of firms currently in the industry", "The firm's marginal cost only", "The size of the firm's advertising budget"],
  s: "Teori şunu söyler: bir piyasanın tekel mi yoksa rekabetçi mi olduğu değil, <b>gerçek bir rekabet tehdidinin</b> olup olmadığı belirleyicidir. Potansiyel rekabet, gerçek rekabet kadar etkili olabilir. Bu yüzden kitaba göre teori, sadece mevcut firma sayısına bakan teorilerden <b>daha gerçekçidir</b>." },
{ l: 1, q: "Sunk costs are:",
  o: ["Costs that cannot be recovered when a firm leaves the industry", "Costs that fall as output rises", "The costs of raw materials", "Costs paid by consumers"],
  s: "<b>Sunk costs</b> (batık maliyetler): piyasadan çıkarken <b>geri alınamayan</b> maliyetler: reklam harcaması, sadece o işe yarayan özel makine, marka oluşturma. Kitaba göre <b>çıkış maliyeti</b> batık maliyetlere bağlıdır: batık maliyet ne kadar düşükse çıkmak o kadar kolay, girmek o kadar az risklidir ve piyasa o kadar <b>yarışılabilir</b>dir." },
{ l: 2, q: "In a perfectly contestable market, an existing monopolist is likely to:",
  o: ["Keep its profits down to the normal level to discourage entry", "Make large supernormal profits indefinitely", "Charge the highest price consumers will pay", "Produce nothing"],
  s: "Tekel aşırı kâr ederse, yeni firmalar hemen girip fiyatı biraz kırarak o kârın bir kısmını alır ('vur-kaç' girişi), kâr düşünce maliyetsiz çıkar. Bunu bilen tekel, girişi caydırmak için fiyatını düşük tutar ve sadece <b>normal kâr</b> eder. Yani tek firma olsa bile <b>rekabetçi</b> gibi davranır." },
{ l: 2, q: "Why did airline deregulation in the USA and Europe make many air routes quite contestable?",
  o: ["Aircraft can be leased and moved to other routes, so sunk costs of entering or leaving a route are low", "Because airlines have very high fixed costs", "Because each route has only one airline", "Because governments still set all fares"],
  s: "Box 6.6: bir havayolu yeni bir hatta girmek için uçak almak zorunda değildir, <b>kiralayabilir</b> ya da başka hattan <b>kaydırabilir</b>. Hat kârsız olursa uçağı başka hatta kullanır: <b>batık maliyet düşüktür</b>. Bu yüzden kârlı hatlara hızla yeni firmalar girdi (özellikle düşük maliyetli havayolları) ve fiyatlar düştü. Ancak havalimanı slotları gibi engeller bazı hatları daha az yarışılabilir bıraktı." },
{ l: 2, q: "A monopolist deliberately keeps its price low enough to make entry unprofitable for potential rivals. This is called:",
  o: ["Limit pricing", "Price discrimination", "Mark-up pricing", "Peak-load pricing"],
  s: "<b>Limit pricing</b>: tekel (ya da oligopol), fiyatı kısa dönem kâr maksimize eden düzeyin <b>altında</b>, yeni bir rakibin girerse kâr edemeyeceği bir düzeyde tutar. Böylece bugünkü kârın bir kısmından vazgeçerek uzun dönemde konumunu korur. Bu, potansiyel rekabetin tekelin davranışını nasıl etkilediğinin bir örneğidir." },
{ l: 3, q: "Which of the following markets is likely to be LEAST contestable?",
  o: ["Running a national railway track network", "Running a coach (bus) service between two cities", "Operating a market stall selling vegetables", "Running an airline route using leased aircraft"],
  s: "Yarışılabilirliği belirleyen giriş ve özellikle <b>batık maliyetlerdir</b>. Demiryolu hattı inşa etmek dev bir yatırımdır ve başka bir işe kullanılamaz: çıkarken neredeyse tamamı <b>batık</b> kalır. Bu yüzden potansiyel rakipler girmeye cesaret edemez → en az yarışılabilir piyasa. Otobüs, pazar tezgâhı ve kiralık uçakla havayolu hattı düşük batık maliyetlidir: araçlar başka yerde kullanılabilir ya da satılabilir." },
{ l: 3, q: "'Hit-and-run' entry means that a firm enters a market when profits are high and leaves when they fall. What condition is most important for this to be possible?",
  o: ["Low exit costs, which depend on low sunk costs", "High barriers to entry", "A large number of existing firms", "Perfectly inelastic demand"],
  s: "Vur-kaç girişi ancak firma, kâr bittiğinde <b>zarar etmeden çıkabiliyorsa</b> mantıklıdır. Bu da çıkış maliyetinin, yani <b>batık maliyetin</b> düşük olmasını gerektirir. Batık maliyet yüksekse giren firma çıkarken büyük kayıp yaşar ve bu risk girişi caydırır. Giriş engelleri vur-kaçı imkânsız kılar; mevcut firma sayısı ve talebin esnekliği ise belirleyici değildir." },
{ l: 3, q: "A factory gives one catering company the contract to run its staff canteen. The caterer is the only supplier of meals to the workers. Why may it still charge reasonable prices and give good service?",
  o: ["Because the factory could replace it with another catering company: the threat of competition disciplines it", "Because it is a natural monopoly", "Because the workers have perfectly inelastic demand", "Because sunk costs in catering are very high"],
  s: "Kitaptaki örnek: yemek şirketi o fabrikada <b>tekeldir</b>. Ama yüksek fiyat koyar ya da kötü hizmet verirse fabrika sözleşmeyi <b>başka bir şirkete</b> verebilir. Bu tehdit (<b>potansiyel rekabet</b>), gerçek rekabet gibi etki eder ve şirketi makul fiyata ve iyi hizmete zorlar. Politika sonucu: devlet tekeli parçalamak yerine, tekelin yerine geçmeyi kolaylaştırarak (ihale, giriş engellerini kaldırma) rekabet sağlayabilir." },
];

Q.t25 = [
{ l: 1, q: "Monopolistic competition is characterised by:",
  o: ["Many firms, free entry and differentiated products", "A few firms and high barriers to entry", "One firm and no close substitutes", "Many firms selling identical products"],
  s: "<b>Monopolistic competition</b> (tekelci rekabet): oldukça çok sayıda firma, birbirinden bağımsız çalışır, giriş <b>serbesttir</b>, ama her firma <b>farklılaştırılmış</b> bir ürün sattığı için biraz piyasa gücüne sahiptir (aşağı eğimli talep). 'Tekelci' kısmı farklılaştırmadan, 'rekabet' kısmı çok firma ve serbest girişten gelir. Aynı ürün tam rekabettir; az firma ve engeller oligopoldür." },
{ l: 1, q: "Which of the following is the best example of monopolistic competition?",
  o: ["Restaurants in a large town", "Water supply in a city", "Car manufacturing in Europe", "Wheat farming"],
  s: "Bir şehirde çok sayıda restoran vardır, açmak görece kolaydır (serbest giriş), ama her birinin menüsü, yeri, atmosferi farklıdır (<b>farklılaştırma</b>): fiyatını biraz artırsa da bazı müşterilerini korur. Su şebekesi doğal tekel, Avrupa'da araba üretimi oligopol (az sayıda büyük firma), buğday tarımı tam rekabete yakındır." },
{ l: 1, q: "In the long run under monopolistic competition, firms make:",
  o: ["Normal profits", "Supernormal profits protected by barriers to entry", "Losses", "Profits equal to a monopoly"],
  s: "Giriş serbest olduğu için aşırı kâr <b>yeni firmaları</b> çeker. Yeni firmalar müşterilerin bir kısmını alır; her firmanın talep eğrisi sola kayar, kâr <b>normal düzeye</b> iner. Tam rekabete benzer şekilde uzun dönemde sadece normal kâr kalır. Kalıcı aşırı kâr giriş engelleri gerektirir (tekel, oligopol)." },
{ l: 2, q: "In long-run equilibrium under monopolistic competition, the firm's demand (AR) curve is:",
  o: ["Tangential to its long-run average cost curve", "Horizontal at minimum average cost", "Above its average cost curve at every output", "Vertical"],
  s: "Uzun dönemde P = AC olmalıdır (normal kâr). Aynı zamanda firma MR = MC'de üretir. Bu iki koşul ancak aşağı eğimli talep eğrisinin LRAC eğrisine <b>teğet</b> olduğu noktada birlikte sağlanır: talep eğrisi AC'ye değer ama altına düşmez. Yatay talep tam rekabetindir." },
{ l: 2, q: "Long-run equilibrium under monopolistic competition is said to involve 'excess capacity'. This means that:",
  o: ["Firms produce less than the output at which their average cost would be lowest", "Firms produce more than consumers want", "Firms have more workers than they need", "Firms make supernormal profits"],
  s: "Talep eğrisi aşağı eğimli olduğu için LRAC'a teğet olduğu nokta, LRAC'ın <b>en düşük noktasının solunda</b> kalır. Yani firma, ortalama maliyetini en aza indirecek miktardan <b>daha az</b> üretir: daha çok üretse birim maliyeti düşerdi. Bu boşluğa <b>excess capacity</b> (atıl kapasite) denir (bir kasabada yarı boş çalışan çok sayıda benzin istasyonu ya da kuaför gibi)." },
{ l: 2, q: "Which of the following is an example of non-price competition?",
  o: ["Advertising and developing new versions of a product", "Cutting the price below rivals", "Matching a rival's price cut", "Selling at the market price"],
  s: "<b>Non-price competition</b> (fiyat dışı rekabet): firmaların fiyat dışında müşteri çekme yolları: <b>product development</b> (ürün geliştirme: yeni tasarım, kalite, ek hizmet) ve <b>product promotion</b> (ürün tanıtımı: reklam, marka, ambalaj). Amaç, talebi artırmak ve daha az esnek hale getirmek (marka sadakati), böylece aşırı kârı uzun dönemde de koruyabilmektir. Diğer seçenekler fiyat rekabetidir." },
{ l: 3, q: "Compared with perfect competition, which statement about monopolistic competition is correct?",
  o: ["Costs may be higher because of excess capacity, but consumers gain from a greater variety of products", "Prices are always lower because firms advertise", "Firms produce at minimum average cost in the long run", "There is no difference in the long run"],
  s: "Kitabın özeti (7.1, madde 6): tekelci rekabette firmalar atıl kapasiteyle çalıştığı için <b>birim maliyetler ve fiyatlar</b> tam rekabete göre daha <b>yüksek</b> olabilir (reklam maliyeti de eklenir). Karşılığında tüketiciler <b>çeşitlilik</b> kazanır: farklı restoranlar, farklı tasarımlar. Bu bir değiş tokuştur. Tam rekabette uzun dönemde firma LRAC'ın en düşük noktasında üretir; tekelci rekabette üretmez." },
{ l: 3, q: "A town's hairdressers are making supernormal profits. Describe what happens in the long run under monopolistic competition.",
  o: ["New salons open; each existing salon's demand curve shifts left (and becomes more elastic) until it just touches its average cost curve and only normal profit remains", "Prices rise further as salons gain monopoly power", "Salons leave the market because profits are too high", "The demand curve of each salon becomes horizontal"],
  s: "Serbest giriş: aşırı kâr → <b>yeni kuaförler açılır</b>. Müşteriler artık daha çok seçenek arasında dağılır: her kuaförün talep eğrisi <b>sola kayar</b>, ve yakın ikame arttığı için <b>daha esnek</b> hale gelir. Süreç, talep eğrisi AC eğrisine <b>teğet</b> olana (P = AC) kadar sürer: sadece normal kâr kalır. Talep tamamen yatay olmaz, çünkü her kuaförün yeri ve tarzı hâlâ biraz farklıdır." },
{ l: 3, q: "Why might supernormal profits persist in the long run under monopolistic competition in practice?",
  o: ["Firms have imperfect information, entry may not be completely free (e.g. good locations are limited), and firms use non-price competition such as brand loyalty", "Because the theory assumes high barriers to entry", "Because demand curves are horizontal", "Because firms collude in a cartel"],
  s: "Kitabın özeti (7.1, madde 4): teori uzun dönemde normal kâr öngörür ama gerçekte aşırı kâr sürebilir:<br>• <b>Eksik bilgi</b>: yeni girenler kimin ne kadar kâr ettiğini bilmeyebilir.<br>• Giriş <b>tamamen serbest değildir</b>: en iyi yerler (şehir merkezi) sınırlıdır, izin ve ruhsat gerekebilir.<br>• <b>Fiyat dışı rekabet</b>: reklam ve ürün geliştirme ile marka sadakati yaratılır, rakipler bunu kolayca kopyalayamaz.<br>Kartel oligopole özgüdür; çok sayıda firmanın işbirliği yapması zordur." },
];

Q.t26 = [
{ l: 1, q: "Which pair of features best distinguishes oligopoly from other market structures?",
  o: ["Barriers to entry and interdependence between firms", "Free entry and identical products", "A single firm and no substitutes", "Many firms and perfect information"],
  s: "Kitaba göre oligopolün iki temel özelliği: (1) <b>giriş engelleri</b> (tekeldekilere benzer, büyüklüğü sektöre göre değişir) ve (2) <b>interdependence</b> (karşılıklı bağımlılık): firma az sayıda olduğu için her firmanın kararı (fiyat, reklam, yeni ürün) rakiplerini doğrudan etkiler ve rakiplerin tepkisini hesaba katmak zorundadır." },
{ l: 1, q: "A formal collusive agreement between firms to restrict output and raise prices is called a:",
  o: ["Cartel", "Merger", "Price war", "Monopsony"],
  s: "<b>Cartel</b> (kartel): firmaların resmî olarak işbirliği yaptığı anlaşma. Amaç birlikte <b>tekel gibi</b> davranmaktır: toplam üretimi kısıp fiyatı yükseltmek. Kartel ya fiyatı belirleyip üyeleri pay için yarıştırır ya da her üyeye <b>kota</b> verir. Çoğu ülkede şirketler arası kartel yasadışıdır. Birleşme (merger) iki firmanın tek firma olmasıdır." },
{ l: 1, q: "OPEC, an organisation of oil-exporting countries that sets production quotas for its members, is an example of:",
  o: ["A cartel", "Perfect competition", "Monopolistic competition", "A natural monopoly"],
  s: "<b>OPEC</b> (Box 7.3), petrol ihraç eden ülkelerin üretim <b>kotaları</b> belirleyerek dünya petrol fiyatını etkilemeye çalıştığı bir karteldir. 1970'lerde fiyatları birkaç kat artırdı. Ancak üyeler kotalarını sık sık aştı ve OPEC dışı üreticiler (Rusya, ABD kaya petrolü) payını artırdı; bu da kartelin gücünü sınırladı. Hükümetlerden oluştuğu için ulusal rekabet yasaları ona uygulanamaz: IR açısından önemli bir örnektir." },
{ l: 2, q: "Why are members of a cartel often tempted to cheat on the agreement?",
  o: ["Each member can increase its own profit by secretly cutting its price or exceeding its quota, if the others keep to the agreement", "Because the cartel price is below marginal cost", "Because cheating reduces their own profits", "Because the law requires them to compete"],
  s: "Kartel fiyatı yüksek tutar. Bu fiyatta tek bir üye için bir birim daha satmanın ek geliri (fiyat) ek maliyetinden çok büyüktür. Diğerleri anlaşmaya uyarken gizlice <b>biraz daha ucuza satarsa</b> ya da kotayı aşarsa o üye çok kazanır. Ama herkes aynı şeyi yaparsa toplam arz artar, fiyat düşer ve bir <b>fiyat savaşı</b> çıkabilir. Bu çelişki, ortak kâr ile bireysel kâr arasındaki gerilimdir (oyun teorisindeki mahkûmlar ikilemi)." },
{ l: 2, q: "In an industry, a large dominant firm announces price changes and the other firms follow without any formal agreement. This is:",
  o: ["Tacit collusion through price leadership", "A formal cartel", "A price war", "Price discrimination"],
  s: "<b>Tacit collusion</b> (örtülü işbirliği): resmî anlaşma olmadan firmaların uyumlu davranması. En yaygın biçimi <b>price leadership</b> (fiyat liderliği): ya <b>baskın firma</b> fiyatı belirler ve diğerleri izler, ya da piyasa koşullarını iyi okuduğu düşünülen bir <b>barometre firma</b> önce davranır. Diğer biçimleri: ortalama maliyet fiyatlaması ve benchmark (ör. £9.99 gibi standart fiyatlar) kuralları. Yazılı anlaşma olmadığı için yasal açıdan kanıtlamak zordur." },
{ l: 2, q: "Collusion between oligopolists is MORE likely when:",
  o: ["There are only a few firms with similar products and costs, and the market is stable", "There are many firms with very different costs", "Demand is changing rapidly and unpredictably", "There are no barriers to entry"],
  s: "Kitaba göre işbirliği daha olasıdır eğer: firma sayısı <b>azsa</b>; birbirlerine karşı açıklarsa; ürünleri ve <b>maliyet yapıları benzerse</b> (ortak fiyatta anlaşmak kolay); baskın bir firma varsa; giriş engelleri yüksekse (yeni girenler anlaşmayı bozamaz); piyasa <b>istikrarlıysa</b>; ve işbirliğini yasaklayan bir yasa yoksa. Diğer seçeneklerin hepsi işbirliğini zorlaştırır." },
{ l: 3, q: "The kinked demand curve model predicts that oligopoly prices will tend to be stable. Why?",
  o: ["A firm believes rivals will NOT follow a price rise (demand elastic above the current price) but WILL follow a price cut (demand inelastic below it), so changing price reduces profit", "Because governments fix oligopoly prices", "Because rivals always follow price rises", "Because marginal cost is always constant"],
  s: "Firma iki şey varsayar:<br>• Fiyatı <b>artırırsa</b> rakipler izlemez → müşterilerin çoğunu kaybeder → mevcut fiyatın üstünde talep <b>esnek</b>tir.<br>• Fiyatı <b>düşürürse</b> rakipler de düşürür (müşteri kaybetmemek için) → çok az müşteri kazanır → altında talep <b>esnek değildir</b>.<br>Her iki yönde de kaybeder, bu yüzden fiyatı değiştirmez: talep eğrisi mevcut fiyatta <b>kırılır</b>. MR eğrisinde bir boşluk oluşur, bu yüzden MC bu boşlukta değişse bile kâr maksimize eden fiyat değişmez. Zayıflığı: fiyatın başlangıçta nasıl belirlendiğini açıklamaz." },
{ l: 3, q: "In the Bertrand model of oligopoly, each firm assumes its rivals' PRICE is given. What is the likely outcome?",
  o: ["Firms keep undercutting each other until prices fall to the level where only normal profits are made", "Prices settle at the monopoly level", "Prices are between monopoly and perfect competition, as in the Cournot model", "Prices rise continuously"],
  s: "Bertrand: her firma rakibin <b>fiyatını</b> sabit varsayar. O zaman rakibin biraz altına inerek tüm müşterileri kapabileceğini düşünür. Diğeri de aynısını yapar → karşılıklı fiyat kırma, fiyat <b>sadece normal kârın</b> kaldığı düzeye (P = AC) inene kadar sürer. İki firma bile tam rekabetin sonucunu verebilir.<br><b>Cournot</b>'ta ise firma rakibin <b>miktarını</b> sabit varsayar; sonuç tekel ile tam rekabet arasında bir fiyat ve kârdır." },
{ l: 3, q: "A few large food manufacturers sell to a few very large supermarket chains. Why might this oligopoly NOT harm consumers as much as expected?",
  o: ["The supermarkets have countervailing power: as powerful buyers they can force suppliers to keep prices down", "Because the manufacturers form a cartel", "Because supermarkets are price takers", "Because there are no barriers to entry for manufacturers"],
  s: "Kitaba göre oligopolün kamu yararına olup olmadığı birkaç şeye bağlıdır; bunlardan biri <b>countervailing power</b> (karşı güç): satıcılar az ve güçlüyse ama alıcılar da az ve güçlüyse (büyük süpermarket zincirleri), alıcılar pazarlıkla fiyatları <b>aşağı</b> çekebilir. Böylece üreticilerin piyasa gücü dengelenir. Diğer faktörler: rekabetin yoğunluğu, reklamın türü, ürün çeşitliliği, AR-GE ve piyasanın <b>yarışılabilirliği</b>." },
];

Q.t27 = [
{ l: 1, q: "In game theory, a dominant strategy is one that:",
  o: ["Gives the best outcome for a player whatever the other player does", "Gives the best joint outcome for all players", "Is chosen by the largest firm", "Minimises the other player's profit"],
  s: "<b>Dominant strategy</b> (baskın strateji): rakip ne yaparsa yapsın sana <b>en iyi</b> sonucu veren strateji. Varsa, rakibin ne yapacağını tahmin etmeye gerek yoktur. Bu tür oyunlara 'dominant-strategy games' denir ve sonuçları önceden tahmin edilebilir. Ortak sonucu en iyi yapan strateji farklıdır (bkz. mahkûmlar ikilemi)." },
{ l: 1, q: "A Nash equilibrium is a situation in which:",

  s: "<b>Nash equilibrium</b>: diğer oyuncuların stratejileri veriyken, hiçbir oyuncunun <b>tek başına</b> stratejisini değiştirerek daha iyi duruma geçemediği durum. Kitaba göre işbirliği yapmayan oligopolde ulaşılan Nash dengesi genelde firmaların <b>topluca</b> en iyi çıkarına değildir: işbirliği yapsalar daha yüksek kâr elde ederlerdi." },
{ l: 1, q: "A firm that chooses the strategy whose WORST possible outcome is the least bad is following a:",

{ l: 2, q: "Two firms, A and B, choose a high or low price. Profits (A, B): both high = (10, 10); A high, B low = (5, 12); A low, B high = (12, 5); both low = (8, 8). What is the Nash equilibrium?",
  o: ["Both charge a low price: (8, 8)", "Both charge a high price: (10, 10)", "A high, B low: (5, 12)", "There is no equilibrium"],
  s: "A için: B yüksek koyarsa → A düşük (12 &gt; 10); B düşük koyarsa → A düşük (8 &gt; 5). B ne yaparsa yapsın düşük fiyat daha iyi: A'nın <b>baskın stratejisi</b> düşük fiyat. Oyun simetrik, B için de aynısı.<br>Sonuç: ikisi de düşük → <b>(8, 8)</b>. Hiçbiri tek başına değiştirmek istemez → <b>Nash dengesi</b>.<br>İronik olan: ikisi de yüksek fiyatta anlaşsaydı (10, 10) daha iyi olurlardı. Bu <b>mahkûmlar ikilemidir</b> (Box 7.4) ve kartellerin neden kurulmak istendiğini ve neden bozulduğunu açıklar." },
{ l: 2, q: "Why must a threat made by a firm in a multiple-move game be credible?",

  s: "Çok hamleli oyunlarda firmalar sadece rakiplerin <b>yaptıklarına</b> değil, <b>yapacaklarını söylediklerine</b> de tepki verir. Ama bir tehdit (ör. 'pazarıma girersen fiyatları yarıya indiririm') ancak rakip, tehdidin <b>gerçekten uygulanacağına</b> inanırsa etkilidir. Uygulamak tehdit edenin kendisine çok pahalıya mal olacaksa tehdit <b>inandırıcı değildir</b> ve rakip onu görmezden gelir. Uluslararası ilişkilerde caydırıcılık (nükleer caydırıcılık) aynı mantığa dayanır." },
{ l: 2, q: "Why can game theory be useful for analysing oligopoly?",
  o: ["Because in oligopoly the outcome for each firm depends on the choices made by its rivals (strategic interdependence)", "Because oligopolists are price takers", "Because oligopolies always collude", "Because there is only one firm"],

{ l: 3, q: "Firm X has three strategies. Its profits (£m) under the rivals' three possible responses are: Strategy 1: 10, 4, 6; Strategy 2: 12, 2, 8; Strategy 3: 7, 5, 6. Which strategy would X choose under maximin, and which under maximax?",
  o: ["Maximin: strategy 3; maximax: strategy 2", "Maximin: strategy 2; maximax: strategy 3", "Maximin: strategy 1; maximax: strategy 1", "Maximin: strategy 3; maximax: strategy 1"],
  s: "<b>Maximin</b>: her stratejinin en kötüsü → 1: 4, 2: 2, 3: <b>5</b>. En kötülerin en iyisi 5 → <b>Strateji 3</b> (temkinli firma).<br><b>Maximax</b>: her stratejinin en iyisi → 1: 10, 2: <b>12</b>, 3: 7. En iyilerin en iyisi 12 → <b>Strateji 2</b> (riski seven firma).<br>Strateji 2 en yüksek kârı verebilir ama rakip kötü tepki verirse sadece £2m kalır; strateji 3 hiçbir durumda £5m'nin altına düşmez." },
{ l: 3, q: "In a prisoners' dilemma between two oligopolists, why would both firms be better off if they could make a binding (enforceable) agreement?",
  o: ["Because the Nash equilibrium (both compete) gives each less profit than the cooperative outcome, but without enforcement each has an incentive to cheat", "Because a binding agreement lets each firm undercut the other", "Because the Nash equilibrium already maximises joint profits", "Because cooperation is always illegal"],
  s: "Mahkûmlar ikileminde her firma için rekabet etmek (düşük fiyat) <b>baskın stratejidir</b>, bu yüzden ikisi de rekabet eder ve (8, 8) gibi düşük bir sonuca ulaşır. İkisi de işbirliği yapsa (10, 10) alırdı. Sorun, işbirliğine güvenememeleri: biri yüksek fiyatta kalırken diğeri hile yaparsa hile yapan çok kazanır. <b>Bağlayıcı</b> bir anlaşma hile yapmayı imkânsız kılsaydı ikisi de daha iyi olurdu. Firmalar arasında bu tür anlaşmalar genelde yasadışıdır; uluslararası ilişkilerde ise denetimli silahsızlanma anlaşmaları bu sorunu çözmeye çalışır." },
{ l: 3, q: "Firm A moves first, choosing a Large or Small factory; then B chooses Large or Small. Profits (A, B): A Large & B Large = (5, 5); A Large & B Small = (30, 10); A Small & B Large = (10, 30); A Small & B Small = (20, 20). What will happen?",
  o: ["A builds Large, B responds Small: (30, 10)", "Both build Small: (20, 20)", "A builds Small, B builds Large: (10, 30)", "Both build Large: (5, 5)"],
  s: "Karar ağacını <b>sondan başa</b> çöz (B'nin tepkisinden başla):<br>• A Large seçerse B: Large → 5, Small → 10 → B <b>Small</b> seçer → A'ya 30.<br>• A Small seçerse B: Large → 30, Small → 20 → B <b>Large</b> seçer → A'ya 10.<br>A bunu öngörür: Large → 30, Small → 10 → <b>Large</b> seçer. Sonuç <b>(30, 10)</b>.<br>Bu, <b>first-mover advantage</b>'tır (ilk hamle avantajı): önce davranan A, B'yi kendisine uygun bir tepkiye zorlar. (20, 20) ikisi için de iyi görünse de A'nın oradan sapmak için nedeni vardır." },

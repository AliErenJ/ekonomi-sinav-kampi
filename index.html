Q.t28 = [
{ l: 1, q: "Price discrimination is:",
  o: ["Selling the same product at different prices to different consumers, even though the costs of supplying them are the same", "Charging different prices because costs are different", "Charging the same price to everyone", "Setting a price below average cost to drive out rivals"],
  s: "<b>Price discrimination</b> (fiyat farklılaştırması): <b>maliyeti aynı</b> olan aynı ürünü farklı tüketicilere farklı fiyatlardan satmak. Maliyet farklıysa (ör. uzak bölgeye taşıma maliyeti) fiyat farkı ayrımcılık sayılmaz. Rakipleri piyasadan atmak için maliyetin altında fiyat koymak farklı bir şeydir (yıkıcı fiyatlama)." },
{ l: 1, q: "Cheaper cinema tickets for students are an example of:",
  o: ["Third-degree price discrimination", "First-degree price discrimination", "Second-degree price discrimination", "Perfect competition"],
  s: "<b>Third-degree</b> (üçüncü derece): tüketiciler <b>ayrı gruplara</b> bölünür (öğrenciler, yetişkinler, emekliler) ve her gruba farklı fiyat uygulanır (Box 7.7). Öğrenci kimliği grupları ayırmayı sağlar. First-degree her kişiye ayrı fiyattır; second-degree <b>alınan miktara</b> göre farklı fiyattır." },
{ l: 1, q: "Which condition is necessary for a firm to practise price discrimination successfully?",
  o: ["Consumers who buy at the low price must not be able to resell to those charged the high price", "The firm must be a price taker", "All consumers must have the same price elasticity of demand", "The product must be sold in one single market"],
  s: "Üç koşul: (1) firmanın <b>piyasa gücü</b> olmalı (fiyat alıcı firma fiyat farklılaştıramaz); (2) piyasalar <b>ayrılabilmeli</b> ve ucuza alanlar pahalı piyasada <b>yeniden satamamalı</b> (yoksa herkes ucuz piyasadan alır); (3) grupların talep esneklikleri <b>farklı</b> olmalı. Hizmetler (sinema, tren, kuaför) yeniden satılamadığı için bu yöntem en çok hizmetlerde görülür." },
{ l: 2, q: "Under third-degree price discrimination, a profit-maximising firm will charge a higher price to the group whose demand is:",
  o: ["Less price elastic", "More price elastic", "Perfectly elastic", "Growing faster"],
  s: "Talebi <b>daha az esnek</b> olan grup fiyat artışına daha az tepki verir (alternatifi azdır ya da mal onun için zorunludur). Bu yüzden ondan <b>daha yüksek</b> fiyat alınır. Esnek gruba (öğrenciler, turistler) düşük fiyat uygulanır, çünkü pahalı olursa hiç almazlar. Örnek: iş seyahati yapanlar sabah erken trene binmek zorundadır → pahalı bilet (Box 7.5)." },
{ l: 2, q: "Under first-degree price discrimination, the firm:",
  o: ["Charges each consumer the maximum price he or she is willing to pay for each unit, so it captures all consumer surplus", "Charges different prices for different quantities bought", "Charges different groups different prices", "Charges everyone the same price"],
  s: "<b>First-degree</b> (birinci derece, 'tam'): her tüketiciden her birim için ödemeye razı olduğu <b>en yüksek</b> fiyat alınır. Örnek: pazarda pazarlık yapan satıcı. Tüketicinin ödemeye razı olduğu ile ödediği arasında fark kalmaz, yani <b>tüketici rantının tamamı</b> firmaya geçer. Uygulamada tam olarak yapmak zordur, çünkü firma herkesin ödeme isteğini bilmelidir." },
{ l: 2, q: "An electricity company charges a high price for the first 100 kWh a household uses each month and a lower price for additional units. This is:",
  o: ["Second-degree price discrimination", "First-degree price discrimination", "Third-degree price discrimination", "Peak-load pricing"],
  s: "<b>Second-degree</b> (ikinci derece): fiyat, <b>alınan miktara</b> göre değişir. Kitaptaki örnek: ilk kilovatsaatler (aydınlatma, cihazlar: <b>ikamesi yok</b>, talep esnek değil) pahalı; ek birimler (ısınma, yemek pişirme: gaz gibi <b>ikameleri var</b>) ucuz. Toplu alım indirimleri de bu türdendir. Peak-load pricing ise saatlere göre fiyattır." },
{ l: 3, q: "A firm with a constant marginal cost of £4 sells in two separate markets. Price elasticity of demand is −2 in market A and −4 in market B. Using the rule P = MC / (1 + 1/PED), what price should it charge in each market?",
  o: ["A: £8, B: £5.33", "A: £5.33, B: £8", "A: £4, B: £4", "A: £2, B: £1"],
  s: "Her piyasada MR = MC olmalı; formül P = MC / (1 + 1/PED):<br>A: 4 / (1 + 1/(−2)) = 4 / (1 − 0.5) = 4 / 0.5 = <b>£8</b><br>B: 4 / (1 + 1/(−4)) = 4 / (1 − 0.25) = 4 / 0.75 = <b>£5.33</b><br>Talebi <b>daha az esnek</b> olan A piyasasında fiyat daha yüksek, kâr payı daha büyük. Bu, üçüncü derece fiyat farklılaştırmasının sayısal hâlidir. Tek fiyat (£4) MC'dir, tam rekabet sonucudur." },
{ l: 3, q: "Train companies charge high 'anytime' fares before 9.30 am and much cheaper off-peak fares later. Why is this profitable?",
  o: ["Commuters and business travellers who must travel early have less elastic demand than leisure travellers, so they can be charged more", "Because costs are higher in the afternoon", "Because leisure travellers have less elastic demand", "Because trains are empty in the morning"],
  s: "Sabah yolcuları (işe gidenler, iş seyahatinde olanlar) belli bir saatte varmak <b>zorundadır</b>, çoğu zaman bileti şirket öder → talepleri <b>esnek değildir</b> → yüksek fiyat. Boş zaman yolcuları istedikleri saatte gidebilir, araba ya da otobüse geçebilir → talepleri <b>esnektir</b> → düşük fiyat (Box 7.5). Not: yoğun saatte tren kapasitesi dolu olduğu için maliyet de daha yüksektir; kitap bunu <b>peak-load pricing</b> (Box 7.6) olarak ayrıca ele alır, çünkü saf ayrımcılıkta maliyet aynı olmalıdır." },
{ l: 3, q: "Compared with a single-price monopolist, what is true of a firm that can practise perfect (first-degree) price discrimination?",
  o: ["It produces more, up to the point where P = MC, because selling an extra unit no longer requires cutting the price on other units", "It produces less and charges everyone a higher price", "It produces the same output at the same price", "It makes less profit"],
  s: "Tek fiyatlı tekel, bir birim daha satmak için <b>tüm birimlerde</b> fiyatı düşürmek zorundadır, bu yüzden MR &lt; P'dir ve az üretir. Birinci derece ayrımcılıkta ek birim sadece o birimi isteyen kişiye, onun ödemeye razı olduğu fiyattan satılır; diğer birimlerin fiyatı düşmez. Bu yüzden <b>MR = P</b> olur ve kâr maksimizasyonu <b>P = MC</b>'de gerçekleşir: üretim tam rekabet kadardır. Ama tüketici rantının tamamı firmaya geçer; kitaba göre ayrımcılıkta bazı tüketiciler <b>kazanır</b> (hiç alamayacakken alabilenler), bazıları <b>kaybeder</b>." },
];

Q.t29 = [

{ l: 3, q: "A firm faces demand P = 100 − 2Q (MR = 100 − 4Q) and a constant marginal and average cost of £20. If its managers maximise sales revenue (with no profit constraint) instead of profit, what are its output, price and profit?",
  o: ["Q = 25, P = £50, profit = £750 (compared with Q = 20, P = £60, profit = £800 if it maximised profit)", "Q = 20, P = £60, profit = £800", "Q = 40, P = £20, profit = £0", "Q = 50, P = £0, profit = −£1,000"],
  s: "Satış geliri maksimizasyonu: MR = 0 → 100 − 4Q = 0 → <b>Q = 25</b>.<br>P = 100 − 2(25) = <b>£50</b>. TR = 50 × 25 = £1,250.<br>Kâr = (50 − 20) × 25 = <b>£750</b>.<br>Kâr maksimizasyonu (MR = MC = 20): Q = 20, P = £60, kâr £800.<br>Sonuç: satış maksimize eden firma <b>daha çok üretir, daha düşük fiyat</b> koyar ve <b>daha az kâr</b> eder. Kitabın özeti de bunu söyler (reklam da genelde daha yüksektir). £750 hissedarları tatmin etmeye yetiyorsa yöneticiler bu yolu seçebilir." },
{ l: 3, q: "A car manufacturer buys the company that supplies its tyres. This is backward vertical integration. Which is a likely benefit for the car maker?",
  o: ["More secure supplies and less uncertainty, and possible cost savings from coordinating production", "It eliminates a competing car manufacturer", "It diversifies into an unrelated industry to spread risk", "It automatically lowers the price of cars for all competitors"],
  s: "<b>Vertical integration</b>: üretim zincirinde <b>geriye</b> (tedarikçiyi almak: backward) ya da <b>ileriye</b> (satış noktasını almak: forward) doğru büyümek. Kitaba göre faydaları: çeşitli <b>ölçek ekonomileriyle</b> maliyetlerin düşmesi (üretimin koordinasyonu, aracı kârının ortadan kalkması) ve <b>belirsizliğin azalması</b>: lastik tedariki güvence altına alınır, rakiplerin tedariki kontrol etmesi engellenir. Rakip araba üreticisini almak yatay birleşmedir; ilgisiz sektöre girmek conglomerate'tir." },
{ l: 3, q: "Managers want to maximise the growth of their firm. Why must they still make sufficient profits?",
  o: ["Growth needs finance from retained profits or investors, and low profits (and a low share price) make the firm vulnerable to a takeover, which would threaten the managers' jobs", "Because growth and profits are always the same thing", "Because the law requires maximum profits", "Because profits are needed only to pay taxes"],
  s: "Büyüme maksimizasyonu yapan yöneticiler de kârı görmezden gelemez:<br>• Büyümenin <b>finansmanı</b>: dağıtılmayan kâr (en önemli kaynak), hisse ihracı ya da borçlanma; hepsi yeterli kâr gerektirir (yatırımcı ve banka kârlı şirkete para verir).<br>• <b>Takeover</b> tehdidi: düşük kâr hisse fiyatını düşürür; şirket, varlıklarına göre ucuz kalır ve başka bir şirket tarafından satın alınabilir. Yeni sahipler genelde yöneticileri değiştirir.<br>Bu yüzden yöneticiler bir <b>kâr kısıtı</b> altında büyümeyi maksimize eder." },
];

Q.t30 = [
{ l: 1, q: "Which of the following are all stakeholders in a firm?",
  o: ["Shareholders, managers, workers, customers, suppliers and creditors", "Only shareholders", "Only managers and workers", "Only the government"],
  s: "<b>Stakeholders</b> (paydaşlar, Box 8.6): firmanın kararlarından etkilenen ve kararlarını etkileyebilen herkes: hissedarlar, yöneticiler, işçiler, müşteriler, tedarikçiler, alacaklılar (bankalar), hatta yerel toplum. Kitaba göre bu grupların amaçları <b>çelişebilir</b> (işçiler yüksek ücret, müşteriler düşük fiyat, hissedarlar yüksek kâr ister) ve firma hepsini aynı anda maksimize edemez." },
{ l: 1, q: "Under mark-up (cost-plus) pricing, a firm sets its price by:",
  o: ["Adding a percentage for profit to its average cost", "Setting MR equal to MC", "Charging what the market leader charges", "Charging each customer the most they will pay"],
  s: "<b>Mark-up pricing</b>: P = AFC + AVC + kâr payı. Firma birim başına ortalama maliyetini hesaplar ve üstüne belli bir yüzde ekler. Basittir, MR ve MC eğrilerini bilmeyi gerektirmez. Kitaba göre gerçek firmaların çoğu fiyatı böyle belirler (Box 8.7). MR = MC teorik kâr maksimizasyonudur; lideri izlemek fiyat liderliğidir." },
{ l: 1, q: "In behavioural theories of the firm, 'organisational slack' refers to:",
  o: ["Spare resources or easy targets in parts of the firm that can be used when targets are not met, reducing conflict", "Workers who are lazy", "The firm's unsold stock", "The gap between price and marginal cost"],
  s: "<b>Organisational slack</b> (örgütsel boşluk): firmanın bazı bölümlerinde biraz fazla kaynak, rahat bütçe ya da kolay hedef bırakılması. Hedefler tutmazsa bu boşluk kullanılır ve <b>diğer hedefleri değiştirmeye</b> gerek kalmaz. Böylece yöneticiler arasındaki <b>çatışma azalır</b>. Bedeli: firma tam verimli çalışmaz (X verimsizliği)." },
{ l: 2, q: "A department easily exceeded its sales target last year. According to behavioural theory, what is likely to happen this year?",
  o: ["The target will be made more ambitious", "The target will be lowered", "The department will be closed", "Nothing: targets never change"],
  s: "Kitaba göre (8.3, madde 2): hedefler geçen yıl <b>kolayca</b> tutturulduysa, bu yıl <b>daha iddialı</b> yapılır. Tutturulamadıysa sorunu düzeltmek için bir <b>search procedure</b> (araştırma süreci) başlar; bu, hedefleri aşağı çekmeyi de içerebilir ve yöneticiler arasında pazarlıkla olur. Yani firma maksimize etmez, tatmin edici hedefleri <b>zamanla uyarlar</b>." },
{ l: 2, q: "A firm's average fixed cost is £4 and its average variable cost is £6. It adds a 20% mark-up on average cost. What price does it charge?",
  o: ["£12", "£10", "£7.20", "£11.20"],
  s: "Ortalama maliyet (AC) = AFC + AVC = 4 + 6 = <b>£10</b>.<br>%20 kâr payı: 10 × 0.20 = £2.<br>P = 10 + 2 = <b>£12</b>.<br>£10 sadece maliyettir (normal kârsız). £7.20 kâr payını sadece AVC'ye uygular. £11.20, kâr payını sadece AVC'ye (6 × 0.2 = 1.2) ekleyip AFC'yi de toplamaktır. Gerçek firmalarda payın büyüklüğü piyasa koşullarına göre değişir: büyüyen ya da güçlü olunan piyasada artar." },
{ l: 2, q: "Compared with profit-maximising firms, satisficing firms are likely to be:",
  o: ["Less innovative and less aggressive, often changing only in response to rivals, and possibly more X-inefficient", "More aggressive in exploiting market power", "More innovative and quicker to change", "Exactly the same in behaviour"],
  s: "Kitabın özeti (8.3, maddeler 4-5): tatmin edici hedeflerle yetinen firmalar <b>daha az yenilikçi</b>, <b>daha az agresif</b> ve değişimi başlatmaya <b>daha isteksizdir</b>; değiştiklerinde genelde rakiplerin hamlesine <b>tepki</b> olarak değişirler ve performanslarını rakiplere göre ölçerler. Olumlu yanı: piyasa güçlerini daha az kötüye kullanabilirler. Olumsuz yanı: maliyetleri kontrol etme baskısı az olduğu için <b>X inefficiency</b> daha fazla olabilir." },
{ l: 3, q: "A firm's marginal cost is £10 and the price elasticity of demand for its product is −3. Using the profit-maximising mark-up rule P = MC / (1 + 1/PED), what price should it charge?",
  o: ["£15", "£12.50", "£13.33", "£30"],
  s: "P = MC / (1 + 1/PED) = 10 / (1 + 1/(−3)) = 10 / (1 − 0.333) = 10 / 0.667 = <b>£15</b>.<br>Kontrol: kitaptaki örnek PED = −5 için 10 / 0.8 = £12.50 verir. Talep <b>daha az esnek</b> (−3) olduğunda kâr payı daha büyüktür (%50 vs %25).<br>Kitabın uyarısı: bu kural sadece kâr maksimize eden çıktıda geçerlidir; firma o çıktıdan uzaksa MC ve PED değerleri yanıltıcı olabilir. £30 = 10 × 3 hatalı bir işlemdir." },
{ l: 3, q: "Why do many firms use cost-plus (mark-up) pricing rather than setting MR equal to MC?",
  o: ["They often lack information about their demand and marginal revenue curves, and many are satisficers rather than profit maximisers", "Because cost-plus pricing always gives maximum profit", "Because the law requires it", "Because MR and MC are always equal"],
  s: "Kitaba göre (8.1 ve 8.4): firmalar talep ve maliyet eğrilerini, rakiplerin tepkilerini <b>bilmez</b>; MR ve MC'yi hesaplayamaz. Bu yüzden basit <b>rules of thumb</b> (pratik kurallar) kullanır. Mark-up fiyatlaması ayrıca kâr maksimize etmeyen, <b>hedef kâr</b> peşindeki (satisficing) firmalar için doğaldır. Kâr payı piyasa koşullarına göre deneme-yanılma ile ayarlanarak kâr maksimumuna yaklaşabilir ama bunu garanti etmez." },
{ l: 3, q: "In a large firm, the marketing department wants low prices to boost sales, while the finance department wants higher prices to raise profit. According to behavioural theory, how is this conflict usually resolved?",
  o: ["The firm sets satisfactory target levels for several aims (sales, profit, etc.) rather than maximising any one, with bargaining between managers", "The firm always maximises profit and ignores marketing", "The firm always maximises sales and ignores finance", "The government decides the price"],
  s: "Firma çelişen amaçların <b>hepsini birden</b> maksimize edemez. Davranışsal teoriye göre çözüm, her amaç için <b>tatmin edici bir hedef</b> belirlemektir (ör. satışta %5 büyüme, en az £2m kâr). Hedefler <b>yöneticiler arası pazarlıkla</b> belirlenir ve sonuçlara göre her yıl ayarlanır; <b>organisational slack</b> çatışmayı yumuşatır. Bu, bir firmanın tek bir şeyi maksimize ettiğini varsayan teorilerden farklıdır." },
];

Q.t31 = [
{ l: 1, q: "The marginal revenue product of labour (MRP_L) is:",
  o: ["The extra revenue a firm earns from employing one more worker", "The wage paid to the last worker", "The total output of all workers", "The extra output from one more worker"],
  s: "<b>MRP_L</b>: bir işçi daha çalıştırmanın firmaya getirdiği <b>ek gelir</b>. Formül: <b>MRP = MPP × MR</b> (tam rekabette MR = P). Ek işçinin ürettiği ek <b>miktar</b> MPP'dir; MRP onun parasal değeridir. Ücret ise maliyet tarafıdır." },
{ l: 1, q: "A profit-maximising firm in a perfectly competitive labour market will employ workers up to the point where:",
  o: ["MRP_L equals the wage", "The wage is at its lowest", "MPP_L is at its maximum", "Total revenue is at its maximum"],
  s: "Bir işçi daha almak, getirdiği ek gelir (MRP) ek maliyetinden (MC_L) büyük olduğu sürece kârlıdır. Tam rekabetçi emek piyasasında firma <b>wage taker</b>'dır: istediği kadar işçiyi piyasa ücretinden alabilir, yani MC_L = W. Kural: <b>MRP_L = W</b>. Bu yüzden firmanın MRP eğrisi, onun <b>emek talep eğrisidir</b>." },
{ l: 1, q: "When the wage rate rises, the substitution effect on the hours a person wants to work is:",
  o: ["To work more, because leisure has become more expensive (each hour of leisure costs more lost income)", "To work less, because they feel richer", "Zero", "To leave the labour market"],
  s: "Ücret artınca bir saat <b>boş zamanın fırsat maliyeti</b> (kaybedilen ücret) artar. Boş zaman pahalılaştığı için kişi onu işle ikame eder → <b>daha çok çalışır</b>: ikame etkisi <b>pozitiftir</b>. 'Zenginleştim, daha az çalışabilirim' ise <b>gelir etkisidir</b> ve ters yöndedir." },
{ l: 2, q: "A firm sells its product at £5 in a perfectly competitive market. The 5th worker adds 12 units of output. The wage is £50. Should the firm hire the 5th worker?",
  o: ["Yes: MRP = £60, which is more than the £50 wage", "No: MRP = £12, which is less than the wage", "No: MRP = £50, the same as the wage", "Yes, because output always rises"],
  s: "MRP = MPP × P = 12 × £5 = <b>£60</b>.<br>İşçinin maliyeti (ücret) £50.<br>MRP (£60) &gt; W (£50) → bu işçi kâra <b>£10</b> ekler → işe alınmalı.<br>£12 sadece fiziksel üretimdir (MPP), parasal değeri değil. Firma MRP'nin ücrete eşit olduğu noktaya kadar işçi almaya devam eder." },
{ l: 2, q: "At high wage rates, an individual's labour supply curve may bend backwards. This happens when:",
  o: ["The income effect of a wage rise is larger than the substitution effect", "The substitution effect is larger than the income effect", "Both effects are zero", "The wage falls"],
  s: "Ücret artışının iki etkisi zıt yöndedir: <b>ikame etkisi</b> (+): boş zaman pahalandı, daha çok çalış. <b>Gelir etkisi</b> (−): zenginleştim, daha çok boş zaman 'satın alabilirim', daha az çalış. Düşük ücretlerde genelde ikame etkisi baskındır. Yüksek ücretlerde gelir etkisi <b>daha büyük</b> olabilir: ücret artınca kişi <b>daha az</b> saat çalışır ve arz eğrisi <b>geriye bükülür</b> (backward-bending). Örnek: çok kazanan bir avukatın haftada 4 güne inmesi." },
{ l: 2, q: "The demand for a type of labour will be MORE wage elastic if:",
  o: ["Wages form a large proportion of the firm's total costs and labour can easily be replaced by machines", "Wages are a tiny proportion of total costs", "The demand for the product is very inelastic", "It is the very short run"],
  s: "Kitaba göre emek talebinin esnekliği daha yüksektir eğer: (1) ürünün talebi <b>esnekse</b> (ücret artışı fiyata yansıyınca satışlar çok düşer), (2) emek diğer faktörlerle (makine) <b>kolayca ikame</b> edilebiliyorsa, (3) ikame faktörlerin arzı esnekse, (4) ücretler toplam maliyetin <b>büyük bir kısmıysa</b> (ücret artışı maliyeti çok etkiler), (5) dönem <b>uzunsa</b> (uyum için zaman var). Diğer seçenekler emek talebini daha az esnek yapar." },
{ l: 3, q: "A firm sells output at £3 in a perfect market and pays a wage of £30. Total output with 1 to 5 workers is 20, 38, 54, 66, 74 units. How many workers will it employ?",
  o: ["4 workers", "5 workers", "3 workers", "2 workers"],
  s: "MPP: 1. işçi 20, 2. işçi 18, 3. işçi 16, 4. işçi 12, 5. işçi 8.<br>MRP = MPP × £3: 60, 54, 48, <b>36</b>, <b>24</b>.<br>Kural: MRP ≥ W (£30) olduğu sürece işe al.<br>4. işçi: MRP £36 &gt; £30 → al. 5. işçi: MRP £24 &lt; £30 → alma.<br>Cevap: <b>4 işçi</b>. Azalan verimler MRP'yi düşürür ve emek talep eğrisini aşağı eğimli yapar." },
{ l: 3, q: "In the previous firm (output 20, 38, 54, 66, 74 for 1 to 5 workers; wage £30), the price of the product rises from £3 to £4. How many workers will it now employ?",
  o: ["5 workers", "4 workers", "3 workers", "6 workers"],
  s: "Yeni MRP = MPP × £4: 80, 72, 64, 48, <b>32</b>.<br>5. işçinin MRP'si artık £32 &gt; £30 → <b>5 işçi</b> alınır.<br>Ürün fiyatı artınca her işçinin ürettiğinin değeri artar: MRP eğrisi (emek talebi) <b>sağa kayar</b>. Bu, emek talebinin bir <b>türetilmiş talep</b> (derived demand) olduğunu gösterir: işçilere talep, ürettikleri malın talebinden gelir. Tabloda 6. işçi yok, bu yüzden 6 olamaz." },
{ l: 3, q: "Even under perfect competition, why might wage differences between jobs persist?",
  o: ["People have different abilities and skills, they are not perfectly mobile, and jobs differ in their non-wage characteristics (e.g. danger or unpleasantness)", "Because perfect competition always eliminates all differences", "Because all workers have identical skills", "Because firms in perfect competition set wages"],
  s: "Teoride işçiler düşük ücretli işlerden yüksek ücretlilere geçer ve farklar kapanır. Ama kitaba göre eşitsizlik tam rekabette bile sürebilir:<br>• Farklı <b>yetenek ve beceriler</b> (human capital: eğitim, deneyim),<br>• Eksik <b>hareketlilik</b> (taşınma maliyeti, aile bağları, yeni mesleği öğrenme süresi),<br>• İşlerin farklı <b>nitelikleri</b>: tehlikeli ya da sevimsiz işler daha çok ödemelidir.<br>Buna ek olarak piyasa aksaklıkları ve toprak ile sermaye sahipliğindeki eşitsizlik gelir farklarını büyütür." },
];

Q.t32 = [
{ l: 1, q: "A monopsony exists when:",
  o: ["There is a single buyer (e.g. a single employer of a type of labour)", "There is a single seller", "There are many buyers and sellers", "A union represents all workers"],
  s: "<b>Monopsony</b>: tek <b>alıcı</b>. Emek piyasasında, belli bir emek türünün <b>tek işvereni</b> (ör. küçük bir kasabadaki tek büyük fabrika, Box 9.4'teki Viktorya dönemi maden kasabaları, posta işçileri için Post Office). Az sayıda alıcı varsa <b>oligopsony</b>. Tek satıcı monopoly'dir; tek bir sendika emeğin tek satıcısı gibi davranır." },
{ l: 1, q: "Compared with a perfectly competitive labour market, a monopsony employer will tend to:",
  o: ["Employ fewer workers at a lower wage", "Employ more workers at a higher wage", "Employ the same number at a higher wage", "Employ more workers at a lower wage"],
  s: "Monopsonist daha çok işçi almak için ücreti <b>herkese</b> artırmak zorundadır, bu yüzden ek işçinin maliyeti (MC_L) ücretten yüksektir. MRP = MC_L noktasında, rekabetçi piyasaya göre <b>daha az</b> işçi alır ve ücreti emek arz eğrisinden okur, yani <b>daha düşük</b> ücret öder. Piyasa gücünü ücretleri bastırmak için kullanır." },
{ l: 1, q: "Bilateral monopoly in a labour market is where:",
  o: ["A monopoly union faces a monopsony employer", "Two firms share the labour market", "Two unions compete for members", "The government employs all workers"],
  s: "<b>Bilateral monopoly</b> (iki yanlı tekel): emeğin tek satıcısı (bir <b>sendika</b>) ile emeğin tek alıcısı (<b>monopsonist işveren</b>) karşı karşıyadır. Tek bir denge ücreti yoktur; ücret, iki tarafın <b>toplu pazarlığının</b> (collective bargaining) sonucuna bağlıdır." },
{ l: 2, q: "A monopsony employer pays 10 workers £100 a day each. To attract an 11th worker it must raise the wage to £105 for everyone. What is the marginal cost of the 11th worker?",
  o: ["£155", "£105", "£5", "£1,155"],
  s: "10 işçide toplam ücret: 10 × £100 = £1,000.<br>11 işçide toplam ücret: 11 × £105 = £1,155.<br>MC_L = 1,155 − 1,000 = <b>£155</b>.<br>Yeni işçiye £105 ödenir, ama mevcut 10 işçinin her birine de £5 fazla (toplam £50) ödenmesi gerekir: 105 + 50 = 155. İşte bu yüzden monopsonide <b>MC_L &gt; ücret</b>'tir ve firma daha az işçi alır. £1,155 toplam ücret faturasıdır." },
{ l: 2, q: "A powerful union raises the wage in an industry where employers sell their products in a perfectly competitive market. What is the likely effect?",
  o: ["Employment will fall, because firms move up their MRP curves and hire fewer workers", "Employment will rise", "There is no effect on employment", "Product prices will fall"],
  s: "Kitaba göre (9.2, madde 2): sendikanın ücreti artırma gücü, işveren mal piyasasında <b>tam ya da tekelci rekabetteyse</b> sınırlıdır. Firmanın aşırı kârı yoktur; daha yüksek ücrette MRP = W kuralı gereği <b>daha az işçi</b> alır (MRP eğrisi boyunca yukarı hareket). Yani yüksek ücret ile istihdam arasında bir değiş tokuş vardır. Monopsony işverenle karşılaşan sendika ise bu değiş tokuş olmadan ücreti artırabilir." },
{ l: 2, q: "According to the book, the outcome of collective bargaining between a union and an employer depends on:",
  o: ["The relative power, attitudes and bargaining skills of both sides, the firm's profitability, the information each side has, and the legal framework", "Only the market wage", "Only the government's decision", "Only the number of workers"],
  s: "İki yanlı tekelde tek bir denge yoktur. Sonuç şunlara bağlıdır: iki tarafın <b>göreli gücü</b> (grev ya da lokavt yapabilme, işçilerin birliği), <b>tutumları</b> ve <b>pazarlık becerileri</b>, firmanın <b>kârlılığı</b> (ne kadar ödeyebileceği), tarafların birbiri hakkındaki <b>bilgisi</b> ve <b>yasal çerçeve</b> (grev yasaları). Her iki taraf da tehdit ve vaatlerde bulunur; bunlar oyun teorisindeki gibi <b>inandırıcı</b> olmalıdır." },
{ l: 3, q: "In a monopsony labour market, a minimum wage is set above the monopsony wage but below the competitive wage. What could happen to employment?",
  o: ["It could rise, because the employer now faces a constant marginal cost of labour (the minimum wage) over a range of employment", "It must fall, as in a competitive market", "It stays the same in all cases", "It falls to zero"],
  s: "Monopsonist normalde az işçi alır, çünkü her ek işçi ücreti herkese yükseltir (MC_L &gt; W). Asgari ücret konunca, arz eğrisinin bu ücrete kadar olan kısmında firma <b>herkese aynı sabit ücreti</b> öder; ek işçi almak diğerlerinin ücretini artırmaz → MC_L = asgari ücret, yatay. MRP bu düzeye eşit olana kadar daha çok işçi alır → istihdam <b>artabilir</b>. Bu, tam rekabet modelinin ('asgari ücret işsizlik yaratır') tersidir. Aynı mantık, monopsonist karşısındaki sendikaya da uygulanır." },
{ l: 3, q: "An employer with market power discriminates against a group of workers, paying them less than others for the same work. A law requiring equal pay is passed, but discrimination in hiring is not banned. What does the book suggest may happen?",
  o: ["Employment of the group discriminated against may fall, as the employer hires fewer of them at the higher wage", "Their employment will definitely rise", "Their wages will fall further", "Discrimination will disappear completely"],
  s: "Piyasa gücü olan işveren, ayrımcılık yaptığı grubun (ırk, cinsiyet, yaş) ücretini aşağı çekebilir. Eşit ücret yasası bu grubun ücretini yükseltir. Ama işveren <b>işe almada</b> ayrımcılık yapmaya devam edebiliyorsa, artık daha pahalı olan bu gruptan <b>daha az</b> kişi alabilir. Kitabın sonucu: firmalar ayrımcılık yapmaya <b>zorla</b> engellenmezse, eşit ücret yasası ayrımcılığa uğrayan grubun istihdamını azaltabilir. Bu yüzden eşit ücret ve ayrımcılık yasağı birlikte uygulanır." },
{ l: 3, q: "Why can a union facing a monopsony employer raise wages above the monopsony level WITHOUT reducing employment?",
  o: ["The negotiated wage removes the employer's incentive to restrict hiring, because extra workers no longer raise the wage paid to existing workers", "Because monopsonists always make losses", "Because the employer's MRP rises when wages rise", "Because unions can force firms to employ anyone"],
  s: "Monopsonist az işçi alıyordu, çünkü her ek işçi <b>tüm</b> işçilerin ücretini yükseltiyordu (MC_L ücretin üstünde). Sendika bir ücret belirleyince, firma bu ücretten (arz eğrisine kadar) istediği kadar işçi alabilir; ek işçi artık diğerlerinin ücretini yükseltmez. MC_L bu aralıkta pazarlık edilen ücrete eşit ve <b>yatay</b> olur. Bu yüzden ücret, istihdamı düşürmeden monopsony düzeyinin <b>üstüne</b> çıkabilir; hatta istihdam artabilir. Ücretin tam nerede olacağı toplu pazarlığa bağlıdır." },
];

Q.t33 = [
{ l: 1, q: "The supply of land is usually described as:",
  o: ["Perfectly (or almost perfectly) inelastic", "Perfectly elastic", "Upward sloping and very elastic", "Downward sloping"],
  s: "Toprak doğanın verdiği bir faktördür; toplam miktarı fiyat (rant) ne olursa olsun neredeyse <b>değişmez</b>. Bu yüzden arz eğrisi <b>dikey</b>dir (tamamen esnek değil). Sonuç: rantın düzeyi tamamen <b>talebe</b> bağlıdır. Belli bir kullanım (ör. buğday tarlası) için arz ise daha esnek olabilir, çünkü toprak başka kullanımlardan kaydırılabilir." },
{ l: 1, q: "Discounting future earnings from an investment to find their present value is necessary because:",
  o: ["Money received in the future is worth less than the same amount today, since money today could earn interest", "Future earnings are always zero", "Inflation is always negative", "Firms cannot borrow money"],
  s: "Bugünkü £100 bankada faiz kazanabilir; 1 yıl sonra %10 faizle £110 olur. Bu yüzden 1 yıl sonra alınacak £110'un <b>bugünkü değeri</b> £100'dür. Yatırımın gelecekteki getirileri bu yüzden piyasa faiziyle bugüne <b>indirgenir</b> (discounting): <b>PV = X / (1 + r)ⁿ</b>. Sonra bugünkü değer, yatırımın maliyetiyle karşılaştırılır." },
{ l: 1, q: "When a company sells NEW shares to raise finance on the stock market, the stock market is acting as a:",
  o: ["Primary market", "Secondary market", "Futures market", "Labour market"],
  s: "Borsa iki işlev görür: <b>primary market</b> (birincil piyasa): şirketler <b>yeni</b> hisse ve tahvil satar, para doğrudan şirkete gider (yatırım finansmanı). <b>Secondary market</b> (ikincil piyasa): <b>var olan</b> hisseler yatırımcılar arasında alınıp satılır; para şirkete değil satana gider. İkincil piyasa, hisseleri kolayca satılabilir yaptığı için insanları birincil piyasada almaya teşvik eder." },
{ l: 2, q: "What is the present value of £121 to be received in two years' time if the interest rate is 10%?",
  o: ["£100", "£110", "£121", "£96.80"],
  s: "PV = X / (1 + r)ⁿ = 121 / (1.10)² = 121 / 1.21 = <b>£100</b>.<br>Kontrol: £100'ü %10 faizle yatırırsan 1 yıl sonra £110, 2 yıl sonra £121 olur ✓.<br>£110, sadece bir yıl indirmektir (121/1.1). £96.80, faizi iki kez basitçe düşmektir (121 × 0.8). Gelecekteki para bugünküden <b>az değerlidir</b>, bu yüzden PV her zaman gelecekteki tutardan küçüktür (faiz pozitifse)." },
{ l: 2, q: "If market interest rates rise, what happens to the present value of an investment's future earnings, and to investment?",
  o: ["Present value falls, so fewer investments are worthwhile and investment falls", "Present value rises, so investment rises", "Present value is unchanged", "Present value falls, but investment rises"],
  s: "PV = X / (1 + r)ⁿ: <b>r</b> büyüdükçe payda büyür, <b>PV küçülür</b>. Bu yüzden yatırımın getirilerinin bugünkü değeri düşer ve daha az yatırım maliyetini karşılar → bazı projeler artık <b>kârlı değildir</b> → yatırım düşer. Sezgi: faiz yüksekken parayı bankaya koymak daha cazip olur (yatırımın fırsat maliyeti artar). Bu, faiz politikasının ekonomiyi nasıl etkilediğinin temel mekanizmalarından biridir (makroekonomide de çıkar)." },
{ l: 2, q: "A firm is considering a risky investment. Compared with the market rate of interest, the rate of return it requires will be:",
  o: ["Higher, to compensate for the risk", "Lower, because risk is good", "Exactly equal to the market rate", "Zero"],
  s: "Kitaba göre (9.3, madde 9): firma indirgeme için piyasa faizini kullanır, ama yatırım <b>riskliyse</b> piyasa faizinden <b>daha yüksek</b> bir getiri oranı ister. Ek getiri, riskin karşılığıdır (risk primi). Bu yüzden riskli girişimler ya daha yüksek kâr vaat etmeli ya da yapılmaz. Riskten kaçınma (Bölüm 4.2) mantığının yatırıma uygulanmasıdır." },
{ l: 3, q: "An investment costs £1,000 today and will return £600 at the end of each of the next two years. The interest rate is 10%. Is it worthwhile?",
  o: ["Yes: present value of returns ≈ £1,041, which exceeds the £1,000 cost", "No: present value of returns ≈ £909, below the cost", "Yes: it returns £1,200, which is more than £1,000, so discounting is unnecessary", "No: present value of returns is exactly £1,000"],
  s: "Her getiriyi ayrı ayrı indirge:<br>1. yıl: 600 / 1.10 = £545.45<br>2. yıl: 600 / 1.10² = 600 / 1.21 = £495.87<br>Toplam PV ≈ <b>£1,041.32</b>.<br>PV (£1,041) &gt; maliyet (£1,000) → <b>net bugünkü değer</b> ≈ +£41 → yatırım <b>yapılmalı</b>.<br>£1,200'ü doğrudan maliyetle karşılaştırmak yanlıştır: paranın zaman değeri göz ardı edilir. Faiz %15 olsaydı PV ≈ 522 + 454 = £976 olur ve yatırım yapılmazdı." },
{ l: 3, q: "The price of wheat rises sharply, so the marginal revenue product of farmland rises. Given that the supply of land is perfectly inelastic, what happens in the market for land?",
  o: ["Rents rise but the quantity of land does not change", "Both rents and the quantity of land rise", "Rents stay the same and more land is supplied", "Rents fall"],
  s: "Toprağa talep, toprağın <b>MRP</b>'sidir (türetilmiş talep). Buğday fiyatı artınca bir dönüm toprağın ürettiğinin değeri artar → toprak talebi <b>sağa kayar</b>. Arz eğrisi dikey olduğu için miktar değişemez; talep artışının <b>tamamı rante</b> yansır → <b>rant yükselir</b>, miktar aynı kalır. Bu, 19. yüzyılda David Ricardo'nun gözlemiydi: 'Buğday pahalı olduğu için rant yüksek değil, rant yüksek çünkü buğday pahalı.'" },
{ l: 3, q: "A field earns a rent of £5,000 a year (forever) and the interest rate is 5%. Roughly what will its price be, and what happens to the price if the interest rate falls to 4%?",
  o: ["About £100,000; it rises to about £125,000", "About £5,000; it stays the same", "About £100,000; it falls to about £80,000", "About £250,000; it rises to about £500,000"],
  s: "Kitaba göre toprağın fiyatı, <b>marjinal faydası</b> (yıllık kira getirisi) ile <b>marjinal maliyeti</b> (onu almak için borçlanmanın yıllık faiz maliyeti) eşitlendiğinde dengededir:<br>Faiz × fiyat = kira → fiyat = kira / faiz = 5,000 / 0.05 = <b>£100,000</b>.<br>Faiz %4'e düşerse: 5,000 / 0.04 = <b>£125,000</b>.<br>Faiz düşünce borçlanmak ucuzlar ve aynı kira getirisi daha yüksek bir fiyatı haklı çıkarır: <b>toprak ve konut fiyatları faiz düşünce yükselir</b>. Bu, düşük faizli dönemlerdeki emlak fiyatı artışlarını da açıklar." },
];

</script>
<script>
const LV = { 1: "Kolay", 2: "Orta", 3: "Zor" };
const MIX_SIZE = 20;
const KEY = "econ-quiz-v1";
let answers = {};
try { answers = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { answers = {}; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(answers)); } catch (e) {} }

// Soru kimlikleri: t1-0 ... t14-8. Şıklar kimliğe göre sabit sırayla karıştırılır.
const ALL = [];
TOPICS.forEach(t => Q[t.id].forEach((q, i) => { q.id = t.id + "-" + i; q.topic = t.id; ALL.push(q); }));
function seeded(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return () => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return ((h >>> 0) % 10000) / 10000; }; }
function order(q) { const r = seeded(q.id), a = q.o.map((_, i) => i); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

const app = document.getElementById("app");
const CHAPTERS = SUMMARY.map(c => c.ch);
let view = { name: "ozet" }, filter = 0, mixSet = null, mixChapters = CHAPTERS.slice(), resetAsk = false;

function topicStats(id) { const qs = Q[id]; let g = 0, b = 0; qs.forEach(q => { if (q.id in answers) answers[q.id] === 0 ? g++ : b++; }); return { g, b, n: qs.length }; }
function totals() { let g = 0, b = 0; ALL.forEach(q => { if (q.id in answers) answers[q.id] === 0 ? g++ : b++; }); return { g, b, n: ALL.length }; }
function bar(s) { return `<span class="bar"><i class="g" style="width:${s.g / s.n * 100}%"></i><i class="b" style="width:${s.b / s.n * 100}%"></i></span>`; }

function go(name, extra) { view = Object.assign({ name }, extra || {}); filter = 0; resetAsk = false;
  const hash = name === "topic" ? view.id : name === "mix" ? "karisik" : name;
  if (location.hash.slice(1) !== hash) history.replaceState(null, "", "#" + hash);
  render(); window.scrollTo(0, 0); }

function render() {
  const t = totals();
  document.getElementById("score").textContent = `${t.g}/${t.n} doğru`;
  document.querySelectorAll(".tab").forEach(b => b.setAttribute("aria-current",
    (b.dataset.go === view.name || (b.dataset.go === "sorular" && (view.name === "topic" || view.name === "mix"))) ? "page" : "false"));
  document.getElementById("back").hidden = !(view.name === "topic" || view.name === "mix");
  ({ ozet: renderSummary, sorular: renderTopics, ilerleme: renderProgress, topic: renderTopic, mix: renderMix })[view.name]();
}

function renderSummary() {
  const tbl = h => h.replace(/<table class="tbl">/g, '<div class="tbl-wrap"><table class="tbl">').replace(/<\/table>/g, "</table></div>");
  app.innerHTML = `<div class="eyebrow">Part A + Part B + Part C</div><h1>Sınav özeti</h1>
  <p class="lead">Kitabın ilk dokuz bölümü. Her başlığa dokunup aç. İngilizce terimler sınavda çıkacak hâliyle kalın yazıldı.</p>
  <div class="stack">${SUMMARY.map(c => `<section class="card chap">
    <div class="chap-head"><span class="chap-no">${c.ch}</span><div><h2>${c.title}</h2><div class="mute">${c.tr} · ${c.part}</div></div></div>
    ${c.sections.map(s => `<details class="sec" id="sec-${s.code}"><summary><span class="code">${s.code}</span><span><h3>${s.title}</h3><span class="sec-tr">${s.tr}</span></span></summary>
      <div class="sec-body">${tbl(s.html)}<button class="quiz-link" data-quiz="${s.code}">Bu konunun sorularını çöz →</button></div></details>`).join("")}
  </section>`).join("")}</div>`;
}

function renderTopics() {
  let html = `<div class="eyebrow">${ALL.length} soru · ${TOPICS.length} konu</div><h1>Sorular</h1>
  <p class="lead">Her konuda 9 soru: 3 kolay, 3 orta, 3 zor. Bir şıkka dokununca hemen cevabı ve ayrıntılı çözümü görürsün. Sorular sınavdaki gibi İngilizce, çözümler Türkçe.</p>
  <div class="card mix"><h3>Karışık deneme sınavı</h3><div class="mute">Seçtiğin bölümlerden rastgele ${MIX_SIZE} soru.</div>
  <div class="row">${CHAPTERS.map(c => `<button class="chip" data-mixch="${c}" aria-pressed="${mixChapters.includes(c)}">Bölüm ${c}</button>`).join("")}</div>
  <div class="row"><button class="btn" data-startmix>Denemeyi başlat</button></div></div>`;
  let part = "";
  CHAPTERS.forEach(ch => {
    const c = SUMMARY.find(s => s.ch === ch);
    if (c.part !== part) { part = c.part; html += `<h2 style="margin:26px 0 0">${part}</h2>`; }
    html += `<div class="chapter-label">Bölüm ${ch} · ${c.title}</div><div class="stack" style="margin-top:8px">`;
    TOPICS.filter(t => t.ch === ch).forEach(t => { const s = topicStats(t.id);
      html += `<button class="card topic" data-topic="${t.id}"><span><span class="code">${t.code}</span> <h3 style="display:inline">${t.title}</h3><span class="sec-tr">${t.tr}</span></span>
      <span class="frac">${s.g}/${s.n}</span><span class="meta">${bar(s)}<span class="frac">${s.g + s.b === s.n ? "bitti" : (s.n - s.g - s.b) + " kaldı"}</span></span></button>`; });
    html += `</div>`;
  });
  app.innerHTML = html;
}

function qCard(q, no) {
  const done = q.id in answers, pick = answers[q.id], ord = order(q);
  const opts = ord.map((oi, k) => { let cls = "";
    if (done) { if (oi === 0) cls = "right"; else if (oi === pick) cls = "wrong"; }
    return `<button class="opt ${cls}" data-q="${q.id}" data-o="${oi}" ${done ? "disabled" : ""}><span class="let">${"ABCD"[k]}</span><span>${q.o[oi]}</span></button>`; }).join("");
  let sol = "";
  if (done) { const ok = pick === 0, letter = "ABCD"[ord.indexOf(0)];
    sol = `<div class="sol ${ok ? "" : "bad"}"><div class="sol-h ${ok ? "ok" : "no"}">${ok ? "Doğru!" : "Yanlış. Doğru cevap: " + letter}</div>${q.s}</div>`; }
  const t = TOPICS.find(x => x.id === q.topic);
  return `<article class="card q" id="q-${q.id}"><div class="q-head"><span class="lvl l${q.l}">${LV[q.l]}</span><span class="qno">Soru ${no}${view.name === "mix" ? " · " + t.code + " " + t.tr : ""}</span></div>
    <p class="q-text">${q.q}</p><div class="opts">${opts}</div>${sol}</article>`;
}

function renderTopic() {
  const t = TOPICS.find(x => x.id === view.id), s = topicStats(t.id);
  const qs = Q[t.id].filter(q => !filter || q.l === filter);
  app.innerHTML = `<div class="eyebrow">${t.code} · Bölüm ${t.ch}</div><h1>${t.title}</h1><p class="lead">${t.tr} · ${s.g} doğru, ${s.b} yanlış, ${s.n - s.g - s.b} cevapsız</p>
  <div class="row" style="margin-bottom:14px">${[0, 1, 2, 3].map(l => `<button class="chip" data-filter="${l}" aria-pressed="${filter === l}">${l ? LV[l] : "Hepsi"}</button>`).join("")}
  <button class="chip" data-summary="${t.code}">Özeti oku</button></div>
  <div class="stack">${qs.map(q => qCard(q, Q[t.id].indexOf(q) + 1)).join("")}</div>
  <div class="row" style="margin-top:16px">${s.g + s.b ? `<button class="btn ghost" data-resettopic="${t.id}">Bu konuyu sıfırla</button>` : ""}${nextTopicBtn(t.id)}</div>`;
}
function nextTopicBtn(id) { const i = TOPICS.findIndex(x => x.id === id); return i < TOPICS.length - 1 ? `<button class="btn" data-topic="${TOPICS[i + 1].id}">Sonraki konu →</button>` : ""; }

function renderMix() {
  const qs = mixSet.map(id => ALL.find(q => q.id === id));
  const got = qs.filter(q => q.id in view.local), right = qs.filter(q => view.local[q.id] === 0).length;
  app.innerHTML = `<div class="eyebrow">Deneme · ${qs.length} soru</div><h1>Karışık deneme</h1>
  <p class="lead">${got.length === qs.length ? `Bitti: <b>${right}/${qs.length}</b> doğru (%${Math.round(right / qs.length * 100)}).` : `${got.length}/${qs.length} cevaplandı · ${right} doğru`}</p>
  <div class="stack">${qs.map((q, i) => qCardMix(q, i + 1)).join("")}</div>
  <div class="row" style="margin-top:16px"><button class="btn" data-startmix>Yeni deneme</button></div>`;
}
// Denemede cevaplar ayrı tutulur ki aynı soru tekrar çözülebilsin; yine de genel ilerlemeye işlenir.
function qCardMix(q, no) { const keep = answers[q.id], has = q.id in answers; if (q.id in view.local) answers[q.id] = view.local[q.id]; else delete answers[q.id];
  const html = qCard(q, no); if (has) answers[q.id] = keep; else delete answers[q.id]; return html; }

function renderProgress() {
  const t = totals(), wrong = ALL.filter(q => q.id in answers && answers[q.id] !== 0);
  const byLv = [1, 2, 3].map(l => { const qs = ALL.filter(q => q.l === l), g = qs.filter(q => answers[q.id] === 0).length; return `<div class="card stat"><b>${g}/${qs.length}</b><span>${LV[l]}</span></div>`; }).join("");
  app.innerHTML = `<div class="eyebrow">Sadece bu telefonda saklanır</div><h1>İlerleme</h1>
  <div class="stats" style="margin-bottom:12px"><div class="card stat"><b>${t.g}</b><span>doğru</span></div><div class="card stat"><b>${t.b}</b><span>yanlış</span></div><div class="card stat"><b>${t.n - t.g - t.b}</b><span>cevapsız</span></div></div>
  <div class="stats">${byLv}</div>
  <h2 style="margin:24px 0 10px">Konulara göre</h2><div class="stack">${TOPICS.map(x => { const s = topicStats(x.id);
    return `<button class="card topic" data-topic="${x.id}"><span><span class="code">${x.code}</span> ${x.tr}</span><span class="frac">${s.g}/${s.n}</span><span class="meta">${bar(s)}</span></button>`; }).join("")}</div>
  <h2 style="margin:24px 0 4px">Yanlışlarım</h2><p class="lead">Yanlış cevapladığın sorular. Çözümü tekrar okumak için konuya git ve sıfırlayıp yeniden dene.</p>
  ${wrong.length ? `<div class="stack">${wrong.map(q => { const x = TOPICS.find(k => k.id === q.topic); return `<button class="card topic" data-jump="${q.id}"><span><span class="lvl l${q.l}">${LV[q.l]}</span> <span class="mute">${x.code} ${x.tr}</span><span class="sec-tr" style="color:var(--ink)">${q.q}</span></span></button>`; }).join("")}</div>` : `<div class="card empty">Henüz yanlış yok.</div>`}
  <div style="margin-top:24px">${resetAsk ? `<div class="confirm"><span>Tüm cevaplar silinsin mi?</span><button class="btn" style="background:var(--bad)" data-resetall="yes">Evet, sil</button><button class="btn ghost" data-resetall="no">Vazgeç</button></div>` : (t.g + t.b ? `<button class="btn ghost" data-resetall="ask">Tüm ilerlemeyi sıfırla</button>` : "")}</div>`;
}

let bravoTimer;
function bravo() {
  document.querySelectorAll(".bravo").forEach(b => b.remove()); clearTimeout(bravoTimer);
  const b = document.createElement("div"); b.className = "bravo"; b.setAttribute("role", "status");
  b.innerHTML = "<span>Bravo!</span>"; document.body.appendChild(b);
  bravoTimer = setTimeout(() => b.remove(), 1400);
}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.q) { const q = ALL.find(x => x.id === d.q), o = +d.o;
    if (view.name === "mix") { view.local[q.id] = o; }
    answers[q.id] = o; save();
    const y = document.getElementById("q-" + q.id).getBoundingClientRect().top;
    render(); const el = document.getElementById("q-" + q.id); if (el) window.scrollBy(0, el.getBoundingClientRect().top - y);
    if (o === 0) bravo(); return; }
  if (d.topic) return go("topic", { id: d.topic });
  if (d.filter !== undefined) { filter = +d.filter; return render(); }
  if (d.quiz) { const t = TOPICS.find(x => x.code === d.quiz); return go("topic", { id: t.id }); }
  if (d.summary) { go("ozet"); const el = document.getElementById("sec-" + d.summary); if (el) { el.open = true; el.scrollIntoView(); } return; }
  if (d.mixch) { const c = +d.mixch; mixChapters = mixChapters.includes(c) ? mixChapters.filter(x => x !== c) : mixChapters.concat(c); if (!mixChapters.length) mixChapters = [c]; return render(); }
  if (d.startmix !== undefined) { const pool = ALL.filter(q => mixChapters.includes(TOPICS.find(t => t.id === q.topic).ch)); mixSet = shuffle(pool.slice()).slice(0, MIX_SIZE).map(q => q.id); return go("mix", { local: {} }); }
  if (d.resettopic) { Q[d.resettopic].forEach(q => delete answers[q.id]); save(); return render(); }
  if (d.resetall) { if (d.resetall === "ask") resetAsk = true; else { if (d.resetall === "yes") { answers = {}; save(); } resetAsk = false; } return render(); }
  if (d.jump) { const q = ALL.find(x => x.id === d.jump); go("topic", { id: q.topic }); const el = document.getElementById("q-" + q.id); if (el) el.scrollIntoView(); return; }
});
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
document.getElementById("back").addEventListener("click", () => go("sorular"));

const h = location.hash.slice(1);
if (/^t\d+$/.test(h) && Q[h]) go("topic", { id: h });
else if (["ozet", "sorular", "ilerleme"].includes(h)) go(h);
else render();

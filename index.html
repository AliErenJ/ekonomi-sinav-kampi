Q.t6 = [
{ l: 1, q: "When the price of a good rises, the quantity supplied usually:",
  o: ["Rises", "Falls", "Stays the same", "Falls to zero"],
  s: "Fiyat artınca üretmek daha kârlı hale gelir, bu yüzden <b>arz edilen miktar</b> genelde artar. Arz eğrisi <b>pozitif eğimlidir</b> (yukarı çıkar). Bu hem tek bir üretici hem de piyasanın toplam arzı için geçerlidir. Bu, arz eğrisi üzerinde bir harekettir." },
{ l: 1, q: "A fall in the cost of raw materials used to make a good will:",
  o: ["Shift the supply curve to the right", "Shift the supply curve to the left", "Cause a movement up along the supply curve", "Shift the demand curve to the right"],
  s: "Üretim maliyeti (costs of production) arzın fiyat dışı belirleyicilerinden biridir. Ham madde ucuzlarsa her fiyatta üretmek daha kârlı olur, firmalar daha çok arz eder: arz eğrisi <b>sağa</b> (aşağı) kayar = <b>arz artışı</b> (increase in supply). Maliyet talebi doğrudan etkilemez. Eğri üzerinde hareket sadece malın kendi fiyatı değişince olur." },
{ l: 1, q: "What causes a movement along a supply curve?",
  o: ["A change in the price of the good itself", "A change in the cost of production", "A change in technology", "A change in the weather"],
  s: "Kural talepteki ile aynıdır: malın <b>kendi fiyatı</b> değişirse eğri üzerinde hareket olur (change in <b>quantity supplied</b>). Maliyet, teknoloji, hava (rastgele şoklar) gibi diğer belirleyiciler değişirse <b>eğrinin tamamı kayar</b> (change in <b>supply</b>)." },
{ l: 2, q: "Farmers can grow either wheat or barley on their land. The price of wheat rises. What happens to the supply of barley?",
  o: ["It falls: the barley supply curve shifts left as farmers switch to wheat", "It rises, because farming is now more profitable", "It does not change, because the price of barley has not changed", "There is a movement along the barley supply curve"],
  s: "Buğday ve arpa üretimde <b>ikamedir</b> (alternatif ürünler, goods in demand substitutes). Buğday fiyatı artınca buğday daha kârlı olur ve çiftçiler toprağı arpadan buğdaya kaydırır. Arpanın kendi fiyatı değişmediği halde her fiyatta daha az arpa arz edilir: arpa arz eğrisi <b>sola kayar</b>. Belirleyici: 'profitability of alternative products'." },
{ l: 2, q: "Beef and leather are in joint supply. If more beef is produced because beef prices rise, what happens to the supply of leather?",
  o: ["It increases: the leather supply curve shifts right", "It decreases", "It does not change", "There is a movement down the leather supply curve"],
  s: "<b>Joint supply</b> (birlikte arz): bir malı üretmek diğerini de otomatik olarak üretir. Sığır eti için daha çok hayvan kesilince daha çok deri de çıkar. Derinin fiyatı değişmeden her fiyatta daha çok deri arz edilir: deri arz eğrisi <b>sağa kayar</b>. Bu, alternatif ürünler durumunun (buğday-arpa) tam tersidir." },
{ l: 2, q: "In the LONG RUN, which additional reason explains why a higher price leads to more being supplied?",
  o: ["New producers are attracted into the market", "Existing firms are willing to accept higher costs per unit", "Firms switch from producing less profitable goods", "Consumers buy more of the good"],
  s: "Kitap üç neden sayar. <b>Kısa dönemde</b>: (a) yüksek fiyat, daha çok üretmenin getirdiği yüksek birim maliyetleri karşılar; (b) firmalar daha az kârlı mallardan bu mala geçer. <b>Uzun dönemde</b> üçüncü bir neden eklenir: (c) yüksek kâr <b>yeni firmaları piyasaya çeker</b>. Tüketicinin daha çok alması talep tarafıdır." },
{ l: 3, q: "A market's supply function is Qs = −20 + 10P. Production costs rise and it becomes Qs = −40 + 10P. Before the change, 30 units were supplied at a price of £5. What price is now needed to get 30 units supplied?",
  o: ["£7", "£5", "£3", "£9"],
  s: "Eski fonksiyon: P = 5 → Qs = −20 + 50 = 30 (kontrol).<br>Yeni fonksiyon: 30 = −40 + 10P → 10P = 70 → <b>P = £7</b>.<br>Yani aynı miktarı arz ettirmek için fiyatın £2 daha yüksek olması gerekir: arz eğrisi her miktarda <b>£2 yukarı</b> (yani sola) kaymıştır. Bu, maliyet artışının arzı azaltması demektir. £5'te artık sadece −40 + 50 = 10 birim arz edilir." },
{ l: 3, q: "Producers expect the price of their good to rise sharply next month. What is the likely effect on supply THIS month?",
  o: ["Supply falls (shifts left), as producers hold back stocks to sell later at the higher price", "Supply rises, because producers want to sell before prices change", "Nothing, because only the current price affects supply", "Quantity supplied rises along the curve"],
  s: "Beklentiler (expectations of future price changes) arzın belirleyicilerindendir. Fiyat gelecek ay yükselecekse, üreticiler bugün satmak yerine mallarını <b>stoklayıp sonra satmayı</b> tercih eder. Bugünkü fiyat değişmediği halde bugün daha az arz edilir: bu ayın arz eğrisi <b>sola kayar</b>. Bu durum bugünkü fiyatı da yükseltir (beklentinin kendini gerçekleştirmesi, Bölüm 3.2)." },
{ l: 3, q: "A firm can produce either good X or good Y with the same machines. Which of the following would shift the supply curve of good X to the RIGHT?",
  o: ["A fall in the price of good Y", "A rise in the price of good X", "A rise in wages paid to the firm's workers", "A rise in the price of good Y"],
  s: "X ve Y üretimde <b>alternatif</b> ürünlerdir. Y ucuzlarsa Y üretmek daha az kârlı olur, firma makineleri <b>X'e kaydırır</b> → her fiyatta daha çok X arz edilir → X arz eğrisi <b>sağa</b> kayar. Y'nin fiyatı artarsa tam tersi (sola kayma). Ücret artışı maliyeti artırır (sola kayma). X'in kendi fiyatının artması eğri üzerinde harekettir, kayma değil." },
];

Q.t7 = [
{ l: 1, q: "The equilibrium price is the price at which:",
  o: ["Quantity demanded equals quantity supplied", "Firms make the most profit", "The government wants the price to be", "Quantity demanded is greater than quantity supplied"],
  s: "<b>Equilibrium price</b> piyasayı temizleyen (market-clearing) fiyattır: talep edilen miktar = arz edilen miktar (Qd = Qs). Bu fiyatta ne kıtlık ne fazla arz vardır, bu yüzden fiyatın değişme eğilimi yoktur. Grafikte talep ve arz eğrilerinin <b>kesiştiği</b> noktadır." },
{ l: 1, q: "If the market price is above the equilibrium price, there will be:",
  o: ["A surplus, so the price will tend to fall", "A shortage, so the price will tend to rise", "A shortage, so the price will tend to fall", "Equilibrium, so nothing changes"],
  s: "Dengenin üstündeki fiyatta üreticiler çok arz etmek ister, tüketiciler az almak ister: <b>Qs &gt; Qd</b>, yani fazla arz (surplus). Satıcılar mallarını satabilmek için fiyatı düşürür. Fiyat düştükçe Qd artar, Qs azalır, ta ki dengeye gelinene kadar. Dengenin altındaki fiyatta ise kıtlık olur ve fiyat yükselir." },
{ l: 1, q: "If demand for a good increases (and supply does not change), what happens to the equilibrium price and quantity?",
  o: ["Both rise", "Price rises, quantity falls", "Price falls, quantity rises", "Both fall"],
  s: "Talep eğrisi sağa kayar. Eski fiyatta artık Qd &gt; Qs (kıtlık) → fiyat yükselir. Yükselen fiyat arz eğrisi <b>üzerinde</b> yukarı doğru hareketle arz edilen miktarı artırır. Yeni denge: <b>fiyat ↑, miktar ↑</b>. Tablo: D↑ → P↑ Q↑; D↓ → P↓ Q↓; S↑ → P↓ Q↑; S↓ → P↑ Q↓." },
{ l: 2, q: "There is an exceptionally good harvest of potatoes. What happens in the potato market?",
  o: ["Supply increases: price falls and quantity rises", "Demand increases: price and quantity rise", "Supply decreases: price rises and quantity falls", "Demand decreases: price and quantity fall"],
  s: "İyi hasat, rastgele bir şoktur (nature, random shocks) ve <b>arzı</b> etkiler: her fiyatta daha çok patates vardır, arz eğrisi sağa kayar. Eski fiyatta fazla arz oluşur → fiyat düşer → düşen fiyatla talep eğrisi boyunca daha çok alınır. Sonuç: <b>P ↓, Q ↑</b>. Talep değişmemiştir; tüketicilerin daha çok alması eğri üzerinde harekettir." },
{ l: 2, q: "Demand: Qd = 100 − 5P. Supply: Qs = −20 + 10P. What are the equilibrium price and quantity?",
  o: ["P = 8, Q = 60", "P = 6, Q = 70", "P = 10, Q = 50", "P = 12, Q = 40"],
  s: "Dengede Qd = Qs:<br>100 − 5P = −20 + 10P<br>100 + 20 = 10P + 5P → 120 = 15P → <b>P = 8</b><br>Miktar: Qd = 100 − 5(8) = 60. Kontrol: Qs = −20 + 80 = 60 ✓<br>Diğer seçenekler denklemlerden sadece birini sağlıyor (ör. P = 10'da Qd = 50 ama Qs = 80)." },
{ l: 2, q: "In the market Qd = 100 − 5P, Qs = −20 + 10P, suppose the price is £6. What is the situation?",
  o: ["A shortage of 30 units", "A surplus of 30 units", "A shortage of 70 units", "Equilibrium"],
  s: "P = 6'yı iki denkleme de koy:<br>Qd = 100 − 30 = <b>70</b><br>Qs = −20 + 60 = <b>40</b><br>Qd &gt; Qs → <b>kıtlık</b> (shortage) = 70 − 40 = <b>30 birim</b>.<br>Fiyat dengenin (£8) altında olduğu için kıtlık beklenir; bu kıtlık fiyatı £8'e doğru yükseltir. 70, sadece talep edilen miktardır, kıtlık değil." },
{ l: 3, q: "New technology increases supply of a good, and at the same time rising incomes increase demand for it (it is a normal good). What can we say for certain?",
  o: ["Equilibrium quantity rises, but the effect on price is uncertain", "Equilibrium price rises, but the effect on quantity is uncertain", "Both price and quantity rise", "Price falls and quantity rises"],
  s: "Etkileri ayrı ayrı düşün:<br>• Arz artışı: P ↓, Q ↑<br>• Talep artışı: P ↑, Q ↑<br>Miktar iki durumda da artıyor → <b>Q kesin ↑</b>. Fiyatta iki etki ters yönde → hangisinin <b>daha çok kaydığına</b> bağlı → <b>belirsiz</b>. Bilinmeyen kayma büyüklükleriyle sınavda 'kesin' olanı seç. D↑ ve S↓ birlikte olsaydı fiyat kesin artar, miktar belirsiz olurdu." },
{ l: 3, q: "Demand: Qd = 120 − 3P. Supply: Qs = 4P − 20. Demand then increases by 14 units at every price. What are the new equilibrium price and quantity?",
  o: ["P = 22, Q = 68", "P = 20, Q = 60", "P = 22, Q = 74", "P = 24, Q = 62"],
  s: "Başlangıç dengesi: 120 − 3P = 4P − 20 → 140 = 7P → P = 20, Q = 60.<br>Yeni talep: Qd = 134 − 3P (her fiyatta +14).<br>134 − 3P = 4P − 20 → 154 = 7P → <b>P = 22</b>.<br>Q = 134 − 66 = <b>68</b>. Kontrol: Qs = 88 − 20 = 68 ✓<br>Dikkat: miktar 14 değil sadece 8 arttı, çünkü artan fiyat (+2) talep artışının bir kısmını geri aldı. 74, eski eğrinin değil yeni eğrinin yanlış kullanılmasıdır (134 − 3×20)." },
{ l: 3, q: "Over ten years, the price of a good and the quantity sold both rose. A student concludes that the demand curve for the good slopes upwards. What is wrong with this conclusion?",
  o: ["The demand curve has probably shifted over time; the data points lie on different demand curves (the identification problem)", "Nothing; higher prices always cause higher demand", "The student should have used total revenue instead", "Supply curves always slope downwards"],
  s: "Bu, kitabın <b>identification problem</b> (tanımlama sorunu) dediği şeydir. Farklı yıllardaki fiyat-miktar noktaları <b>aynı talep eğrisi üzerinde değildir</b>: on yılda gelir ve zevkler değişmiş, talep eğrisi sağa kaymış olabilir. Talep sağa kayınca fiyat da miktar da artar ve noktaları birleştirmek yanıltıcı biçimde yukarı eğimli bir çizgi verir. Gerçek eğriyi bulmak için diğer belirleyicilerin etkisini ayırmak gerekir." },
];

Q.t8 = [
{ l: 1, q: "If the government sets a maximum price below the equilibrium price, the result is:",
  o: ["A shortage", "A surplus", "No effect", "A rise in the market price"],
  s: "<b>Maximum price</b> (tavan fiyat), fiyatın belli bir seviyeyi geçmesini yasaklar. Dengenin <b>altına</b> konursa, o düşük fiyatta tüketiciler çok almak ister, üreticiler az arz eder: <b>Qd &gt; Qs → kıtlık</b>. Fiyat yükselemediği için kıtlık kapanmaz. Sonuçları: kuyruklar, bekleme listeleri, karne, karaborsa." },
{ l: 1, q: "A minimum price (price floor) set above the equilibrium price will cause:",
  o: ["A surplus", "A shortage", "Rationing", "An underground market selling above the minimum price"],
  s: "<b>Minimum price</b> (taban fiyat) fiyatın belli bir seviyenin altına düşmesini yasaklar. Dengenin <b>üstüne</b> konursa, o yüksek fiyatta üreticiler çok arz eder, tüketiciler az alır: <b>Qs &gt; Qd → fazla arz</b> (surplus). Fiyat düşemediği için fazla kalır. Kıtlık, karne ve karaborsa ise tavan fiyatın sonuçlarıdır." },
{ l: 1, q: "With a maximum price below equilibrium, underground (black) markets are likely to appear. In these markets goods are:",
  o: ["Sold illegally at prices above the maximum price", "Sold legally at the maximum price", "Given away free by the government", "Sold at a price below the maximum price"],
  s: "Tavan fiyat kıtlık yaratır: malı almak isteyip bulamayan insanlar <b>daha fazla ödemeye</b> razıdır. Bu yüzden mal yasadışı olarak <b>tavan fiyatın üstünde</b> satılır: <b>underground market</b> (karaborsa, Box 2.4). Satıcılar kanunu çiğneme riskini bu yüksek fiyat için alır. Örnekler: savaş dönemi gıda karaborsası, bilet karaborsası." },
{ l: 2, q: "Demand: Qd = 200 − 4P. Supply: Qs = 50 + 2P. The government sets a maximum price of £20. What is the shortage?",
  o: ["30 units", "20 units", "120 units", "No shortage, because £20 is above the equilibrium"],
  s: "Önce dengeyi bul: 200 − 4P = 50 + 2P → 150 = 6P → P* = £25, Q* = 100.<br>£20 dengenin <b>altında</b>, yani tavan etkili.<br>P = 20'de: Qd = 200 − 80 = <b>120</b>, Qs = 50 + 40 = <b>90</b>.<br>Kıtlık = 120 − 90 = <b>30 birim</b>.<br>120 sadece talep edilen miktardır. Dikkat: tavan fiyatta satılan miktar <b>arz edilen miktar</b> kadardır (90), çünkü üreticiler fazlasını üretmez." },
{ l: 2, q: "The government sets a maximum price ABOVE the equilibrium price. What is the effect?",
  o: ["No effect: the market stays at its equilibrium", "A shortage", "A surplus", "The price rises to the maximum price"],
  s: "Tavan fiyat sadece fiyatın <b>yükselmesini</b> engeller. Denge fiyatı zaten tavanın altındaysa piyasa dengede kalır ve tavan hiçbir şeyi değiştirmez: <b>etkisizdir</b> (non-binding). Fiyatın tavana kadar çıkması için bir neden yoktur; çıksaydı fazla arz olur ve fiyat geri düşerdi. Aynı mantık: dengenin altına konan taban fiyat da etkisizdir." },
{ l: 2, q: "Which is a main reason why governments set minimum prices for agricultural products?",
  o: ["To protect the incomes of farmers", "To make food cheaper for consumers", "To eliminate food surpluses", "To create shortages"],
  s: "Kitaba göre taban fiyatın amaçları: <b>üreticilerin gelirini korumak</b> ve ileride arz düşerse kullanılmak üzere <b>stok oluşturmak</b>. Taban fiyat fiyatı yükseltir (tüketiciye pahalı), fazla arz yaratır (fazlayı yok etmez, oluşturur). Kıtlık yaratan tavan fiyattır. Gerçek örnek: AB'nin Ortak Tarım Politikası (Bölüm 3.5)." },
{ l: 3, q: "Demand: Qd = 200 − 4P. Supply: Qs = 50 + 2P. The government sets a minimum price of £30 and buys up any surplus. How much does it spend?",
  o: ["£900", "£3,300", "£750", "£2,400"],
  s: "Denge P* = £25 olduğu için £30 tabanı etkilidir.<br>P = 30'da: Qd = 200 − 120 = <b>80</b>, Qs = 50 + 60 = <b>110</b>.<br>Fazla arz = 110 − 80 = <b>30 birim</b>.<br>Devlet fazlayı £30'dan alıyor: 30 × £30 = <b>£900</b>.<br>£3,300 tüm üretimin (110 × 30) değeridir; £2,400 tüketicilerin ödediğidir (80 × 30). Devletin bu fazlayla ne yapacağı (depolama, imha, ihracat) ayrı bir sorundur." },
{ l: 3, q: "In the market Qd = 200 − 4P, Qs = 50 + 2P, a maximum price of £20 is set. If all the units supplied are resold on an underground market, what is the highest price they could fetch?",
  o: ["£27.50", "£20", "£25", "£30"],
  s: "Tavan fiyatta üreticiler sadece Qs = 50 + 2(20) = <b>90 birim</b> arz eder.<br>Karaborsada bu 90 birimin alıcı bulabileceği en yüksek fiyat, talep eğrisinde Qd = 90 olan fiyattır:<br>200 − 4P = 90 → 4P = 110 → <b>P = £27.50</b>.<br>İlginç sonuç: karaborsa fiyatı, serbest piyasa denge fiyatından (£25) bile <b>yüksektir</b>, çünkü tavan fiyat arzı 100'den 90'a düşürmüştür. Tavan fiyat bazı tüketicilerin daha fazla ödemesine yol açabilir." },
{ l: 3, q: "A minimum wage is set above the equilibrium wage in a competitive labour market. What does simple supply and demand analysis predict?",
  o: ["The quantity of labour supplied exceeds the quantity demanded, causing unemployment", "Firms demand more workers because they must pay more", "A shortage of workers", "No change in employment"],
  s: "Asgari ücret, emek piyasasında bir <b>taban fiyattır</b>. İşgücü piyasasında arz eden hanehalkı, talep eden firmalardır. Dengenin üstündeki ücrette daha çok insan çalışmak ister (Qs ↑), firmalar ise daha az işçi almak ister (Qd ↓): <b>emek fazlası</b> = <b>işsizlik</b>. Basit model bunu öngörür; gerçekte etkisi tartışmalıdır (Bölüm 9'da işlenir). Kıtlık, dengenin altındaki ücretle olurdu." },
];

Q.t9 = [
{ l: 1, q: "Price elasticity of demand is measured as:",
  o: ["Percentage change in quantity demanded ÷ percentage change in price", "Percentage change in price ÷ percentage change in quantity demanded", "Change in quantity demanded ÷ change in price", "Price × quantity"],
  s: "<b>PED = %ΔQd / %ΔP</b>. Miktar her zaman <b>payda değil pay</b>dadır (üstte). Yüzde değişim kullanılır, mutlak değişim değil, çünkü böylece ölçü birimlerinden (kg, litre, ₺) bağımsız olur. P × Q toplam gelirdir (total revenue)." },
{ l: 1, q: "Demand is price elastic when:",
  o: ["Quantity demanded changes by a larger percentage than price", "Quantity demanded changes by a smaller percentage than price", "Quantity demanded does not change when price changes", "Price and quantity change by the same percentage"],
  s: "İşareti göz ardı ederek:<br>• <b>|PED| &gt; 1 → elastic</b> (esnek): miktar fiyattan oransal olarak <b>daha çok</b> değişir.<br>• |PED| &lt; 1 → inelastic: miktar daha az değişir.<br>• |PED| = 1 → unit elastic: aynı oranda.<br>• Miktar hiç değişmezse (PED = 0) perfectly inelastic." },
{ l: 1, q: "The price of a good falls by 10% and the quantity demanded rises by 20%. The price elasticity of demand is:",
  o: ["−2 (elastic)", "−0.5 (inelastic)", "+2 (elastic)", "−1 (unit elastic)"],
  s: "PED = %ΔQd / %ΔP = +20% / −10% = <b>−2</b>.<br>Talep eğrisi aşağı indiği için fiyat ve miktar ters yönde hareket eder, PED <b>negatiftir</b>. Mutlak değer 2 &gt; 1 olduğu için talep <b>esnektir</b>. −0.5, formülü ters kurarak (fiyat/miktar) bulunur." },
{ l: 2, q: "Demand for a product is price elastic. If the firm raises its price, its total revenue will:",
  o: ["Fall", "Rise", "Stay the same", "Rise only if costs fall"],
  s: "Toplam gelir TR = P × Q. Esnek talepte fiyat artışı, miktarda <b>oransal olarak daha büyük</b> bir düşüşe yol açar. Fiyattaki kazanç, kaybedilen satışlardan küçük kalır → <b>TR düşer</b>.<br>Kural: <b>esnek</b> → fiyat ve TR <b>ters</b> yönde; <b>esnek değil</b> → fiyat ve TR <b>aynı</b> yönde; birim esnek → TR değişmez. Maliyetler TR'yi etkilemez (kârı etkiler)." },
{ l: 2, q: "Which of the following is likely to have the MOST price-elastic demand?",
  o: ["One particular brand of petrol", "Petrol in general", "Salt", "Insulin for diabetics"],
  s: "Talep esnekliğinin en önemli belirleyicisi <b>ikamelerin sayısı ve yakınlığıdır</b>. Belli bir marka benzinin çok yakın ikameleri var: diğer markalar. Fiyatı biraz artarsa müşteriler hemen başka istasyona gider. Genel olarak benzinin ise yakın ikamesi yoktur (esnek değil). Tuz gelir içinde çok küçük pay tutar, insülin hayati bir ihtiyaçtır: ikisi de çok esnek değildir." },
{ l: 2, q: "The price of a good rises from £4 to £6 and quantity demanded falls from 20 to 10 units. Using the arc (mid-point) formula, what is the price elasticity of demand?",
  o: ["−1.67", "−1", "−2", "−0.6"],
  s: "Orta nokta formülü: PED = (ΔQ / ortalama Q) ÷ (ΔP / ortalama P)<br>ΔQ = 10 − 20 = −10; ortalama Q = (20 + 10)/2 = 15 → −10/15 = −0.667<br>ΔP = 6 − 4 = 2; ortalama P = (4 + 6)/2 = 5 → 2/5 = 0.4<br>PED = −0.667 / 0.4 = <b>−1.67</b> (esnek).<br>Başlangıç değerlerini kullansaydın (−50% / +50%) −1 bulurdun; bu yüzden kitap orta noktayı kullanır: yön fark etmeksizin aynı sonucu verir. −0.6 ters kurulmuş formüldür." },
{ l: 3, q: "A bus company faces a price elasticity of demand of −0.4. It raises fares by 10%. By approximately what percentage does its total revenue change?",
  o: ["Rises by about 5.6%", "Falls by about 4%", "Rises by 10%", "Falls by about 5.6%"],
  s: "PED = −0.4 → fiyat %10 artınca yolcu sayısı %0.4 × 10 = <b>%4 düşer</b>.<br>Yeni TR / eski TR = 1.10 × 0.96 = 1.056 → TR yaklaşık <b>%5.6 artar</b>.<br>(Kısa yol: yaklaşık %10 − %4 = %6.)<br>Talep esnek olmadığı (|−0.4| &lt; 1) için fiyat artışı geliri artırır. Kitaptaki Box 3.2 (otobüs fiyatlaması) bu mantığı tartışır. '%4 düşer' sadece yolcu sayısındaki değişimdir." },
{ l: 3, q: "The demand curve is Qd = 100 − 5P. At what price is total revenue maximised, and what is the price elasticity of demand there?",
  o: ["P = £10, PED = −1", "P = £20, PED = 0", "P = £5, PED = −0.33", "P = £10, PED = −2"],
  s: "Doğrusal talep eğrisinde TR, <b>birim esnek</b> noktada (|PED| = 1) en büyüktür; bu nokta eğrinin ortasıdır.<br>Eğri P = 0'da Q = 100'e, Q = 0'da P = 20'ye ulaşır → orta nokta P = <b>£10</b>, Q = 50.<br>Nokta esnekliği: PED = (dQ/dP) × (P/Q) = −5 × (10/50) = <b>−1</b> ✓<br>TR = 10 × 50 = 500. Kontrol: P = 9 → 9 × 55 = 495; P = 11 → 11 × 45 = 495, ikisi de daha az.<br>Orta noktanın üstünde esnek (fiyatı düşürmek TR'yi artırır), altında esnek değil." },
{ l: 3, q: "Which statement about a straight-line (linear) downward-sloping demand curve is correct?",
  o: ["Its slope is constant, but its price elasticity falls (in absolute value) as price falls", "Its elasticity is the same at every point because its slope is constant", "It is elastic at low prices and inelastic at high prices", "It is unit elastic everywhere"],
  s: "Eğim (ΔP/ΔQ) sabittir ama esneklik <b>yüzde</b> değişimlere bakar: PED = (ΔQ/ΔP) × (P/Q). Eğri boyunca aşağı indikçe P küçülür, Q büyür, P/Q oranı düşer → |PED| düşer.<br>• Üst kısım (yüksek P, düşük Q): <b>esnek</b><br>• Orta nokta: birim esnek<br>• Alt kısım: <b>esnek değil</b><br>Bu yüzden 'eğim = esneklik' yanlış bir eşitliktir. Her yerde birim esnek olan eğri doğru değil, eğri (dikdörtgen hiperbol) olurdu." },
];

Q.t10 = [
{ l: 1, q: "If the income elasticity of demand for a good is negative, the good is:",
  o: ["An inferior good", "A normal good", "A luxury good", "A complement"],
  s: "<b>YED = %ΔQd / %ΔY</b>. Gelir artınca talep düşüyorsa YED <b>negatiftir</b> → <b>inferior good</b> (düşük mal). YED pozitifse normal mal; YED &gt; 1 ise gelir esnek (lüks) mal. Tamamlayıcılık çapraz esneklikle ölçülür, gelir esnekliğiyle değil." },
{ l: 1, q: "A positive cross-price elasticity of demand between two goods shows that they are:",
  o: ["Substitutes", "Complements", "Inferior goods", "Unrelated"],
  s: "<b>XED = %ΔQd(A) / %ΔP(B)</b>. Pozitif: B'nin fiyatı artınca A'nın talebi de <b>artıyor</b> → insanlar B'den A'ya geçiyor → <b>ikame</b> (Coca-Cola ve Pepsi). Negatif: B pahalanınca A'nın talebi düşüyor → <b>tamamlayıcı</b> (araba ve benzin). Sıfıra yakın: ilişkisiz mallar." },
{ l: 1, q: "A perfectly inelastic supply curve is:",
  o: ["Vertical", "Horizontal", "Upward sloping through the origin", "Downward sloping"],
  s: "Perfectly inelastic (PES = 0): fiyat ne olursa olsun arz edilen miktar değişmez → eğri <b>dikeydir</b>. Örnek: bir konser salonundaki koltuk sayısı ya da balıkçının o gün tuttuğu balık (anlık dönem). Yatay arz eğrisi perfectly elastic arz demektir (PES = ∞)." },
{ l: 2, q: "Consumers' incomes rise by 5% and the demand for foreign holidays rises by 10%. Foreign holidays are:",
  o: ["A normal good with income-elastic demand (YED = 2)", "A normal good with income-inelastic demand (YED = 0.5)", "An inferior good (YED = −2)", "A good with unit income elasticity"],
  s: "YED = %ΔQd / %ΔY = 10% / 5% = <b>+2</b>.<br>Pozitif → <b>normal mal</b>. 1'den büyük → <b>gelir esnek</b> (income elastic): talep gelirden oransal olarak daha hızlı artıyor. Bu tür mallara genelde 'lüks' denir. 0.5, formülü ters kurmaktır (gelir/miktar). Sınavda işarete dikkat: gelir esnekliğinde işaret önemlidir." },
{ l: 2, q: "The price of good B rises by 10% and, as a result, the quantity demanded of good A falls by 5%. The cross-price elasticity of demand for A with respect to B is:",
  o: ["−0.5, so A and B are complements", "+0.5, so A and B are substitutes", "−2, so A and B are complements", "−0.5, so A and B are substitutes"],
  s: "XED = %ΔQd(A) / %ΔP(B) = −5% / +10% = <b>−0.5</b>.<br>Negatif: B pahalanınca A da az alınıyor → birlikte tüketiliyorlar → <b>tamamlayıcı</b> (ör. yazıcı ve kartuş). −2, payı ve paydayı ters koymaktır. 'Negatif ama ikame' seçeneği işaret kuralını karıştırıyor." },
{ l: 2, q: "Why is the price elasticity of supply usually greater in the long run than in the short run?",
  o: ["Firms have more time to adjust production, build capacity, and new firms can enter", "Consumers have more time to find substitutes", "Costs always fall over time", "Governments reduce taxes in the long run"],
  s: "Arz esnekliğinin ana belirleyicisi <b>zamandır</b>.<br>• <b>Anlık dönem</b> (immediate): üretim değiştirilemez, arz dikeye yakın.<br>• <b>Kısa dönem</b>: mevcut fabrika daha yoğun çalıştırılır (fazla mesai), arz biraz esner.<br>• <b>Uzun dönem</b>: yeni fabrikalar kurulur, <b>yeni firmalar girer</b>, arz en esnek hâlini alır.<br>Tüketicilerin ikame bulması talep esnekliğiyle ilgilidir, arzla değil." },
{ l: 3, q: "The income elasticity of demand for food is 0.4. If national income grows by 3% a year, by how much will demand for food grow each year (ceteris paribus)?",
  o: ["1.2%", "7.5%", "3.4%", "0.13%"],
  s: "YED = %ΔQd / %ΔY → %ΔQd = YED × %ΔY = 0.4 × 3% = <b>1.2%</b>.<br>Gıda <b>normal ama gelir esnek olmayan</b> bir maldır (0 &lt; YED &lt; 1): gelir artınca gıda talebi artar ama daha yavaş. Bu, Bölüm 3.5'teki tarım sorununun temelidir: gıda talebi yavaş büyür, arz ise teknolojiyle hızla büyür, bu yüzden tarım fiyatları ve çiftçi gelirleri uzun dönemde düşme eğilimindedir. 7.5 = 3/0.4 (ters işlem)." },
{ l: 3, q: "When the price of a good rises from £10 to £12, the quantity supplied rises from 100 to 110 units. Using the arc (mid-point) formula, the price elasticity of supply is approximately:",
  o: ["0.52 (inelastic)", "1.91 (elastic)", "0.5 (inelastic)", "2 (elastic)"],
  s: "PES = (ΔQ / ortalama Q) ÷ (ΔP / ortalama P)<br>ΔQ = 10; ortalama Q = (100 + 110)/2 = 105 → 10/105 = 0.0952<br>ΔP = 2; ortalama P = (10 + 12)/2 = 11 → 2/11 = 0.1818<br>PES = 0.0952 / 0.1818 = <b>0.52</b><br>1'den küçük → arz <b>esnek değil</b>: miktar fiyattan oransal olarak daha az arttı. 0.5, başlangıç değerleriyle bulunan (%10 / %20) cevaptır. 1.91 ters kurulmuş formüldür. Arz esnekliği pozitiftir çünkü fiyat ve miktar aynı yönde hareket eder." },
{ l: 3, q: "The cross-price elasticity of demand for good X with respect to the price of good Y is +1.5. If the price of Y falls by 4%, what happens to the demand for X?",
  o: ["It falls by 6%", "It rises by 6%", "It falls by 2.7%", "It rises by 1.5%"],
  s: "%ΔQd(X) = XED × %ΔP(Y) = +1.5 × (−4%) = <b>−6%</b>.<br>XED pozitif → X ve Y <b>ikamedir</b>. Y ucuzlayınca insanlar X'ten Y'ye geçer, X'in talebi düşer. Mantık kontrolü: ikame ucuzlarsa senin malın daha az satılır ✓. 2.7 = 4/1.5 (ters işlem). İşaret kuralını kullanarak her zaman sonucun yönünü kontrol et." },
];

<script>
Q.t11 = [
{ l: 1, q: "Compared with the long run, short-run demand and supply are generally:",
  o: ["Less price elastic", "More price elastic", "Equally price elastic", "Perfectly elastic"],
  s: "Üreticiler ve tüketiciler fiyat değişimine tam uyum sağlamak için <b>zaman</b> ister. Kısa dönemde alışkanlıklar ve mevcut üretim kapasitesi sabittir, bu yüzden talep ve arz <b>daha az esnektir</b>. Zaman geçtikçe tüketiciler ikame bulur, üreticiler kapasite kurar ve yeni firmalar girer: esneklik artar." },
{ l: 1, q: "Speculation tends to STABILISE prices when people believe that:",
  o: ["Current price changes are only temporary", "Prices will keep moving in the same direction", "Prices will never change", "The government will fix prices"],
  s: "Fiyat düşüşünün <b>geçici</b> olduğuna inanan insanlar 'nasılsa geri yükselecek' diye <b>şimdi alır</b> ve fiyat düşüşü yavaşlar. Fiyat geçici olarak yükselirse 'nasılsa düşecek' diye satarlar, yükseliş frenlenir. Sonuç: dalgalanmalar azalır, buna <b>stabilising speculation</b> denir. Fiyatın aynı yönde devam edeceği beklentisi ise istikrarı bozar." },
{ l: 1, q: "In economics, the difference between risk and uncertainty is that with risk:",
  o: ["The probabilities of the possible outcomes are known", "The outcome is known for certain", "The probabilities are unknown", "There is no chance of a loss"],
  s: "<b>Risk</b>: olası sonuçların <b>olasılıkları bilinir</b> (ör. geçmiş verilerden, bir çiftçi her 10 yılda bir kuraklık olduğunu bilir). <b>Uncertainty</b> (belirsizlik): olasılıklar <b>bilinmez</b> (ör. yeni bir teknolojinin başarısı). Her iki durumda da sonuç kesin değildir ve kayıp mümkündür." },
{ l: 2, q: "Demand for a good increases. Compared with the long run, the short-run effect is likely to be:",
  o: ["A bigger rise in price and a smaller rise in quantity", "A smaller rise in price and a bigger rise in quantity", "No change in price", "A fall in price"],
  s: "Kısa dönemde arz <b>daha az esnektir</b> (dik). Talep sağa kayınca üreticiler hızla daha çok üretemez, bu yüzden etki çoğunlukla <b>fiyata</b> yansır. Uzun dönemde arz esnekleşir (yeni kapasite, yeni firmalar), bu yüzden etki daha çok <b>miktara</b> yansır ve fiyat kısmen geri düşer. Kitabın kuralı: kaymaların kısa dönemde fiyata, uzun dönemde miktara görece daha büyük etkisi vardır." },
{ l: 2, q: "House prices have been rising. Buyers rush to buy before prices rise further, and sellers delay selling hoping for higher prices. This is an example of:",
  o: ["Destabilising speculation", "Stabilising speculation", "The identification problem", "A buffer stock policy"],
  s: "İnsanlar fiyatın <b>aynı yönde devam edeceğini</b> bekliyor. Alıcılar şimdi alıyor → talep sağa kayar. Satıcılar bekliyor → arz sola kayar. İkisi birlikte fiyatı <b>daha da</b> yükseltir: beklenti kendi kendini gerçekleştirir ve dalgalanma büyür. Buna <b>destabilising speculation</b> denir (konut balonları, borsa balonları ve sonrasındaki çöküşler)." },
{ l: 2, q: "How can holding stocks help to reduce the problems of uncertain future prices?",
  o: ["Stocks are built up when prices are low and sold when prices are high, reducing price fluctuations", "Stocks are sold when prices are low to push them lower", "Holding stocks always increases price fluctuations", "Stocks are only used to raise prices permanently"],
  s: "Kitaba göre gelecek fiyat belirsizliğine karşı bir yol <b>stok tutmaktır</b>: fiyatlar düşükken (bol arz) stok biriktirilir, bu da talebi artırıp fiyat düşüşünü sınırlar; fiyatlar yüksekken stok satılır, bu da arzı artırıp fiyat artışını sınırlar. Sonuç: <b>daha az dalgalanma</b>. Bu fikir tarımda devletin <b>tampon stok</b> (buffer stock) politikasına temel oluşturur (Bölüm 3.5)." },
{ l: 3, q: "Oil supplies are suddenly cut. Taking account of the time dimension, which pattern of oil prices is most likely?",
  o: ["Prices rise sharply at first, then fall back partly as demand and supply become more elastic over time", "Prices rise slowly at first and then much faster in the long run", "Prices fall in the short run and rise in the long run", "Prices rise by the same amount in the short and long run"],
  s: "Kısa dönemde petrol talebi ve arzı <b>çok az esnektir</b>: insanlar yine işe arabayla gider, yeni petrol sahası hemen açılamaz. Arz düşünce fiyat <b>çok sert</b> yükselir. Zamanla tüketiciler yakıt tasarruflu araba alır, toplu taşımaya geçer (talep esnekleşir); yeni sahalar ve alternatif enerji devreye girer (arz esnekleşir). Bu yüzden fiyat ilk zirvesinden <b>kısmen geri düşer</b>. 1973 ve 1979 petrol krizlerinde bu görüldü; IR açısından da önemli bir örnek." },
{ l: 3, q: "What is the main purpose of a futures contract for a wheat farmer who agrees today to sell her harvest in six months' time at a fixed price?",
  o: ["To reduce the risk caused by uncertainty about future prices", "To make sure she gets the highest possible price", "To avoid paying taxes", "To increase the price of wheat"],
  s: "<b>Futures market</b> (vadeli işlem piyasası, Box 3.5): bugünden, gelecekteki bir tarihte <b>sabit bir fiyattan</b> alım ya da satım anlaşması yapılır. Çiftçi altı ay sonraki fiyatı bugünden bildiği için plan ve yatırım yapabilir: <b>fiyat belirsizliğinin riski</b> azalır. Karşılığında, fiyat yükselirse o kazancı kaçırır, yani en yüksek fiyatı garantilemez. Riski üstlenen taraf genelde bir spekülatördür." },
{ l: 3, q: "A speculator borrows 1,000 shares and sells them at £10 each. The share price then falls to £7, and she buys 1,000 shares back to return them. Ignoring fees, what is her profit, and what is this called?",
  o: ["£3,000, short selling", "£7,000, short selling", "£3,000, a futures contract", "A loss of £3,000, short selling"],
  s: "<b>Short selling</b> (açığa satış, Box 3.4): sahip olmadığın hisseleri <b>ödünç alıp</b> satarsın, fiyat düşünce ucuza geri alıp iade edersin.<br>Satış geliri: 1,000 × £10 = £10,000<br>Geri alım maliyeti: 1,000 × £7 = £7,000<br>Kâr: £10,000 − £7,000 = <b>£3,000</b> (hisse başına £3).<br>Fiyat yükselseydi zarar ederdi. Çok sayıda açığa satış fiyatı daha da aşağı itebilir: bu, istikrarı bozan spekülasyonun bir biçimidir (2008 krizinde bazı ülkeler geçici olarak yasakladı)." },
];

Q.t12 = [
{ l: 1, q: "A specific tax is:",
  o: ["A fixed amount of tax per unit sold", "A percentage of the price of the good", "A tax on income", "A tax paid only by consumers"],
  s: "<b>Specific tax</b>: satılan her birim için <b>sabit bir miktar</b> (ör. litre benzin başına X ₺, bir paket sigara başına Y ₺). <b>Ad valorem tax</b> ise fiyatın ya da katma değerin <b>yüzdesidir</b> (KDV gibi). Gelir vergisi dolaylı değil doğrudan bir vergidir. Vergiyi kimin 'ödediği' (yük, incidence) esnekliklere bağlıdır." },
{ l: 1, q: "Value added tax (VAT) is an example of:",
  o: ["An ad valorem tax", "A specific tax", "A direct tax on income", "A subsidy"],
  s: "KDV (VAT), fiyatın ya da üretimin her aşamasındaki katma değerin <b>yüzdesi</b> olarak alınır, bu yüzden <b>ad valorem</b> (değer üzerinden) bir vergidir. Mal ne kadar pahalıysa vergi tutarı o kadar büyüktür. Sigara ve alkol üzerindeki özel tüketim vergilerinin (excise duties) bir kısmı ise birim başınadır (specific)." },
{ l: 1, q: "When a specific tax of £2 per unit is imposed on producers of a good, the supply curve:",
  o: ["Shifts upwards (left) by £2 at every quantity", "Shifts downwards by £2", "Does not move; the demand curve shifts", "Becomes vertical"],
  s: "Üreticiler her birim için devlete £2 ödemek zorundadır. Aynı miktarı arz etmeye razı olmaları için fiyatın her miktarda <b>£2 daha yüksek</b> olması gerekir. Bu yüzden arz eğrisi vergi kadar <b>paralel olarak yukarı</b> kayar (aynı şey: sola kayar). Talep eğrisi değişmez; tüketicilerin isteği aynıdır." },
{ l: 2, q: "A tax is imposed on a good with very price-INELASTIC demand. Who bears most of the tax?",
  o: ["Consumers", "Producers", "The government", "It is always shared equally"],
  s: "Talep esnek değilse tüketiciler fiyat artınca da almaya devam eder (ikame yok). Üreticiler vergiyi fiyata yansıtabilir, satışlar fazla düşmez. Bu yüzden yükün çoğu <b>tüketicilerde</b> kalır. Kitabın kuralı: talep <b>ne kadar az esnek</b> ve arz <b>ne kadar esnekse</b>, tüketici yükü o kadar büyüktür. Kısaca: <b>daha az esnek olan taraf yükü taşır</b>." },
{ l: 2, q: "Government tax revenue from an indirect tax will be highest (for a given tax rate) when:",
  o: ["Both demand and supply are price inelastic", "Both demand and supply are price elastic", "Demand is elastic and supply is inelastic", "Demand is perfectly elastic"],
  s: "Vergi geliri = vergi × satılan miktar. Vergi fiyatı yükseltir ve miktarı düşürür. Talep ve arz <b>esnek değilse</b> miktar <b>çok az düşer</b>, vergi geniş bir miktar tabanından alınır → gelir yüksek. Esnek olduklarında miktar çok düşer ve vergi tabanı erir. Bu yüzden devletler sigara, alkol, akaryakıt gibi esnek olmayan talepli malları yüksek vergilendirir." },
{ l: 2, q: "If demand for a good is perfectly inelastic, a specific tax of £1 per unit will cause the price paid by consumers to rise by:",
  o: ["£1, the full amount of the tax", "Nothing", "50p", "More than £1"],
  s: "Talep tamamen esnek değil (dikey talep eğrisi): fiyat ne olursa olsun tüketiciler aynı miktarı alır. Arz eğrisi £1 yukarı kayınca, yeni denge aynı miktarda ama <b>tam £1 yüksek</b> fiyattadır. Tüketiciler verginin <b>tamamını</b> öder, üreticinin eline geçen fiyat değişmez. Tersine, talep tamamen esnek (yatay) olsaydı tüm yük üreticide kalırdı." },
{ l: 3, q: "Demand: Qd = 100 − 5P. Supply: Qs = −20 + 10P. A specific tax of £3 per unit is imposed on producers. What price do consumers now pay, and what price do producers receive after tax?",
  o: ["Consumers pay £10; producers receive £7", "Consumers pay £11; producers receive £8", "Consumers pay £9; producers receive £6", "Consumers pay £8; producers receive £5"],
  s: "Vergiden önce denge: P = 8, Q = 60 (bkz. konu 2.3).<br>Vergiden sonra üretici, tüketicinin ödediği P'den eline P − 3 alır:<br>Qs = −20 + 10(P − 3) = −50 + 10P<br>Denge: 100 − 5P = −50 + 10P → 150 = 15P → <b>Pc = £10</b><br>Üretici fiyatı: Pp = 10 − 3 = <b>£7</b>. Yeni miktar Q = 100 − 50 = 50.<br>Tüketici £2 daha fazla öder (8 → 10), üretici £1 daha az alır (8 → 7). £3'lük verginin 2/3'ü tüketicide, çünkü bu piyasada talep arzdan daha az esnek. £11/£8 seçeneği, vergi tamamen tüketiciye yansımış gibi düşünür." },
{ l: 3, q: "In the same market (Qd = 100 − 5P, Qs = −20 + 10P, tax £3 per unit), how much tax revenue does the government collect, and how much of it is effectively paid by consumers?",
  o: ["Revenue £150, of which consumers pay £100", "Revenue £180, of which consumers pay £120", "Revenue £150, of which consumers pay £50", "Revenue £180, of which consumers pay £60"],
  s: "Vergiden sonra miktar Q = 50 (önceki soru).<br>Vergi geliri = t × Q = £3 × 50 = <b>£150</b>.<br>Tüketicinin payı: birim başına (Pc − P₀) = 10 − 8 = £2 → 2 × 50 = <b>£100</b>.<br>Üreticinin payı: birim başına (P₀ − Pp) = 8 − 7 = £1 → 1 × 50 = £50.<br>£180, vergiden önceki miktarı (60) kullanmaktır: vergi miktarı düşürdüğü için yanlıştır." },
{ l: 3, q: "A government wants to use a tax on cigarettes both to raise a lot of revenue AND to cut smoking substantially. Given that demand for cigarettes is price inelastic, what problem does it face?",
  o: ["The goals conflict: inelastic demand means high revenue but only a small fall in smoking", "There is no problem: inelastic demand means smoking falls sharply and revenue rises", "Inelastic demand means the tax raises very little revenue", "The tax will be borne entirely by producers"],
  s: "Talep esnek değil → vergi fiyatı yükseltse de içiciler büyük ölçüde içmeye devam eder. Sonuç: <b>yüksek vergi geliri</b> ama tüketimde <b>küçük düşüş</b>. Tüketim çok düşseydi gelir de düşerdi; yani iki hedef birbirine <b>terstir</b>. Box 3.6 bir de ahlaki ikilemi tartışır: sigara vergisi yoksulları daha çok etkiler (gelirlerinin daha büyük kısmı), yani <b>regresif</b> olabilir. Esnek olmayan talep yükü üreticiye değil tüketiciye bindirir." },
];

Q.t13 = [
{ l: 1, q: "Providing a service such as hospital treatment free at the point of delivery is similar in its effects to:",
  o: ["A maximum price of zero", "A minimum price above equilibrium", "A tax on the service", "A rise in supply"],
  s: "Kitaba göre analiz bir <b>tavan fiyata</b> benzer, ama tavan fiyat <b>sıfırdır</b>. Fiyat sıfırken talep edilen miktar çok yüksektir ve genellikle sunulabilecek miktarı aşar. Bu yüzden tavan fiyattaki gibi bir <b>kıtlık</b> oluşur." },
{ l: 1, q: "What is the likely result of providing health care free to patients?",
  o: ["Demand exceeds supply, leading to waiting lists", "Supply exceeds demand, leading to empty hospitals", "Prices rise to clear the market", "Demand falls because the service is free"],
  s: "Fiyat sıfırsa insanlar daha fazla tedavi talep eder. Arz (doktor, yatak) sınırlıdır. Fiyat yükselip piyasayı temizleyemediği için <b>Qd &gt; Qs</b> → kıtlık, <b>bekleme listeleri</b> (waiting lists) ve ihtiyaca göre öncelik. Kitap sağlıkta talebin hızla büyüdüğünü (yaşlanan nüfus, yeni ve pahalı tedaviler) ve sorunun giderek büyüdüğünü belirtir." },
{ l: 1, q: "If the government prohibits a product such as certain drugs, what is likely to happen?",
  o: ["An illegal market will develop", "Consumption will fall to zero", "The price will fall to zero", "Supply will increase"],
  s: "Yasak, malın arzını ve talebini ortadan kaldırmaz; sadece yasadışı hâle getirir. Hâlâ almak isteyenler ve yüksek kâr için risk alan satıcılar olduğu için <b>yasadışı bir piyasa</b> (illegal market) gelişir. Tüketim genelde serbest piyasaya göre düşer ama sıfıra inmez." },
{ l: 2, q: "For a type of hospital treatment, demand is Qd = 600 − 20P and the hospital can supply a fixed 400 treatments. If treatment is free, what is the shortage?",
  o: ["200 treatments", "400 treatments", "600 treatments", "No shortage"],
  s: "Ücretsiz → P = 0.<br>Qd = 600 − 20(0) = <b>600</b> tedavi talep edilir.<br>Qs = <b>400</b> (sabit).<br>Kıtlık = 600 − 400 = <b>200 tedavi</b>. Bu 200 kişi bekleme listesine girer ya da başka yollarla (ihtiyaç önceliği, özel hastane) karşılanır. 600 talep, 400 arzdır; ikisi de kıtlık değildir." },
{ l: 2, q: "Compared with a free market, how are demand and supply affected when a drug is made illegal?",
  o: ["Both demand and supply are lower", "Both demand and supply are higher", "Demand is higher, supply is lower", "Neither changes"],
  s: "Yasak hem alıcıları hem satıcıları cezalandırır. Bazı kullanıcılar ceza riski ve ahlaki/sosyal baskı yüzünden almaktan vazgeçer → <b>talep sola</b> kayar. Bazı satıcılar hapis riski yüzünden piyasadan çıkar ve satışın maliyeti artar → <b>arz sola</b> kayar. Kitaba göre sonuçta hem talep hem arz serbest piyasadakinden <b>düşüktür</b>, bu yüzden satılan miktar azalır." },
{ l: 2, q: "Under prohibition, penalties on SUPPLIERS are very harsh and they are likely to be caught, while users face small penalties. Compared with a free market, the price is likely to be:",
  o: ["Higher, because supply falls much more than demand", "Lower, because demand falls much more than supply", "The same, because both curves shift equally", "Zero, because the product is illegal"],
  s: "Kitabın kuralı: fiyatın daha yüksek mi düşük mü olacağı, <b>kimin daha ağır cezayla ve daha yüksek yakalanma olasılığıyla</b> karşılaştığına bağlıdır. Burada risk satıcılarda → <b>arz çok sola</b> kayar, talep az kayar → fiyat serbest piyasadakinden <b>daha yüksek</b> olur. Ceza ağırlıkla kullanıcılara uygulansaydı talep daha çok düşer ve fiyat daha düşük olabilirdi." },
{ l: 3, q: "For the treatment with demand Qd = 600 − 20P and fixed supply of 400, what price would eliminate the waiting list, and why might the government still not charge it?",
  o: ["£10; many people believe access to health care should depend on need, not ability to pay", "£20; because the hospital would make a loss", "£30; because demand would fall to zero", "£10; because charging would increase the waiting list"],
  s: "Bekleme listesini kaldıran fiyat, piyasayı temizleyen fiyattır: Qd = Qs<br>600 − 20P = 400 → 20P = 200 → <b>P = £10</b>.<br>Bu fiyatta 400 kişi tedavi olur, liste kalmaz. Peki neden alınmaz? Kitaba göre çoğu insan sağlık ve eğitimin bir <b>hak</b> olduğunu, erişimin <b>ödeme gücüne değil ihtiyaca</b> bağlı olması gerektiğini düşünür (yoksullar tedaviden mahrum kalmamalı). Ayrıca sağlık ve eğitim herkese fayda sağlar. Bu bir <b>normatif</b> tercihtir." },
{ l: 3, q: "Which statement correctly compares using a tax with using a ban (prohibition) to reduce consumption of a harmful product?",
  o: ["Both can reduce consumption, but a tax raises revenue and keeps the market legal, whereas a ban raises no revenue and may encourage related crime", "A ban always raises the price, whereas a tax always lowers it", "A tax creates an illegal market, whereas a ban does not", "They have exactly the same effects on price, crime and government revenue"],
  s: "Kitaba göre vergiyle de yasakla benzer bir tüketim düşüşü sağlanabilir, ama <b>diğer etkiler farklıdır</b>:<br>• <b>Fiyat</b>: vergide fiyat kesin yükselir; yasakta daha yüksek ya da düşük olabilir.<br>• <b>Gelir</b>: vergi devlete gelir sağlar; yasak sağlamaz (üstelik denetim maliyeti vardır).<br>• <b>Suç</b>: yasak, yasadışı piyasa ve ona bağlı suçları besleyebilir.<br>• <b>Algı</b>: yasal ve vergili ürün toplumda daha 'kabul edilebilir' görülebilir.<br>Çok yüksek vergi de kaçakçılığa yol açabilir ama vergi kendi başına yasadışı piyasa yaratmaz." },
{ l: 3, q: "A government bans a drug and decides to punish USERS very heavily, while dealers face only light penalties and are rarely caught. Compared with a free market, what is the likely outcome?",
  o: ["Quantity falls, and the price may be lower than in a free market, because demand falls much more than supply", "Quantity rises and the price rises", "Quantity falls and the price must be higher than in a free market", "Neither price nor quantity changes, because dealers are not affected"],
  s: "Ceza ve yakalanma riski ağırlıkla <b>kullanıcılarda</b> → birçok kişi almaktan vazgeçer → <b>talep çok sola</b> kayar. Satıcıların riski düşük → <b>arz az sola</b> kayar.<br>• Miktar: iki eğri de sola kaydığı için <b>kesin düşer</b>.<br>• Fiyat: talep, arzdan çok daha fazla düştüğü için fiyat serbest piyasadakinden <b>düşük</b> bile olabilir.<br>Önceki sorunun tersi: orada ceza satıcılardaydı ve fiyat yükseliyordu. Kitabın kuralı: fiyat, <b>kimin daha ağır cezayla ve yakalanma olasılığıyla</b> karşılaştığına bağlıdır. 'Fiyat mutlaka yükselir' yanlıştır." },
];

Q.t14 = [
{ l: 1, q: "Why are individual farmers described as price takers?",
  o: ["Each farmer is tiny relative to the whole market, so cannot influence the price", "The government sets all agricultural prices", "Farmers always accept low prices voluntarily", "Demand for food is perfectly elastic for the whole market"],
  s: "Tarım piyasasında <b>binlerce küçük çiftçi</b> vardır ve her biri piyasanın toplamına göre önemsizdir. Bir çiftçi üretimini iki katına çıkarsa bile piyasa fiyatı değişmez, bu yüzden fiyatı olduğu gibi <b>kabul eder</b>: price taker. Kitap bu yüzden serbest tarım piyasasının <b>tam rekabete</b> en yakın gerçek piyasa olduğunu söyler." },
{ l: 1, q: "Agricultural prices fluctuate a lot mainly because:",
  o: ["Supply fluctuates with harvests, and demand is price inelastic", "Demand fluctuates a lot, and supply is perfectly elastic", "Farmers change their prices every day", "Governments change taxes every year"],
  s: "Kitabın özeti: fiyat dalgalanmaları, <b>dalgalanan arzın</b> (hava ve hasada bağlı) <b>fiyat esnek olmayan talep</b> ile birleşmesinin sonucudur. Talep eğrisi dik olduğu için arzdaki küçük kaymalar fiyatta <b>büyük</b> değişimlere yol açar. Bu da çiftçi gelirlerini oynak yapar, tahmin ve yatırımı zorlaştırır." },
{ l: 1, q: "In the EU, 'set-aside' refers to:",
  o: ["Paying farmers to leave some of their land uncultivated", "Storing surplus food in warehouses", "Taxing imported food", "Setting a minimum price for crops"],
  s: "<b>Set-aside</b>, AB'de 1988'de başlayan bir <b>arzı azaltma</b> yöntemidir: çiftçilere topraklarının bir kısmını (ör. %10) <b>boş bırakmaları</b> karşılığında ödeme yapılır. Amaç, yüksek destek fiyatlarının yarattığı fazlaları azaltmaktır. Sorun: çiftçiler en verimsiz topraklarını boş bıraktı, bu yüzden üretim beklenenden az düştü. 2008 reformlarıyla sona erdirildi." },
{ l: 2, q: "One farmer having a bumper harvest becomes richer. But if ALL farmers have a bumper harvest, their total income may fall. This is an example of:",
  o: ["The fallacy of composition", "The identification problem", "Destabilising speculation", "The law of supply"],
  s: "<b>Fallacy of composition</b> (bileşim hatası, Box 3.7): bir birey için doğru olanın herkes için de doğru olduğunu varsaymak. Tek çiftçinin iyi hasadı piyasa fiyatını değiştirmez, daha çok satar ve kazanır. Ama <b>tüm</b> çiftçiler iyi hasat yaparsa piyasa arzı büyük ölçüde artar; talep fiyat esnek olmadığı için fiyat <b>oransal olarak daha çok</b> düşer ve toplam gelir azalır." },
{ l: 2, q: "Which statement about a buffer stock scheme is correct?",
  o: ["It can stabilise prices, but it cannot raise farm incomes over time", "It permanently raises farm prices and incomes", "It increases price fluctuations", "It works by paying farmers not to produce"],
  s: "<b>Buffer stock</b> (tampon stok): bol hasat yıllarında devlet (ya da kurum) ürün satın alıp stoklar, fiyatın çok düşmesini engeller; kıt yıllarda stoktan satar, fiyatın çok yükselmesini engeller. Böylece fiyat ortalama civarında <b>istikrarlı</b> kalır. Ama ortalama fiyatı yükseltmediği için çiftçilerin uzun dönemdeki gelirini <b>artıramaz</b> (fiyat ortalamanın üstünde tutulursa stoklar sürekli büyür). Çiftçiye üretmemesi için ödeme set-aside'dır." },
{ l: 2, q: "Why do farm incomes tend to fall in the long run in a free market?",
  o: ["Demand for food grows slowly (income inelastic), while supply grows rapidly with new technology, and demand is price inelastic", "Demand for food is income elastic and grows faster than supply", "Supply of food is falling over time", "Food is an inferior good"],
  s: "Uzun dönem sorunu iki yönlüdür:<br>• <b>Talep</b>: gıdanın gelir esnekliği düşüktür (0 &lt; YED &lt; 1), gelir artınca talep <b>yavaş</b> büyür.<br>• <b>Arz</b>: yeni teknoloji ve tarım yöntemleri sayesinde <b>hızla</b> büyür.<br>Arz talepten hızlı arttığı için fiyatlar <b>aşağı</b> baskı altındadır. Talep fiyat esnek olmadığı için fiyat düşüşü gelirleri daha da azaltır. Gıda düşük mal değildir: gelir artınca talebi biraz artar." },
{ l: 3, q: "A bumper harvest increases the supply of wheat by 20%. If the price elasticity of demand for wheat is −0.25, by approximately how much must the price fall for the extra wheat to be sold?",
  o: ["80%", "5%", "20%", "25%"],
  s: "Ek 20% buğdayın satılması için talep edilen miktarın %20 artması gerekir.<br>PED = %ΔQ / %ΔP → %ΔP = %ΔQ / PED = 20% / (−0.25) = <b>−80%</b>.<br>Fiyat yaklaşık %80 düşmelidir (yaklaşık bir hesap; bu kadar büyük değişimlerde kesin değer farklı olabilir). Bu, esnek olmayan talebin ne kadar sert fiyat düşüşlerine yol açtığını gösterir. Toplam gelir: yaklaşık 1.2 × 0.2 = 0.24 → eski gelirin dörtte biri! 5% = 20 × 0.25 (yanlış işlem)." },
{ l: 3, q: "Why do critics argue that the traditional CAP system harmed many developing countries?",
  o: ["Surpluses were sold abroad with export subsidies, lowering world prices, while import levies kept developing countries' produce out of the EU", "The CAP gave developing countries too much aid", "The CAP raised world food prices, helping poor farmers", "The CAP banned all food exports"],
  s: "Eski CAP fiyatları dünya fiyatının üstünde tuttu. Bu iki yoldan gelişmekte olan ülkelere zarar verdi:<br>• <b>Değişken ithalat vergileri</b> (variable import levies): ithal ürünleri AB fiyatına kadar pahalılaştırdı, yoksul ülkelerin ihracatını dışarıda tuttu.<br>• <b>İhracat sübvansiyonları</b>: AB fazlası dünya piyasasında ucuza satıldı (dumping), <b>dünya fiyatlarını düşürdü</b> ve oradaki çiftçilerin gelirlerini azalttı.<br>DTÖ müzakerelerinde de büyük konu oldu. Not: kitaba göre reformlarla fiyatlar düşünce AB'ye ayrıcalıklı satış yapan bazı Afrika/Karayip şeker üreticileri ise kaybetti." },
{ l: 3, q: "The 2003 CAP reforms moved towards a 'single farm payment' decoupled from production. What was the main economic purpose?",
  o: ["To support farm incomes without giving farmers an incentive to overproduce, so reducing surpluses", "To raise intervention prices and increase output", "To end all financial support for farmers", "To increase export subsidies"],
  s: "Eski sistemde destek <b>üretime bağlıydı</b>: ne kadar çok üretirsen o kadar çok destek alırdın → fazla üretim, tereyağı dağları, şarap gölleri. <b>Decoupling</b> (üretimden ayırma): ödeme, çiftliğin geçmişte (2000-2002) aldığı desteğe göre ve <b>çevre şartlarına</b> bağlı yapılır, üretilen miktara bağlı değildir. Böylece çiftçi geliri desteklenir ama <b>üretimi artırma teşviki</b> ortadan kalkar → fazlalar azalır, tüketiciye fiyatlar düşer. Destek sona ermedi, vergi mükellefleri finanse etmeye devam etti." },
];
